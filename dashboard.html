/* ── D1-ความเร็ว · 2 ก.ย. 2026 ─────────────────────────────────────────────
   เลิกยิงเน็ตขอโปรไฟล์ทุกครั้งที่เปิดหน้า
   ทำไม: liff.getProfile() คุยกับเซิร์ฟเวอร์ LINE 1 รอบ (ราว 0.3-0.8 วิ) ทุกครั้ง
         ทั้งที่ตั๋วที่อยู่ในมือเราอยู่แล้วมีทั้งรหัสไลน์และชื่ออยู่ข้างใน
         และตั้งแต่มีด่าน D1 หลังบ้านก็ไม่เชื่อ userId ที่หน้าเว็บส่งไปแล้วด้วย
   ปลอดภัย: ถ้าอ่านจากตั๋วไม่ได้ (เช่น LIFF app ไม่ได้ติ๊ก openid) จะถอยไปใช้วิธีเดิมเอง
            ⇒ แย่ที่สุดคือ "เท่าเดิม" เป็นไปไม่ได้ที่จะพังเพราะก้อนนี้
   รูปร่างที่คืนออกมาเหมือน getProfile() เป๊ะ ⇒ โค้ดส่วนอื่นไม่ต้องแก้เลย */
function โปรไฟล์เร็ว_() {
  try {
    var d = liff.getDecodedIDToken();
    if (d && d.sub) return { userId: d.sub, displayName: d.name || '', pictureUrl: d.picture || '' };
  } catch (e) {}
  return null;                       // อ่านไม่ได้ = คืน null ให้ผู้เรียกถอยไปใช้ getProfile() เดิม
}

  /* 🔴 S2 ต่อให้จบ · 21 ก.ย. 2026 20:40

  async function act(sheet, id, status){
    const card=document.getElementById('card-'+sheet+'-'+id);
    const note=(document.getElementById('n-'+sheet+'-'+id)||{}).value||'';
    card.style.opacity=.5;
    try{
      const res = await (await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"update_status",userId:userId,sheet:sheet,id:id,status:status,note:note.trim()})})).json();
      if(!res.ok){ alert(res.error==='NOTE_NOT_SAVED' ? "แถบนี้บันทึกโน้ตไม่ได้ (ชีตไม่มีช่องโน้ต) — ลบข้อความในช่องโน้ต แล้วกดใหม่" : "ไม่สำเร็จ: "+res.error); card.style.opacity=1; return; }   /* 🆕 รอบ 56 */
      const key = sheet==='Reports'?'reports':sheet==='Support'?'support':'referrals';
      const item = D[key].find(x=>x.id===id);
      if(status==='เสร็จ'){ D[key]=D[key].filter(x=>x.id!==id); card.remove(); }
      else { if(item) item.status='กำลังทำ'; tab(cur); }
      setBadges();
    }catch(e){ try{console.error(e);}catch(_e){} /* รอบ 52: จอ D1 ขึ้นแล้ว = ไม่ซ้อนกล่องเด้ง · ไม่โชว์ข้อความภาษาเครื่อง */ if(!document.getElementById('_d1จอ')) alert("ทำรายการไม่สำเร็จ กรุณาลองใหม่อีกครั้ง"); card.style.opacity=1; }
  }

  /* ══ 🆕 รอบ 56 · 5 ต.ค. 2026 (ใบงาน 06 ส่วน 2 · A1+C) แถบ "ประวัติการป่วย" อ่านอย่างเดียว ══
     · ข้อมูลจากคำสั่ง sick_list — หลังบ้านตรวจสิทธิ์เอง (แอดมินทุกคน ตามเจ้าของ 5 ต.ค.) · แถบขึ้นเฉพาะเมื่อ dashboard ตอบ sickTab:true

       ห้ามขึ้น "ไม่มีรายการ" ตอนโหลดไม่สำเร็จหรือยังไม่ทราบ
     · ค่าเริ่มต้น 7 วันล่าสุด (นับจากเวลาเซิร์ฟเวอร์ตอนอ่าน) + ปุ่มดูรายการเก่ากว่า · หายจากจอ ≠ จัดการเสร็จ */
  let SK = { st:'idle', d:null, err:'', เก่า:false, เฉพาะพลาด:false };
  const SK_วัน = 7;
  async function โหลดป่วย_(){

      else { SK.st='err'; SK.err=(r && r.error) ? String(r.error) : 'BAD_RESPONSE'; }

    ป้ายป่วย_();

  function ป้ายป่วย_(){

  function ป่วยการ์ด_(x){

    const ส = x.send==='ok' ? ['ok','ส่งสำเร็จ'] : x.send==='fail' ? ['fail','ส่งไม่สำเร็จ'] : ['unk','ยังไม่ทราบ'];

  function ป่วยHTML_(){
    const หมายเหตุ = '<div class="sk-note">ℹ️ <b>ส่งไลน์สำเร็จ ไม่ได้แปลว่ามีคนรับเรื่องแล้ว</b><br>แถบนี้ดูได้อย่างเดียว ยังไม่มีปุ่มรับเรื่อง — รับเรื่องในไลน์ตามเดิม แล้วบันทึกผลการประสานงานใน<b>เคส</b> (📋 เปิดเคส) โดยอ้างเลขเรื่อง · ห้ามลงอาการหรือข้อมูลสุขภาพ</div>';   /* 🆕 รอบ 58 (23 ต.ค.): ให้ตรงมติ 99ฎ — ผลแจ้งป่วยบันทึกในเคส ไม่ใช่ในไลน์ */
    if(SK.st==='idle' || SK.st==='loading') return หมายเหตุ + '<div class="empty">กำลังโหลดรายการแจ้งป่วย…</div>';
    if(SK.st==='err') return หมายเหตุ + '<div class="sk-box bad">📡 <b>โหลดรายการแจ้งป่วยไม่สำเร็จ</b><br>ยังไม่รู้ว่ามีรายการหรือไม่ — กดลองใหม่'
      + '<div class="hint">code: '+esc(SK.err)+'</div><button class="sk-btn" onclick="โหลดป่วย_()">🔄 ลองใหม่</button></div>';

      + '<div class="hint">code: '+esc(SK.err)+'</div><button class="sk-btn" onclick="โหลดป่วย_()">🔄 ลองใหม่</button></div>';
    if(SK.st!=='ok') return '<div class="empty">บัญชีนี้ไม่มีสิทธิ์ดูรายการแจ้งป่วย</div>';
    const d=SK.d, เส้น=d.asOfMs - SK_วัน*86400000;
    const ใหม่=d.rows.filter(x=> x.ms===null || x.ms>=เส้น), เก่า=d.rows.filter(x=> x.ms!==null && x.ms<เส้น);
    const ชุด = SK.เก่า ? d.rows : ใหม่;

    h += '<div class="sk-filter"><button class="'+(SK.เฉพาะพลาด?'':'on')+'" onclick="กรองป่วย_(false)">ทั้งหมด ('+ชุด.length+')</button>'
      + '<button class="'+(SK.เฉพาะพลาด?'on':'')+'" onclick="กรองป่วย_(true)">ส่งไลน์ไม่สำเร็จ ('+นับ('fail')+')</button></div>';

    if(!แสดง.length) h += '<div class="empty">'+(SK.เฉพาะพลาด ? 'ไม่มีรายการที่ส่งไลน์ไม่สำเร็จ' : 'ไม่มีรายการแจ้งป่วย')+' ('+ช่วง+')</div>';
    else h += แสดง.map(ป่วยการ์ด_).join('');
    if(!SK.เก่า && เก่า.length) h += '<button class="sk-more" onclick="เก่าป่วย_(true)">ดูรายการเก่ากว่า '+SK_วัน+' วัน ('+เก่า.length+' รายการ)</button>';
    else if(SK.เก่า) h += '<button class="sk-more" onclick="เก่าป่วย_(false)">กลับไปดูเฉพาะ '+SK_วัน+' วันล่าสุด</button>';

  /* ══ 🆕 รอบ 57 · 23 ต.ค. 2026 แถบ "ประวัติการหยุด" (มติผู้วางแผน 22 ต.ค. · Q5 หน้าจอ · Q6 ปุ่มพิมพ์) ══
     · ข้อมูลจากคำสั่ง attendance_list — หลังบ้านตรวจแอดมินเอง · แถบขึ้นเฉพาะเมื่อ dashboard ตอบ attTab:true · โหลดครั้งแรกเมื่อกดแถบ
     · ตัวเลข = ยอดวันทำงานในใบเงินเดือน เทียบวันอ้างอิงของไซต์ · ไม่ใช่บันทึกรายวัน/วันลา · เทียบข้ามไซต์ไม่ได้ จึงดูทีละไซต์
     · ไม่มีสีเขียว/เหลือง/แดง (ยังไม่มีเกณฑ์ "หยุดบ่อย" จากเจ้าของ) · ไม่มีข้อมูล = "—" ห้ามแสดง 0
     · โหลดไม่ได้ / ข้อมูลแสดงผลไม่ได้ = "ยังโหลดข้อมูลไม่ได้" + ปุ่มลองใหม่ (ห้ามขึ้นรายการว่าง · ห้ามค้างที่กำลังโหลด)
     · ทุกค่าจากไฟล์ผ่าน esc() ก่อนลงหน้า (ชื่อ ไซต์ ตัวเลข) — ผลตรวจอิสระ ค1
     · ปุ่มพิมพ์ = หน้าพิมพ์แยกหน้าต่อไซต์ (print CSS · A4 แนวนอน · หัวไซต์และบรรทัด "พิมพ์จากจอ เมื่อ" ซ้ำทุกหน้า) ใช้บน Chrome คอม
       ในแอป LINE สั่งพิมพ์ไม่ได้ จึงบอกวิธีเปิดในเบราว์เซอร์ */
  let AT = { st:'idle', d:null, sick:null, err:'', site:'', open:{}, left:false, view:[], hint:false };
  const AT_ป้ายสั้น = { 'เพิ่งเข้า':'ใหม่', 'ไม่พบงวดถัดไป/ออกแล้ว':'ออก', 'ย้ายกลางงวด':'ย้าย', 'ไม่มีวันทำงานในงวด':'วัน 0' };
  const AT_เริ่มป่วย = '2026-11-05';
  function น_(x){ if(x===null || x===undefined || x==='') return '—'; const n=Number(x); return isFinite(n) ? String(Math.round(n*10)/10) : '—'; }
  function ตน_(x){ return esc(น_(x)); }                                  /* ตัวเลขลงหน้า = ผ่าน esc เสมอ */
  function รอย_(x){ return (x==null || !isFinite(Number(x))) ? '—' : esc(String(Math.round(Number(x))))+'%'; }
  function งวดของ_(k){ return ((AT.d && AT.d.periods) || []).find(p=>p.key===k) || null; }
  function ป้ายงวด_(k){ const p=งวดของ_(k); return p ? (p.label || p.key) : String(k); }
  function ออกแล้วไหม_(p){ return p.status==='ออก' || (p.tags||[]).indexOf('ออกแล้ว')>-1; }
  function ไซต์เรียง_(){
    return (((AT.d && AT.d.sites) || []).slice()).sort((a,b)=> ((a.ended?1:0)-(b.ended?1:0)) || (b.people.length-a.people.length) || String(a.site).localeCompare(String(b.site),'th'));
  }
  function ไซต์นี้_(){ return ((AT.d && AT.d.sites) || []).find(s=>s.site===AT.site) || null; }
  function รวมค่า_(o){ let n=0; Object.keys(o||{}).forEach(k=>{ const v=o[k]; if(v && typeof v==='object') n+=รวมค่า_(v); else if(isFinite(Number(v))) n+=Number(v); }); return n; }
  /* % มาทำงานเฉลี่ยของไซต์ = วันทำงานรวม ÷ วันอ้างอิงรวม ของทุกคนในงวดที่นับ (ถ่วงตามวัน) */
  function เฉลี่ยไซต์_(s){
    let ทำ=0, อ้าง=0, คน=0;
    (s.people||[]).forEach(p=>{ if(p.n>0 && isFinite(Number(p.days)) && Number(p.base)>0){ ทำ+=Number(p.days); อ้าง+=Number(p.base); คน++; } });
    return อ้าง>0 ? { pct: Math.round(ทำ/อ้าง*100), ทำ: ทำ, อ้าง: อ้าง, คน: คน } : null;
  }
  function เรียงคน_(a){
    return a.slice().sort((x,y)=>{

    else h+=ทำ.map((p,i)=>คนHTML_(p,i)).join('');
    if(ออก.length){
      h+='<button class="at-left" onclick="ออกแล้ว_('+(AT.left ? 'false' : 'true')+')">'+(AT.left ? 'ซ่อนคนที่ออกแล้ว' : 'ดูคนที่ออกแล้ว ('+ตน_(ออก.length)+' คน)')+'</button>';
      if(AT.left) h+=ออก.map((p,j)=>คนHTML_(p, ทำ.length+j)).join('');
    }
    h+='<div class="at-foot"><b>วิธีอ่าน</b><br>· ไม่มา = วันอ้างอิงของไซต์ − วันทำงานในใบ (ต่ำสุด 0) · ทศนิยมตามใบ เช่น 0.5 = ครึ่งวัน<br>'
      + '· % มาทำงาน = วันทำงาน ÷ วันอ้างอิง ของงวดที่นับ · ค่าเฉลี่ยไซต์ถ่วงตามวัน<br>'
      + '· % มาทำงานเกิน 100% = ทำงานมากกว่าวันอ้างอิง (เช่นมาวันหยุด) · % คิดจากยอดรวม ส่วน "ไม่มา" คิดรายงวด (งวดที่ทำเกินไม่หักลบงวดที่ขาด) จึงอาจเห็น "ไม่มา 1 วัน · มาทำงาน 100%" ได้<br>'
      + '· แจ้งป่วย (ตั้งแต่ 5 พ.ย. 69) = จำนวนวันที่แจ้งป่วยในงวด · "ไม่มาโดยไม่ได้แจ้งป่วย อย่างน้อย" = ไม่มา − แจ้งป่วย รายงวด (ติดลบ = 0) รวมเฉพาะงวดที่เริ่มหลัง 5 พ.ย. · เป็นค่าต่ำสุด เพราะใบไม่มีรายวัน จึงไม่รู้ว่าวันที่แจ้งป่วยตรงกับวันที่ไม่มาหรือไม่<br>'
      + '· วันอ้างอิง "ประมาณ" = ค่าที่คนส่วนใหญ่ในไซต์ทำ (ตั้งแต่ครึ่งหนึ่งขึ้นไป) · "ยืนยันโดย HR" = คุณโบยืนยัน · "ยังไม่มีวันอ้างอิง" = ระบบเดาไม่ได้ (ว่างดีกว่าผิด)<br>'
      + '· ยอดรวมคิดเฉพาะงวดที่นับ (n/N) · งวดที่เพิ่งเข้า / ไม่พบงวดถัดไป-ออกแล้ว / ย้ายกลางงวด / วันทำงาน 0 ไม่ถูกนับ<br>'
      + '· เทียบข้ามไซต์ไม่ได้ เพราะแต่ละไซต์วันทำงานเต็มไม่เท่ากัน · ข้อมูลอัปเดตหลังปิดงวดเงินเดือน'
      + (ไม่รวม ? '<br>· ไม่รวม '+ตน_(ไม่รวม)+' แถวที่จับคู่ทะเบียนไม่ได้/แถวว่าง (รายละเอียดในรายงานสร้างข้างไฟล์ข้อมูล)' : '')
      + (m.gaps && m.gaps.length ? '<br>· ข้อมูลที่ยังไม่มี: '+esc(m.gaps.join(' · ')) : '')
      + '<br>· แหล่งข้อมูล: '+esc(m.source || '—')+'</div>';
    return h;
  }
  /* ── พิมพ์ (Q6): หน้าพิมพ์แยกต่างหาก แยกหน้าต่อไซต์ · ไม่แตะหน้าจอที่ใช้อยู่ ── */
  function พิมพ์หยุด_(ทั้งหมด){
    if(AT.st!=='ok') return;
    let ในไลน์=false;
    try{ ในไลน์ = !!(window.liff && typeof liff.isInClient==='function' && liff.isInClient()); }catch(e){}
    if(ในไลน์){ AT.hint=true; tab('at'); return; }
    const box=document.getElementById('at-print'); if(!box) return;
    let เนื้อ='';
    try{
      const ss = ทั้งหมด ? ไซต์เรียง_() : [ไซต์นี้_()].filter(Boolean);
      if(!ss.length) return;
      let เวลา='';
      try{ เวลา=new Date().toLocaleString('th-TH',{ day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }catch(e){ เวลา=String(new Date()); }
      เนื้อ=ss.map(s=>หน้าพิมพ์_(s,เวลา)).join('');
    }catch(e){ try{ console.error(e); }catch(_e){} AT.st='err'; AT.err='ATTENDANCE_SHAPE'; tab('at'); return; }
    box.innerHTML=เนื้อ;
    document.body.classList.add('at-printing');
    const คืน=()=>{ document.body.classList.remove('at-printing'); box.innerHTML=''; window.removeEventListener('afterprint',คืน); };
    window.addEventListener('afterprint',คืน);
    setTimeout(()=>{ try{ window.print(); }catch(e){ คืน(); } }, 60);
  }
  function หน้าพิมพ์_(s,เวลา){
    const m=AT.d.meta||{}, ord=s.periods||[], ok=(ป่วยสถานะ_()==='ok'), ฉ=เฉลี่ยไซต์_(s);
    const คอล=ord.length+7+(ok?2:0);
    const ช่วง=ord.length ? ป้ายงวด_(ord[0])+' ถึง '+ป้ายงวด_(ord[ord.length-1]) : '—';
    let h='<section class="atp"><h1>วันไม่มาทำงาน (เทียบวันอ้างอิง) — ไซต์ '+esc(s.site)+'</h1>';
    h+='<div class="s">งวด '+esc(ช่วง)+' · '+ตน_(s.people.length)+' คน (ทำงานอยู่ '+ตน_(s.n_active)+' · ออกแล้ว '+ตน_(s.n_left)+')'
      + ' · มาทำงานเฉลี่ย '+(ฉ ? รอย_(ฉ.pct) : '—')+' · ข้อมูลอัปเดตเมื่อ '+esc(m.built_th || '—')+' · แหล่ง: '+esc(m.source || 'ใบทำเงินเดือนของคุณโบ')+'</div>';
    const โน้ต=m.notes && m.notes[s.site]; const ไม่รวม=รวมค่า_(s.excluded);
    h+='<div class="def">คำนวณจากยอดวันทำงานในใบเงินเดือน เทียบวันอ้างอิงของไซต์ (ค่าที่คนส่วนใหญ่ทำ) · ไม่ใช่บันทึกรายวันหรือวันลา · ไม่มา = วันอ้างอิง − วันทำงาน (ต่ำสุด 0) · % มา = วันทำงาน ÷ วันอ้างอิง · ยอดรวมคิดเฉพาะงวดที่นับ (n/N) · '
      + 'ช่องงวด: ตัวหนา = วันไม่มา · "ทำ" = วันทำงานในใบ · ตัวเอียง = ป้ายที่ทำให้ไม่นับ · "—" = ไม่มีวันอ้างอิง · ช่องว่าง = ไม่มีชื่อในใบงวดนั้น'
      + (โน้ต ? '<br>หมายเหตุไซต์: '+esc(โน้ต) : '')+(ไม่รวม ? '<br>ไม่รวม '+ตน_(ไม่รวม)+' แถวที่จับคู่ทะเบียนไม่ได้' : '')+'</div>';
    /* หัวตาราง + ท้ายตาราง ซ้ำทุกหน้าที่ไซต์นี้ยาวต่อ (ผลตรวจ ค3) */
    h+='<table><thead><tr class="sh"><th colspan="'+คอล+'">ไซต์ '+esc(s.site)+' · วันไม่มาทำงาน (เทียบวันอ้างอิง) · งวด '+esc(ช่วง)+'</th></tr>';
    h+='<tr><th style="width:4%">#</th><th style="width:19%">ชื่อ</th>';
    ord.forEach(k=>{ const t=อ้างอิงข้อความ_(s,k,true), มี=/วัน/.test(t); h+='<th>'+esc(ป้ายงวด_(k))+'<span class="bh'+(มี ? '' : ' no')+'">'+esc(มี ? 'อ้างอิง '+t : t)+'</span></th>'; });
    h+='<th>งวดที่นับ</th><th>ทำ / อ้างอิง</th><th>ไม่มา (วัน)</th><th>% มา</th><th>งวด วัน 0</th>'+(ok ? '<th>แจ้งป่วย (วัน)</th><th>ไม่มาโดยไม่ได้แจ้งป่วย (อย่างน้อย · งวดหลัง 5 พ.ย.)</th>' : '')+'</tr></thead>';
    h+='<tfoot><tr><td colspan="'+คอล+'" class="tf">ไซต์ '+esc(s.site)+' · พิมพ์จากจอ เมื่อ '+esc(เวลา)+' · ข้อมูลอัปเดตเมื่อ '+esc(m.built_th || '—')+' · ข้อมูลภายใน ห้ามเผยแพร่ · '+esc(ป่วยหัว_())+'</td></tr></tfoot><tbody>';
    const ทำ=เรียงคน_(s.people.filter(p=>!ออกแล้วไหม_(p))), ออก=เรียงคน_(s.people.filter(ออกแล้วไหม_));
    let ลำดับ=0;
    const แถว=p=>{
      ลำดับ++;
      let r='<tr><td class="c">'+ลำดับ+'</td><td>'+esc(p.name)+' <span class="d" style="display:inline">#'+esc(p.card)+'</span>'
        + ((p.tags||[]).filter(t=>t!=='ออกแล้ว').map(t=>'<span class="f">'+esc(t)+'</span>').join(''))+'</td>';
      ord.forEach(k=>{
        const x=(p.hist||[]).find(y=>y.p===k), g=งวดของ_(k);
        if(g && g.missing){ r+='<td class="c"><span class="f">ไม่มีใบ</span></td>'; return; }
        if(!x){ r+='<td></td>'; return; }
        const ทำ_='<span class="d">ทำ '+ตน_(x.days)+'</span>';
        if(x.flags && x.flags.length) r+='<td class="c"><span class="f">'+esc(x.flags.map(f=>AT_ป้ายสั้น[f]||f).join(' · '))+'</span>'+ทำ_+'</td>';
        else if(x.counted) r+='<td class="c"><span class="a">'+ตน_(x.absent)+'</span>'+ทำ_+'</td>';
        else r+='<td class="c"><span class="a">—</span>'+ทำ_+'</td>';
      });
      r+='<td class="c">'+ตน_(p.n)+'/'+ตน_(p.N)+'</td><td class="c">'+((p.n>0) ? ตน_(p.days)+' / '+ตน_(p.base) : 'ทำรวม '+ตน_(p.days_all))+'</td>';
      r+='<td class="c"><span class="a">'+((p.n>0) ? ตน_(p.absent) : '—')+'</span></td><td class="c">'+รอย_(p.pct)+'</td><td class="c">'+ตน_(Number(p.zero)||0)+'</td>';
      if(ok) r+='<td class="c">'+ตน_(p.sick)+'</td><td class="c">'+ตน_(ไม่แจ้งคน_(p))+'</td>';
      return r+'</tr>';
    };
    ทำ.forEach(p=>{ h+=แถว(p); });
    if(ออก.length){ h+='<tr class="grp"><td colspan="'+คอล+'">ออกแล้ว (ตามทะเบียน) '+ตน_(ออก.length)+' คน</td></tr>'; ออก.forEach(p=>{ h+=แถว(p); }); }
    h+='</tbody></table></section>';
    return h;
  }

  main();
</script>
