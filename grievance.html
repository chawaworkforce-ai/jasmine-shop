/* ── D1-ความเร็ว · 2 ก.ย. 2026 ─────────────────────────────────────────────
   เลิกยิงเน็ตขอโปรไฟล์ทุกครั้งที่เปิดหน้า
   ทำไม: liff.getProfile() คุยกับเซิร์ฟเวอร์ LINE 1 รอบ (ราว 0.3-0.8 วิ) ทุกครั้ง

   ปลอดภัย: ถ้าอ่านจากตั๋วไม่ได้ (เช่น LIFF app ไม่ได้ติ๊ก openid) จะถอยไปใช้วิธีเดิมเอง
            ⇒ แย่ที่สุดคือ "เท่าเดิม" เป็นไปไม่ได้ที่จะพังเพราะก้อนนี้
   รูปร่างที่คืนออกมาเหมือน getProfile() เป๊ะ ⇒ โค้ดส่วนอื่นไม่ต้องแก้เลย */
function โปรไฟล์เร็ว_() {
  try {
    var d = liff.getDecodedIDToken();
    if (d && d.sub) return { userId: d.sub, displayName: d.name || '', pictureUrl: d.picture || '' };
  } catch (e) {}
  return null;                       // อ่านไม่ได้ = คืน null ให้ผู้เรียกถอยไปใช้ getProfile() เดิม
}


/* ═══════════════════════════════════════════════════════════════════
   D1 — เติม "ตั๋วยืนยันตัวตน" ให้ทุกคำขอที่ยิงไปหลังบ้าน   (2 ก.ย. 2026)
   แทรกที่เดียว ครอบทุกจุดที่หน้านี้ยิง API_URL — ไม่ต้องแก้ทีละจุด
   · เติม idToken อัตโนมัติทุกคำขอ
   · คำสั่ง "อ่าน" ยิงไม่ออก → ลองใหม่อัตโนมัติ 1 ครั้ง (สคริปต์หลังบ้านเย็นตอนคำขอแรกของวัน)
   · คำสั่ง "เขียน" ห้ามลองใหม่เด็ดขาด — จะได้ข้อมูลซ้ำ
   · ตั๋วหมดอายุ (~1 ชม.) → ขึ้นหน้าจอ "เข้าใหม่" ให้กดปุ่มเดียว

(function () {
  var _ยิงเดิม = window.fetch;
  var คำสั่งเขียน_ = { report:1, kpi:1, support:1, grievance:1, refer_worker:1, refer_broker:1,

  var เตือนแล้ว_ = false;

  function หนี_(s) {

  /* จอเต็มหน้าที่ใช้ร่วมกันทุกกรณี — ทับหน้าเดิมไว้ ไม่ให้น้องเห็นข้อความดิบ */
  function จอ_(html, ปิดได้) {

  /* ── ของใหม่ 3 ก.ย. 2026 ──────────────────────────────────────────

  function กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ) {
    var เวลา = '';

      'background:#f4f4f4;border-radius:10px;padding:10px 12px;font-size:11px;color:#444;' +
      'text-align:left;word-break:break-all;line-height:1.5;-webkit-user-select:text;user-select:text">' +
      '<b>D1-ERR</b> · not-json<br>' +

      'action: ' + หนี_(คำสั่ง) + '<br>' +
      'time: ' + หนี_(เวลา) + '<br>' +
      'body: ' + หนี_(String(ต้นข้อความ || '').replace(/\s+/g, ' ').slice(0, 300)) +
      '</div>';
  }

  function หน้าคำตอบเพี้ยน_(เขียน, รหัส, คำสั่ง, ต้นข้อความ) {
    if (เขียน) {
      จอ_('<div style="font-size:56px">⚠️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ส่งแล้ว แต่ยังไม่รู้ผล</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        '🔴 <b>อย่ากดส่งซ้ำ</b> — ให้แจ้งผู้ดูแลตรวจให้ก่อน<br>' +
        'Sent, but result unknown. Do NOT send again.<br>' +
        'ပို့ပြီးပါပြီ။ ရလဒ်ကို မသိရသေးပါ။<br>ထပ်မပို့ပါနှင့်။ အက်ဒမင်ကို ဆက်သွယ်ပါ။</div>' +
        '<button id="_d1ปิด" style="margin-top:22px;padding:14px 28px;border:0;border-radius:12px;' +
        'background:#8a8a8a;color:#fff;font-size:16px;font-weight:700">ปิด / Close</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    } else {
      จอ_('<div style="font-size:56px">📡</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">โหลดข้อมูลไม่สำเร็จ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        'เซิร์ฟเวอร์ตอบกลับมาไม่ถูกต้อง กรุณากดลองใหม่<br>' +
        'Could not load. Please try again.<br>' +
        'ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။<br>ထပ်မံ ကြိုးစားပါ။</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔄 ลองใหม่ / ထပ်စမ်းရန်</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    }
  }

  /* คืนวัตถุที่หน้าเว็บเรียก .json() / .text() / .clone() ได้เหมือน Response เดิม
     (จำเป็นเพราะเราอ่าน body ไปแล้ว 1 ครั้ง อ่านซ้ำจาก Response จริงไม่ได้) */
  function ห่อ_(r) {
    var เนื้อ = r.txt;
    var วัตถุ = {
      ok: r.res ? !!r.res.ok : false,
      status: r.res ? r.res.status : 0,
      statusText: r.res ? r.res.statusText : '',
      headers: r.res ? r.res.headers : null,
      text: function () { return Promise.resolve(เนื้อ); },
      json: function () {
        return r.ดี ? Promise.resolve(r.j)
                    : Promise.reject(new SyntaxError('D1: server did not return JSON'));
      }
    };
    วัตถุ.clone = function () { return วัตถุ; };
    return วัตถุ;
  }

  window.fetch = function (u, o) {
    if (String(u) !== API_URL) return _ยิงเดิม.apply(this, arguments);

    var ก้อน = {};
    try { ก้อน = JSON.parse((o && o.body) || '{}'); } catch (e) { ก้อน = {}; }
    var ตั๋ว = null;
    try { ตั๋ว = liff.getIDToken(); } catch (e) {}
    if (ตั๋ว) ก้อน.idToken = ตั๋ว;

    var opt = { method: 'POST', body: JSON.stringify(ก้อน) };
    if (o) { for (var k in o) if (k !== 'method' && k !== 'body') opt[k] = o[k]; }

    var เขียน = !!คำสั่งเขียน_[ก้อน.action];
    var ลองใหม่ได้ = !เขียน;

    function รอ_(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function ยิงแล้วอ่าน_() {
      return _ยิงเดิม(u, opt).then(function (res) {
        return res.text().then(function (txt) {
          var j = null, ดี = false;
          try { j = JSON.parse(txt); ดี = true; } catch (e) {}
          return { res: res, txt: txt, j: j, ดี: ดี };
        }, function () {
          return { res: res, txt: '', j: null, ดี: false };
        });
      });
    }

    /* ชั้น 1 — ยิงไม่ออกเลย (เน็ตหลุด): ลองใหม่ 1 ครั้งเฉพาะคำสั่งอ่าน (ของเดิม) */
    var งาน = ยิงแล้วอ่าน_()['catch'](function (e) {
      if (!ลองใหม่ได้) throw e;
      return รอ_(1500).then(ยิงแล้วอ่าน_);
    });

    /* ชั้น 2 — ยิงออกแต่คำตอบไม่ใช่ JSON: ลองใหม่ 1 ครั้งเฉพาะคำสั่งอ่าน (ของใหม่) */
    งาน = งาน.then(function (r) {
      if (r.ดี || !ลองใหม่ได้) return r;
      return รอ_(1200).then(ยิงแล้วอ่าน_)['catch'](function () { return r; });
    });

    return งาน.then(function (r) {
      if (!r.ดี) {
        หน้าคำตอบเพี้ยน_(เขียน, r.res ? r.res.status : 0, ก้อน.action, r.txt);

        หน้าเข้าใหม่_(!ตั๋ว);
      }
      return ห่อ_(r);
    });
  };
})();
  let userId=null, displayName=null, cat=null, mode=null, sites=[], msgText='', siteSel='';

  async function main(){

  function render(){

    h+='<h3>How to send <span class="my">ပို့နည်း ရွေးပါ</span></h3><div class="modes">';
    h+='<div class="mode '+(mode==="anon"?"on":"")+'" onclick="pickMode(\'anon\')"><div class="en">Send without my name</div><div class="my">အမည် မထည့်ဘဲ ပို့မည် — P\'Mai won\'t know who you are</div></div>';
    h+='<div class="mode '+(mode==="named"?"on":"")+'" onclick="pickMode(\'named\')"><div class="en">Add my name (so P\'Mai can help me directly)</div><div class="my">အမည်ထည့်မည် — P\'Mai က တိုက်ရိုက် ကူညီနိုင်ရန်</div></div>';
    h+='</div>';
    if(mode==="anon" && sites.length){
      h+='<select id="site" onchange="setSite(this.value)"><option value="">(Optional) Your site / သင့်ဆိုက် — မဖြစ်မနေ မဟုတ်</option>';
      sites.forEach(s=>{ h+='<option value="'+esc(s)+'"'+(siteSel===s?' selected':'')+'>'+esc(s)+'</option>'; });
      h+='</select>';
    }
    h+='<div class="reassure">🤍 Your message goes privately to P\'Mai. If you choose "without my name", we truly will not know who sent it.<br>သင့်စကား P\'Mai ထံ တိုက်ရိုက် ရောက်ပါမည်။ အမည်မထည့်ရင် ဘယ်သူပို့မှန်း ကျွန်ုပ်တို့ မသိပါ။</div>';
    h+='<button class="btn" id="send" onclick="send()">Send / ပို့မည်</button>';
    document.getElementById('wrap').innerHTML=h;
  }

  function setMsg(v){ msgText=v; }
  function setSite(v){ siteSel=v; }
  function pickCat(i){ cat=i; render(); }
  function pickMode(m){ mode=m; render(); }

  async function send(){
    if(cat===null){ alert("Please choose a topic. / အကြောင်းအရာ ရွေးပါ"); return; }
    if(!mode){ alert("Please choose how to send. / ပို့နည်း ရွေးပါ"); return; }
    const msg=(document.getElementById('msg')?document.getElementById('msg').value:'').trim();
    const payload={ action:"grievance", category:CATS[cat][0], message:msg };
    if(mode==="named"){ payload.anonymous=false; payload.userId=userId; payload.display_name=displayName; }
    else { payload.anonymous=true; const se=document.getElementById('site'); if(se&&se.value) payload.site=se.value; } // ไม่ส่ง userId
    const btn=document.getElementById('send'); btn.disabled=true; btn.textContent="Sending…";
    try{
      const res=await (await fetch(API_URL,{method:"POST",body:JSON.stringify(payload)})).json();
      if(!res.ok){ alert("Failed: "+res.error); btn.disabled=false; btn.textContent="Send / ပို့မည်"; return; }
      document.getElementById('wrap').innerHTML='<div class="done"><div class="c">🤍</div><h2>Sent to P\'Mai</h2>'
        +'<p>Thank you for telling us. P\'Mai will take care of it.<br>ပြောပြတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။ P\'Mai က ဂရုစိုက်ပါမည်။</p></div>';
    }catch(e){ alert("Error: "+(e.message||e)); btn.disabled=false; btn.textContent="Send / ပို့မည်"; }
  }

  main();
</script>
</body>
</html>
