   หลักที่ยึด: "อ่านไม่ได้ = เปิดตามปกติ" (fail-open)
   ถ้าเน็ตช้า ไฟล์หาย หรือไฟล์เสีย ⇒ หน้าทำงานปกติ ห้ามพังเพราะตัวกันพัง
   ใส่ ?ts= กับ no-store เพื่อไม่ให้ติดแคช 10 นาทีของ GitHub Pages ⇒ ปิดแล้วเห็นผลเกือบทันที */
(function () {
  try {
    if (!window.fetch || !window.AbortController) return;          // เบราว์เซอร์เก่า = เปิดตามปกติ
    var ชื่อหน้า = (location.pathname.split('/').pop() || '').replace(/\.html$/i, '') || 'index';
    var ตัวตัด = new AbortController();
    var นาฬิกา = setTimeout(function () { ตัวตัด.abort(); }, 3000); // เกิน 3 วินาที = เลิกถาม เปิดตามปกติ
    fetch('flags.json?ts=' + Date.now(), { cache: 'no-store', signal: ตัวตัด.signal })
      .then(function (r) { clearTimeout(นาฬิกา); return r.ok ? r.json() : null; })
      .then(function (ธง) {
        if (ธง && String(ธง[ชื่อหน้า] == null ? '' : ธง[ชื่อหน้า]).trim().toLowerCase() === 'off') {
          location.replace('maintenance.html?p=' + encodeURIComponent(ชื่อหน้า));
        }
      })
      .catch(function () { clearTimeout(นาฬิกา); });                 // อ่านไม่ได้ = เปิดตามปกติ
  } catch (e) { /* อะไรก็ตามที่พังตรงนี้ ห้ามทำให้หน้าพัง */ }
})();
</script>

    ["Problem with supervisor","ခေါင်းဆောင်နှင့် ပြဿနာ"],
    ["Sick / health","ဖျားနာ / ကျန်းမာရေး"],
    ["Dorm / housing","အိပ်ဆောင် / နေထိုင်ရေး"],
    ["Pay / money","လစာ / ငွေကြေး"],
    ["Personal / life","ကိုယ်ရေး / ဘဝ ပြဿနာ"],
    ["Other","အခြား"]
  ];

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const _pf=(โปรไฟล์เร็ว_() || await liff.getProfile()); userId=_pf.userId; displayName=_pf.displayName;
      try{ const r=await (await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"site_list"})})).json(); if(r.ok) sites=r.sites||[]; }catch(e){}
      document.getElementById('status').style.display='none';
      document.getElementById('wrap').style.display='block';
      render();
    }catch(e){ document.getElementById('status').textContent="Please open inside LINE app. ("+(e.message||e)+")"; }
  }

  function render(){
    let h='<h3>What would you like to talk about? <span class="my">ဘာအကြောင်း ပြောချင်လဲ</span></h3><div class="cats">';
    CATS.forEach((c,i)=>{ h+='<div class="cat '+(cat===i?'on':'')+'" onclick="pickCat('+i+')"><div class="en">'+esc(c[0])+'</div><div class="my">'+esc(c[1])+'</div></div>'; });
    h+='</div>';
    h+='<h3>Tell us more <span class="my">အသေးစိတ် ပြောပါ</span></h3>';
    h+='<textarea id="msg" oninput="setMsg(this.value)" placeholder="Write here… / ဒီမှာ ရေးပါ…">'+esc(msgText)+'</textarea>';
    h+='<h3>How to send <span class="my">ပို့နည်း ရွေးပါ</span></h3><div class="modes">';
    h+='<div class="mode '+(mode==="anon"?"on":"")+'" onclick="pickMode(\'anon\')"><div class="en">Send without my name</div><div class="my">အမည် မထည့်ဘဲ ပို့မည် — P\'Mai won\'t know who you are</div></div>';
    h+='<div class="mode '+(mode==="named"?"on":"")+'" onclick="pickMode(\'named\')"><div class="en">Add my name (so P\'Mai can help me directly)</div><div class="my">အမည်ထည့်မည် — P\'Mai က တိုက်ရိုက် ကူညီနိုင်ရန်</div></div>';
    h+='</div>';
    if(mode==="anon" && sites.length){
      h+='<select id="site" onchange="setSite(this.value)"><option value="">(Optional) Your site / သင့်ဆိုက် — မဖြစ်မနေ မဟုတ်</option>';
      sites.forEach(s=>{ h+='<option value="'+esc(s)+'"'+(siteSel===s?' selected':'')+'>'+esc(s)+'</option>'; });
      h+='</select>';
    }
    h+='<div class="reassure">🤍 Your message goes privately to P\'Mai. If you choose "without my name", we truly will not know who sent it.<br>သင့်စကား P\'Mai ထံ တိုက်ရိုက် ရောက်ပါမည်။ အမည်မထည့်ရင် ဘယ်သူပို့မှန်း ကျွန်ုပ်တို့ မသိပါ။</div>';
    h+='<button class="btn" id="send" onclick="send()">Send / ပို့မည်</button>';
    document.getElementById('wrap').innerHTML=h;
  }

  function setMsg(v){ msgText=v; }
  function setSite(v){ siteSel=v; }
  function pickCat(i){ cat=i; render(); }
  function pickMode(m){ mode=m; render(); }

  async function send(){
    if(cat===null){ alert("Please choose a topic. / အကြောင်းအရာ ရွေးပါ"); return; }
    if(!mode){ alert("Please choose how to send. / ပို့နည်း ရွေးပါ"); return; }
    const msg=(document.getElementById('msg')?document.getElementById('msg').value:'').trim();
    const payload={ action:"grievance", category:CATS[cat][0], message:msg };
    if(mode==="named"){ payload.anonymous=false; payload.userId=userId; payload.display_name=displayName; }
    else { payload.anonymous=true; const se=document.getElementById('site'); if(se&&se.value) payload.site=se.value; } // ไม่ส่ง userId
    payload.req_id = ก3_เลขคำขอ_('grievance', payload);   /* ก3 รอบ 50: เนื้อเดิม = เลขเดิม */
    const btn=document.getElementById('send'); btn.disabled=true; btn.textContent="Sending…";
    try{
      const res=await (await fetch(API_URL,{method:"POST",body:JSON.stringify(payload)})).json();
      /* 🔴 21 ก.ย. 2026 — เอา alert ออก: ตัวห่อ D1 ขึ้นจอเต็มหน้า 3 ภาษาให้อยู่แล้ว
         ของเดิมเด้งป๊อปอัปข้อความดิบภาษาอังกฤษซ้อนขึ้นมา ผิดกติกา "ห้ามข้อความดิบถึงน้อง" */
      if(!res.ok){ btn.disabled=false; btn.textContent="Send / ပို့မည်"; return; }
      /* ก3 รอบ 50: ok แต่ไม่มี ref = ไม่ใช่คำตอบของคำสั่งนี้ ⇒ ยังไม่ทราบผล · คงเลขคำขอไว้ (กดส่งเนื้อเดิมอีกครั้ง = ไม่ซ้ำ) */
      if(!ก3_สำเร็จจริง_(res)){ btn.disabled=false; btn.textContent="Send / ပို့မည်"; return; }
      ก3_ล้าง_('grievance');
      document.getElementById('wrap').innerHTML='<div class="done"><div class="c">🤍</div><h2>Sent to P\'Mai</h2>'
        +'<p>Thank you for telling us. P\'Mai will take care of it.<br>ပြောပြတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။ P\'Mai က ဂရုစိုက်ပါမည်။</p></div>';
    }catch(e){ /* จอแจ้งเหตุเป็นหน้าที่ของตัวห่อ D1 ที่นี่แค่ปลดปุ่มให้กดใหม่ได้ */
      btn.disabled=false; btn.textContent="Send / ပို့မည်"; }
  }

  /* ── ก3 รอบ 50 (24 ก.ย. 2026): เลขคำขอกันส่งซ้ำ ──
     ผลครั้งก่อนยังไม่ทราบ (หมดเวลา / คำตอบเพี้ยน) แล้วกดส่งเนื้อเดิมอีกครั้ง = ใช้เลขเดิม ⇒ เซิร์ฟเวอร์คืนผลเดิม ไม่บันทึก ไม่แจ้งซ้ำ
     จำในเครื่อง (ต่อคำสั่ง) เฉพาะ "เลขย่อของเนื้อหา" (ไม่เก็บตัวข้อความ) + เลขคำขอ · อายุ 24 ชม.
     สำเร็จแล้วล้างทิ้ง ⇒ ครั้งถัดไปได้เลขใหม่ · เปลี่ยนเนื้อหา = เลขใหม่เอง · เครื่องที่เก็บค่าไม่ได้ = จำในหน้านี้อย่างเดียว */
  var ก3_จำในหน้า_ = {};
  function ก3_ย่อ_(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return s.length + '-' + h.toString(16);
  }
  function ก3_สุ่ม_() {
    var ab = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', s = '', a = null;
    try { a = new Uint32Array(24); crypto.getRandomValues(a); } catch (e) { a = null; }
    for (var i = 0; i < 24; i++) s += ab.charAt((a ? a[i] : Math.floor(Math.random() * 4294967296)) % ab.length);
    return s;
  }
  function ก3_อ่าน_(k) {
    try { var v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) {}
    return ก3_จำในหน้า_[k] || null;
  }
  function ก3_เขียน_(k, v) {
    ก3_จำในหน้า_[k] = v;
    try { if (v) localStorage.setItem(k, JSON.stringify(v)); else localStorage.removeItem(k); } catch (e) {}
  }
  function ก3_เลขคำขอ_(คำสั่ง, เนื้อหา) {
    var k = 'ก3:' + คำสั่ง, f = ก3_ย่อ_(JSON.stringify(เนื้อหา)), เดิม = ก3_อ่าน_(k);
    if (เดิม && เดิม.f === f && เดิม.r && (Date.now() - (เดิม.t || 0)) < 86400000) return เดิม.r;
    var r = ก3_สุ่ม_();
    ก3_เขียน_(k, { f: f, r: r, t: Date.now() });
    return r;
  }
  function ก3_ล้าง_(คำสั่ง) { ก3_เขียน_('ก3:' + คำสั่ง, null); }
  /* คำตอบสำเร็จจริงของ 3 คำสั่งนี้ (เซิร์ฟเวอร์รอบ 50) มีช่อง ref เสมอ · ไม่มี ref = ไม่ใช่คำตอบของคำสั่งนี้ = ยังไม่ทราบผล */
  function ก3_สำเร็จจริง_(j) { return !!(j && j.ok === true && typeof j.ref === 'string'); }

  main();
</script>
