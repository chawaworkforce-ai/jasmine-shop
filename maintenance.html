<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Temporarily closed</title>
<style>
  :root{ --blue:#2a7d9b; --blue-d:#1f5f76; --ink:#1f2b25; --muted:#7b8a82;
         --line:#e7ece9; --bg:#f4f6f5; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        padding:28px 22px; text-align:center; background:var(--bg); color:var(--ink);
        font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Padauk",sans-serif; }
  .box{ max-width:460px; width:100%; }
  .ico{ font-size:58px; line-height:1; margin-bottom:14px; }
  h1{ font-size:19px; font-weight:700; margin:0 0 6px; }
  .th{ font-size:15px; color:#48564f; line-height:1.6; margin:0 0 4px; }
  .my{ font-size:15px; color:#48564f; line-height:1.8; margin:0; }
  .urgent{ margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
  .urgent p{ margin:0 0 3px; font-size:14px; color:var(--muted); line-height:1.6; }
  button{ margin-top:22px; width:100%; background:var(--blue); color:#fff; border:0;
          border-radius:14px; padding:14px; font-size:15px; font-weight:700;
          font-family:inherit; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="ico">🔧</div>
    <h1 id="t_h1">This page is temporarily closed</h1>
    <p class="th" id="t_1_en">Please try again later.</p>
    <p class="my" id="t_1_my"></p>

    <div class="urgent">
      <p id="t_2_en">If urgent, contact your supervisor.</p>
      <p id="t_2_my"></p>
    </div>

    <button id="t_retry">Try again</button>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   maintenance.html — หน้าที่น้องเห็นแทนหน้าปกติเวลาระบบมีปัญหา
   สร้าง 20 ก.ย. 2026 · ไม่มีหลังบ้าน ไม่เรียก LIFF ไม่ยิง API
   ⇒ ใช้ได้แม้ตอนที่หลังบ้านล่มทั้งระบบ ซึ่งเป็นตอนที่ต้องใช้พอดี
   วิธีใช้: เปลี่ยนปุ่มในเมนูให้ชี้มาที่หน้านี้แทนหน้าที่กำลังซ่อม
   ═══════════════════════════════════════════════════════════════════ */
var T = {
  'A5-1': { en:'This page is temporarily closed. Please try again later.',
            th:'หน้านี้ปิดปรับปรุงชั่วคราว กรุณาลองใหม่ภายหลัง',
            my:'' },                      /* ← เติมคำพม่าตรงนี้ 26 ก.ย. */
  'A5-2': { en:'If urgent, contact your supervisor.',
            th:'ถ้าเร่งด่วน ติดต่อหัวหน้างาน',
            my:'' }
};
/* 🔴 น้องเห็นแค่อังกฤษกับพม่า ไทยเก็บไว้ให้เจ้าของกับล่ามอ่านเทียบเท่านั้น
   (หน้าเว็บของน้องทุกหน้าที่มีอยู่เป็นอังกฤษ+พม่า ไม่มีไทย) */
document.getElementById('t_1_my').textContent = T['A5-1'].my || '';
document.getElementById('t_2_my').textContent = T['A5-2'].my || '';

/* ปุ่มลองใหม่: ถ้ามีหน้าก่อนหน้าให้ถอยกลับไปลองใหม่ ถ้าไม่มีก็โหลดหน้านี้ซ้ำ
   ไม่พาไปหน้าอื่นเด็ดขาด เพราะตอนระบบล่ม เราไม่รู้ว่าหน้าไหนยังดีอยู่ */
document.getElementById('t_retry').addEventListener('click', function () {
  if (history.length > 1) { history.back(); } else { location.reload(); }
});
</script>
</body>
</html>
