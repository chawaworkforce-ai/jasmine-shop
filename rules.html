<script>
/* สวิตช์ปิดหน้า (S4-4) 21 ก.ย. 2026 — ปิดหน้าไหนก็ได้โดยแก้ไฟล์ flags.json ไฟล์เดียว
   หลักที่ยึด: "อ่านไม่ได้ = เปิดตามปกติ" (fail-open)
   ถ้าเน็ตช้า ไฟล์หาย หรือไฟล์เสีย ⇒ หน้าทำงานปกติ ห้ามพังเพราะตัวกันพัง
   ใส่ ?ts= กับ no-store เพื่อไม่ให้ติดแคช 10 นาทีของ GitHub Pages ⇒ ปิดแล้วเห็นผลเกือบทันที */
(function () {
  try {
    if (!window.fetch || !window.AbortController) return;          // เบราว์เซอร์เก่า = เปิดตามปกติ
    var ชื่อหน้า = (location.pathname.split('/').pop() || '').replace(/\.html$/i, '') || 'index';
    var ตัวตัด = new AbortController();
    var นาฬิกา = setTimeout(function () { ตัวตัด.abort(); }, 3000); // เกิน 3 วินาที = เลิกถาม เปิดตามปกติ
    fetch('flags.json?ts=' + Date.now(), { cache: 'no-store', signal: ตัวตัด.signal })
      .then(function (r) { clearTimeout(นาฬิกา); return r.ok ? r.json() : null; })
      .then(function (ธง) {
        if (ธง && String(ธง[ชื่อหน้า] == null ? '' : ธง[ชื่อหน้า]).trim().toLowerCase() === 'off') {
          location.replace('maintenance.html?p=' + encodeURIComponent(ชื่อหน้า));
        }
      })
      .catch(function () { clearTimeout(นาฬิกา); });                 // อ่านไม่ได้ = เปิดตามปกติ
  } catch (e) { /* อะไรก็ตามที่พังตรงนี้ ห้ามทำให้หน้าพัง */ }
})();
</script>

         ⇒ ต้องขึ้นจอโหลดไม่ได้ + ปุ่มลองใหม่ (ทิ้งเงียบใช้ได้เฉพาะกับใบที่เก่ากว่าเท่านั้น) */
      if (data.lang && data.lang !== ภาษา){
        /* รีโหลดอัตโนมัติได้ครั้งเดียว และเฉพาะเมื่อพิสูจน์ได้ว่าธงกันวนเขียนติด */
        if (ธงรีโหลด_(true) === false && ธงรีโหลด_(false) === true){ location.reload(); return; }
        จอโหลดไม่ได้_('LANG_MISMATCH'); return;   // รีโหลดแล้วยังเจออีก หรือกันวนไม่ได้ ⇒ หยุด
      }
      ล้างธงรีโหลด_();   // สำเร็จแล้ว ล้างธง ครั้งหน้ารีโหลดได้อีก 1 ครั้ง
      วาด_(data);
    })
    .catch(function(){ if (ของฉัน === เลขคำขอ) จอโหลดไม่ได้_(); });
  }

  function ตั้งปุ่มภาษา_(){
    var en = document.getElementById('btn-en'), mm = document.getElementById('btn-mm');
    function ใช้_(v){
      if (ภาษา === v) return;
      ภาษา = v; จำภาษา_(v);
      en.setAttribute('aria-pressed', v === 'en' ? 'true' : 'false');
      mm.setAttribute('aria-pressed', v === 'mm' ? 'true' : 'false');
      โหลด_();
    }
    en.onclick = function(){ ใช้_('en'); };
    mm.onclick = function(){ ใช้_('mm'); };
    en.setAttribute('aria-pressed', ภาษา === 'en' ? 'true' : 'false');
    mm.setAttribute('aria-pressed', ภาษา === 'mm' ? 'true' : 'false');
    document.getElementById('langbar').style.display = 'flex';
  }

  async function main(){
    ภาษา = ภาษาที่จำไว้_();
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()){ liff.login(); return; }
      โปรไฟล์ = (โปรไฟล์เร็ว_() || await liff.getProfile());
    } catch (e) {
      /* เข้า LIFF ไม่ได้ = จอ error ของก้อนกลางจะขึ้นเอง ไม่ต้องเขียนซ้ำ
         \U0001F534 รุ่น 2: ตั้งธงไว้ ให้ปุ่มลองใหม่เริ่มเข้าใหม่ทั้งหน้า ไม่ใช่ยิงคำขอเปล่า */
      เข้าระบบไม่สำเร็จ = true;
      จอโหลดไม่ได้_();
      return;
    }
    ตั้งปุ่มภาษา_();
    โหลด_();
  }

  main();
</script>
