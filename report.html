<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>รายงานหน้างาน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --green:#2f7d55; --green-d:#256544; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans Thai",sans-serif;
        background:var(--bg); color:var(--ink); }
  header{ background:var(--green); color:#fff; padding:16px; position:sticky; top:0; z-index:5; }
  header h1{ font-size:16px; margin:0; font-weight:600; }
  header p{ font-size:13px; margin:4px 0 0; opacity:.85; }
  #status{ padding:24px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .grid{ padding:12px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .wcard{ background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
          cursor:pointer; transition:transform .05s; }
  .wcard:active{ transform:scale(.97); }
  .ava{ width:100%; aspect-ratio:4/5; background:#e6f0ea; color:var(--green-d);
        display:flex; align-items:center; justify-content:center; font-weight:600; font-size:34px; }
  .ava img{ width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }
  .wbody{ padding:9px 10px 11px; }
  .wname{ font-size:14px; line-height:1.3; font-weight:600; }
  .wsite{ font-size:11px; color:var(--muted); margin-top:2px; }

  /* overlay เลือกหัวข้อ */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; z-index:20; }
  .overlay.open{ display:flex; }
  .sheet{ background:#fff; width:100%; border-radius:18px 18px 0 0; padding:18px 16px 24px; max-height:88vh; overflow:auto; }
  .sheet h2{ font-size:16px; margin:0 0 2px; }
  .sheet .sub{ font-size:12px; color:var(--muted); margin:0 0 14px; }
  .issue{ display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line);
          border-radius:12px; padding:12px 14px; font-size:14.5px; line-height:1.35; margin-bottom:9px; color:var(--ink); cursor:pointer; }
  .issue.sel{ border-color:var(--green); background:#eef6f1; color:var(--green-d); font-weight:600; }
  textarea{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:14px;
            font-family:inherit; resize:none; margin-top:4px; }
  .row{ display:flex; gap:10px; margin-top:14px; }
  .btn{ flex:1; border:0; border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-send{ background:var(--green); color:#fff; }
  .btn-send:disabled{ background:#b9c7c0; }
  .btn-cancel{ background:#eef0ef; color:var(--ink); flex:0 0 90px; }
  .ok{ text-align:center; padding:30px 16px; }
  .ok .check{ font-size:40px; }
</style>
</head>
<body>
  <header>
    <h1>รายงานหน้างาน</h1>
    <p id="hsite">กำลังเชื่อมต่อ…</p>
  </header>
  <div id="status">กำลังโหลด…</div>
  <div class="grid" id="grid" style="display:none"></div>

  <!-- overlay -->
  <div class="overlay" id="ov">
    <div class="sheet">
      <h2 id="ovName">น้อง</h2>
      <p class="sub" id="ovSite"></p>
      <div id="issues"></div>
      <div id="otherWrap" style="display:none">
        <input id="otherText" type="text" placeholder="ระบุเรื่อง…" oninput="updateSend()"
               style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;margin-bottom:4px;">
      </div>
      <textarea id="note" rows="2" placeholder="โน้ตเพิ่มเติม (ถ้ามี)"></textarea>
      <div class="row">
        <button class="btn btn-cancel" onclick="closeOv()">ยกเลิก</button>
        <button class="btn btn-send" id="sendBtn" onclick="submitReport()" disabled>ส่งรายงาน</button>
      </div>
    </div>
  </div>

<script>
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";

/* ── D1-ความเร็ว · 2 ก.ย. 2026 ─────────────────────────────────────────────
   เลิกยิงเน็ตขอโปรไฟล์ทุกครั้งที่เปิดหน้า
   ทำไม: liff.getProfile() คุยกับเซิร์ฟเวอร์ LINE 1 รอบ (ราว 0.3-0.8 วิ) ทุกครั้ง
         ทั้งที่ตั๋วที่อยู่ในมือเราอยู่แล้วมีทั้งรหัสไลน์และชื่ออยู่ข้างใน
         และตั้งแต่มีด่าน D1 หลังบ้านก็ไม่เชื่อ userId ที่หน้าเว็บส่งไปแล้วด้วย
   ปลอดภัย: ถ้าอ่านจากตั๋วไม่ได้ (เช่น LIFF app ไม่ได้ติ๊ก openid) จะถอยไปใช้วิธีเดิมเอง
            ⇒ แย่ที่สุดคือ "เท่าเดิม" เป็นไปไม่ได้ที่จะพังเพราะก้อนนี้
   รูปร่างที่คืนออกมาเหมือน getProfile() เป๊ะ ⇒ โค้ดส่วนอื่นไม่ต้องแก้เลย */
function โปรไฟล์เร็ว_() {
  try {
    var d = liff.getDecodedIDToken();
    if (d && d.sub) return { userId: d.sub, displayName: d.name || '', pictureUrl: d.picture || '' };
  } catch (e) {}
  return null;                       // อ่านไม่ได้ = คืน null ให้ผู้เรียกถอยไปใช้ getProfile() เดิม
}


/* ═══════════════════════════════════════════════════════════════════
   D1 — เติม "ตั๋วยืนยันตัวตน" ให้ทุกคำขอที่ยิงไปหลังบ้าน   (2 ก.ย. 2026)
   แทรกที่เดียว ครอบทุกจุดที่หน้านี้ยิง API_URL — ไม่ต้องแก้ทีละจุด
   · เติม idToken อัตโนมัติทุกคำขอ
   · คำสั่ง "อ่าน" ยิงไม่ออก → ลองใหม่อัตโนมัติ 1 ครั้ง (สคริปต์หลังบ้านเย็นตอนคำขอแรกของวัน)
   · คำสั่ง "เขียน" ห้ามลองใหม่เด็ดขาด — จะได้ข้อมูลซ้ำ
   · ตั๋วหมดอายุ (~1 ชม.) → ขึ้นหน้าจอ "เข้าใหม่" ให้กดปุ่มเดียว
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  var _ยิงเดิม = window.fetch;
  /* 🔴 รายการขาว (S4-1 · 21 ก.ย. 2026) — เปลี่ยนจาก "ไล่ชื่อคำสั่งเขียน" เป็น "ไล่ชื่อคำสั่งอ่าน"
     ของเดิมถามว่า "อยู่ในรายชื่อคำสั่งเขียนไหม" ⇒ คำสั่งที่ไม่อยู่ในรายชื่อจะถูกนับเป็นคำสั่งอ่าน
     แล้ว "ลองยิงใหม่ให้อัตโนมัติ" ⇒ คำสั่งเขียนตัวใหม่ที่ใครเพิ่มทีหลังจะถูกยิงซ้ำโดยไม่มีใครรู้
     ของสดตอนนี้มีคำสั่งเขียนที่ตกหล่นจากรายชื่อเดิมจริง 5 ตัว:
       sick_report · case_open · case_update · customer_announce_prepare · customer_announce_send
     (ทั้ง 5 ตัวฝั่งเซิร์ฟเวอร์มีตัวกันซ้ำด้วย req_id อยู่แล้ว จึงยังไม่เคยเกิดของซ้ำจริง
      แต่เป็นการรอดเพราะด่านชั้นหลัง ไม่ใช่เพราะตัวห่อถูก ⇒ ปิดที่ต้นทาง)
     ของใหม่: ไม่อยู่ในรายการขาว = ถือว่าเป็นคำสั่งเขียน = ไม่ยิงซ้ำ (ปลอดภัยไว้ก่อน) */
  var คำสั่งอ่าน_ = {
    announce_targets:1, case_page:1, company_rules:1, customer_announce_status:1,
    customer_home:1, dashboard:1, grievance_stats:1, matched_list:1, matching_data:1,
    my_score:1, photos:1, site_list:1, support_status:1, worker_reports:1, workers:1
  };
  var เตือนแล้ว_ = false;

  function หนี_(s) {
    return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c];
    });
  }

  /* จอเต็มหน้าที่ใช้ร่วมกันทุกกรณี — ทับหน้าเดิมไว้ ไม่ให้น้องเห็นข้อความดิบ */
  function จอ_(html, ปิดได้) {
    if (เตือนแล้ว_) return;
    เตือนแล้ว_ = true;
    var d = document.createElement('div');
    d.id = '_d1จอ';
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;' +
      'flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;' +
      'text-align:center;overflow:auto;-webkit-overflow-scrolling:touch;' +
      'font-family:-apple-system,"Segoe UI","Sarabun","Noto Sans Myanmar","Padauk",sans-serif');
    d.innerHTML = html;
    document.body.appendChild(d);

    var โหลด = document.getElementById('_d1โหลดใหม่');
    if (โหลด) โหลด.onclick = function () { location.reload(); };

    var ปิด = document.getElementById('_d1ปิด');
    if (ปิด) ปิด.onclick = function () {
      var x = document.getElementById('_d1จอ');
      if (x && x.parentNode) x.parentNode.removeChild(x);
      เตือนแล้ว_ = false;
    };

    var สลับ = document.getElementById('_d1สลับ');
    if (สลับ) สลับ.onclick = function () {
      var x = document.getElementById('_d1รายละเอียด');
      if (x) x.style.display = (x.style.display === 'none' ? 'block' : 'none');
    };
  }

  function หน้าเข้าใหม่_(ไม่มีตั๋วเลย) {
    if (ไม่มีตั๋วเลย) {
      จอ_('<div style="font-size:56px">🔧</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ตั้งค่าแอปยังไม่ครบ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">หน้านี้ยังขอ "ตั๋วยืนยันตัวตน" ไม่ได้<br>' +
        'App setup incomplete — please tell the admin</div>' +
        '<div style="font-size:13px;color:#888;margin-top:14px">แจ้งผู้ดูแลระบบ</div>');
    } else {
      จอ_('<div style="font-size:56px">⏱️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">หมดเวลา — เข้าใหม่</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">Session expired.<br>Please tap the button to continue.</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔑 เข้าใหม่ / Log in again</button>');
    }
  }

  /* ── ของใหม่ 3 ก.ย. 2026 ──────────────────────────────────────────
     คำตอบกลับมาไม่ใช่ JSON (เช่นได้หน้าเว็บ HTML แทน)
     เดิม: `await res.json()` พัง → เอาข้อความดิบภาษาอังกฤษไปแปะบนจอน้อง
     ใหม่: ขึ้นจอ 2 ภาษา + ปุ่มลองใหม่ + รายละเอียดสำหรับผู้ดูแลให้ถ่ายรูปส่งมา
     · คำสั่งอ่าน  → ลองใหม่อัตโนมัติ 1 ครั้งก่อน แล้วค่อยขึ้นจอ
     · คำสั่งเขียน → ห้ามลองใหม่เด็ดขาด (จะได้ข้อมูลซ้ำ) ขึ้นจอ "อย่าส่งซ้ำ"
     ──────────────────────────────────────────────────────────────── */
  function กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ) {
    var เวลา = '';
    try { เวลา = new Date().toLocaleString(); } catch (e) {}
    return '<div id="_d1สลับ" style="margin-top:20px;font-size:12px;color:#9a9a9a;' +
      'text-decoration:underline">รายละเอียดสำหรับผู้ดูแล / details</div>' +
      '<div id="_d1รายละเอียด" style="display:none;margin-top:10px;max-width:100%;' +
      'background:#f4f4f4;border-radius:10px;padding:10px 12px;font-size:11px;color:#444;' +
      'text-align:left;word-break:break-all;line-height:1.5;-webkit-user-select:text;user-select:text">' +
      '<b>D1-ERR</b> · not-json<br>' +
      'code: ' + หนี_(รหัส) + '<br>' +
      'action: ' + หนี_(คำสั่ง) + '<br>' +
      'time: ' + หนี_(เวลา) + '<br>' +
      'body: ' + หนี_(String(ต้นข้อความ || '').replace(/\s+/g, ' ').slice(0, 300)) +
      '</div>';
  }

  function หน้าคำตอบเพี้ยน_(เขียน, รหัส, คำสั่ง, ต้นข้อความ) {
    if (เขียน) {
      จอ_('<div style="font-size:56px">⚠️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ส่งแล้ว แต่ยังไม่รู้ผล</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        '🔴 <b>อย่ากดส่งซ้ำ</b> — ให้แจ้งผู้ดูแลตรวจให้ก่อน<br>' +
        'Sent, but result unknown. Do NOT send again.<br>' +
        'ပို့ပြီးပါပြီ။ ရလဒ်ကို မသိရသေးပါ။<br>ထပ်မပို့ပါနှင့်။ အက်ဒမင်ကို ဆက်သွယ်ပါ။</div>' +
        '<button id="_d1ปิด" style="margin-top:22px;padding:14px 28px;border:0;border-radius:12px;' +
        'background:#8a8a8a;color:#fff;font-size:16px;font-weight:700">ปิด / Close</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    } else {
      จอ_('<div style="font-size:56px">📡</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">โหลดข้อมูลไม่สำเร็จ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        'เซิร์ฟเวอร์ตอบกลับมาไม่ถูกต้อง กรุณากดลองใหม่<br>' +
        'Could not load. Please try again.<br>' +
        'ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။<br>ထပ်မံ ကြိုးစားပါ။</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔄 ลองใหม่ / ထပ်စမ်းရန်</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    }
  }

  /* คืนวัตถุที่หน้าเว็บเรียก .json() / .text() / .clone() ได้เหมือน Response เดิม
     (จำเป็นเพราะเราอ่าน body ไปแล้ว 1 ครั้ง อ่านซ้ำจาก Response จริงไม่ได้) */
  function ห่อ_(r) {
    var เนื้อ = r.txt;
    var วัตถุ = {
      ok: r.res ? !!r.res.ok : false,
      status: r.res ? r.res.status : 0,
      statusText: r.res ? r.res.statusText : '',
      headers: r.res ? r.res.headers : null,
      text: function () { return Promise.resolve(เนื้อ); },
      json: function () {
        return r.ดี ? Promise.resolve(r.j)
                    : Promise.reject(new SyntaxError('D1: server did not return JSON'));
      }
    };
    วัตถุ.clone = function () { return วัตถุ; };
    return วัตถุ;
  }

  window.fetch = function (u, o) {
    if (String(u) !== API_URL) return _ยิงเดิม.apply(this, arguments);

    var ก้อน = {};
    try { ก้อน = JSON.parse((o && o.body) || '{}'); } catch (e) { ก้อน = {}; }
    var ตั๋ว = null;
    try { ตั๋ว = liff.getIDToken(); } catch (e) {}
    if (ตั๋ว) ก้อน.idToken = ตั๋ว;

    var opt = { method: 'POST', body: JSON.stringify(ก้อน) };
    if (o) { for (var k in o) if (k !== 'method' && k !== 'body') opt[k] = o[k]; }

    /* รายการขาว: ลองใหม่ได้เฉพาะคำสั่งที่เรารู้แน่ว่าอ่านอย่างเดียว */
    var ลองใหม่ได้ = !!คำสั่งอ่าน_[ก้อน.action];
    var เขียน = !ลองใหม่ได้;

    /* 🔴 เพดานเวลารอ (S4-2 · 21 ก.ย. 2026) — ปัญหาเดิม: เน็ตหน้างานไม่หลุดแต่ช้ามาก
       fetch จะรอไปเรื่อย ๆ ไม่มีวันจบ น้องเห็นวงกลมหมุนค้างแล้วกดซ้ำ
       ของใหม่: นับเวลารวมทั้งคำขอไม่เกิน 8 วินาที ครบแล้วตัดทิ้งแล้วขึ้นหน้าที่กดต่อได้
       ⇒ เพดานคิดจาก "ทั้งคำขอ" ไม่ใช่ต่อครั้ง ⇒ ถึงจะลองใหม่ ก็ยังเห็นผลภายในเพดาน
       🔴 แก้ 21 ก.ย. 2026 (S4-5) — แยกเพดานตามชนิดคำสั่ง
          อาการ: น้อง/เจ้าของเห็น "โหลดข้อมูลไม่สำเร็จ" ทั้งที่ล็อกหลังบ้านบอกว่าตอบสำเร็จทุกคำขอ
          เหตุ: เพดาน 8 วินาทีคลุมทั้ง (ยิงครั้งแรก + รอ 1.2 วินาที + ยิงซ้ำ)
                เซิร์ฟเวอร์จริงวัดได้ 2.6-3.9 วินาทีต่อครั้ง (ล็อกการรัน 21 ก.ย. 17:21-17:23)
                ⇒ 3.5 + 1.2 + 3.5 = 8.2 วินาที เกินเพดาน ⇒ การยิงซ้ำถูกตัดทิ้งเกือบทุกครั้ง
                ⇒ ตัวห่อคืนคำตอบเสียของรอบแรก แล้วขึ้นจอ "โหลดข้อมูลไม่สำเร็จ"

    var เส้นตาย_ = Date.now() + เพดานรวม_;

  const ISSUES = [
    "เกิดอุบัติเหตุ",
    "ไม่สบาย",
    "แต่งกายไม่เรียบร้อย / ไม่ถูกระเบียบ",
    "เรียนรู้งานช้า",

    "ทำสินค้า/ทรัพย์สินของโรงงานเสียหาย"
  ];
  const OTHER_LABEL = "อื่นๆ (โปรดระบุ)";

  let profile = null, currentWorker = null, selectedIssue = null;

  function setStatus(t){ const s=document.getElementById('status'); s.style.display='block'; s.textContent=t; }
  function hideStatus(){ document.getElementById('status').style.display='none'; }
  function showError(t){ setStatus("⚠️ "+t); }
  function initials(name){ const p=String(name||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }

  /* ── ก4 รอบ 50 (24 ก.ย. 2026): รูปน้องผ่านเส้น photos (มติผู้วางแผนรอบ 49 ก4) ──
     เดิมวาด photo_url จากทะเบียน = ที่อยู่ไดรฟ์ที่เปิดไม่ได้ ⇒ รูปแตก · ใหม่: ขอรูปจากเซิร์ฟเวอร์ด้วยรหัสคน (card_id)
     เซิร์ฟเวอร์ตรวจสิทธิ์ไซต์เอง (น้องไซต์อื่น = UNAVAILABLE) · จับรูปด้วย card_id ไม่ใช้ลำดับแถว · ไม่แก้ที่อยู่รูปเก่าในทะเบียน
     ยิงตรงไม่ผ่านตัวห่อ D1 (เติม ?p=photos ท้ายที่อยู่) เพราะรูปโหลดไม่ขึ้นต้องไม่ขึ้นจอเต็มทับรายชื่อ · พลาดทุกกรณี = คงตัวย่อชื่อไว้ */
  function รูป_กันแท็ก_(s){ return String(s==null?'':s).replace(/[<>&"']/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function โหลดรูปน้อง_(workers){
    try{
      const ids = (workers||[]).map(function(w){ return String(w.card_id||''); }).filter(function(x){ return /^[0-9a-f]{24}$/i.test(x); }).slice(0, 200);
      if(!ids.length) return;
      let ตั๋ว = null; try { ตั๋ว = liff.getIDToken(); } catch(e) {}
      if(!ตั๋ว) return;
      fetch(API_URL + '?p=photos', { method:"POST", body: JSON.stringify({ action:"photos", card_ids: ids, idToken: ตั๋ว }) })
        .then(function(r){ return r.text(); })
        .then(function(txt){
          let j = null; try { j = JSON.parse(txt); } catch(e) { return; }
          if(!j || j.ok !== true || !Array.isArray(j.photos)) return;
          j.photos.forEach(function(p){
            if(!p || p['สถานะ'] !== 'OK' || !p.url || !/^https:\/\//.test(String(p.url))) return;
            const กล่อง = document.querySelector('.ava[data-card="'+String(p.card_id).toLowerCase()+'"]');
            if(!กล่อง) return;
            const img = document.createElement('img'); img.alt = '';
            img.onerror = function(){ if(img.parentNode) img.parentNode.removeChild(img); กล่อง.textContent = กล่อง.getAttribute('data-ini') || ''; };
            img.src = String(p.url);
            กล่อง.textContent = ''; กล่อง.appendChild(img);
          });
        })['catch'](function(){});
    }catch(e){}
  }

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      profile = (โปรไฟล์เร็ว_() || await liff.getProfile());
      loadWorkers();

  }

  async function loadWorkers(){
    setStatus("กำลังโหลดรายชื่อน้อง…");
    try{
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({ action:"workers", userId: profile.userId }) });
      const data = await res.json();
      if(!data.ok){ showError(data.error||"โหลดไม่สำเร็จ"); return; }
      if(!data.workers || data.workers.length===0){ showError(data.note || "ยังไม่มีน้องในไซต์ของคุณ"); return; }
      document.getElementById('hsite').textContent = "โรงงาน: " + data.sites.join(" · ");
      renderWorkers(data.workers);
    }catch(e){ showError(String(e.message||e)); }
  }

  function renderWorkers(workers){
    hideStatus();
    const g = document.getElementById('grid');
    g.style.display='grid';
    g.innerHTML = workers.map(function(w){
      /* ก4 รอบ 50: ไม่วาด photo_url (รูปแตก) · เริ่มที่ตัวย่อชื่อ แล้วรูปจากเส้น photos มาแทนตาม card_id */
      const ava = รูป_กันแท็ก_(initials(w.name));
      return '<div class="wcard" onclick=\'openOv('+JSON.stringify(w).replace(/'/g,"&#39;")+')\'>'
           +   '<div class="ava" data-card="'+รูป_กันแท็ก_(String(w.card_id||'').toLowerCase())+'" data-ini="'+ava+'">'+ava+'</div>'
           +   '<div class="wbody">'
           +     '<div class="wname">'+w.name+'</div>'
           +     '<div class="wsite">'+w.site+'</div>'
           +   '</div>'
           + '</div>';
    }).join('');
    โหลดรูปน้อง_(workers);   /* ก4 รอบ 50 */
  }

  function openOv(w){
    currentWorker = w; selectedIssue = null;
    รหัสของรอบนี้_(true);   /* 🔴 น้องคนใหม่ = คำขอใหม่ ต้องได้รหัสใหม่ */
    document.getElementById('ovName').textContent = w.name;
    document.getElementById('ovSite').textContent = "โรงงาน: " + w.site;
    document.getElementById('note').value = "";
    document.getElementById('otherText').value = "";
    document.getElementById('otherWrap').style.display = "none";
    document.getElementById('sendBtn').disabled = true;
    const list = ISSUES.concat([OTHER_LABEL]);
    const box = document.getElementById('issues');
    box.innerHTML = list.map(function(it,i){ return '<button class="issue" data-i="'+i+'" onclick="pickIssue('+i+')">'+it+'</button>'; }).join('');
    document.getElementById('ov').classList.add('open');
  }
  function closeOv(){ document.getElementById('ov').classList.remove('open'); }

  function pickIssue(i){
    const list = ISSUES.concat([OTHER_LABEL]);
    selectedIssue = list[i];
    document.querySelectorAll('.issue').forEach(function(el){ el.classList.toggle('sel', el.dataset.i==i); });
    document.getElementById('otherWrap').style.display = (selectedIssue === OTHER_LABEL) ? "block" : "none";

  }

  function updateSend(){

    document.getElementById('sendBtn').disabled = !ok;

  var รหัสคำขอ = null;

  async function submitReport(){
    if(!selectedIssue) return;
    let issueText = selectedIssue;
    if(selectedIssue === OTHER_LABEL){
      const t = document.getElementById('otherText').value.trim();
      if(!t) return;
      issueText = "อื่นๆ: " + t;
    }
    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = "กำลังส่ง…";
    try{
      const payload = {
        action:"report", userId: profile.userId, reporterName: profile.displayName,
        card_id: currentWorker.card_id, worker_name: currentWorker.name,
        /* 🔴 ไม่ส่ง site แล้ว — เซิร์ฟเวอร์อ่านไซต์จากทะเบียนเอง (มติผู้วางแผน 2.2) */
        issue: issueText, note: document.getElementById('note').value.trim(),
        req_id: รหัสของรอบนี้_(false)        /* false = กดซ้ำใช้รหัสเดิม */
      };
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if(!data.ok){
        if (data.error !== 'AUTH_REQUIRED') alert(data.message || "ส่งไม่สำเร็จ กรุณาลองใหม่");
        btn.disabled=false; btn.textContent="ส่งรายงาน"; return;
      }
      /* รอบ 50 (เกณฑ์ทางส่งเพี้ยน): ok แต่ไม่มีเลขอ้างอิง/สถานะแจ้งทีมจากเซิร์ฟเวอร์ = ไม่ใช่คำตอบของคำสั่งนี้ ⇒ ยังไม่ทราบผล
         ไม่ขึ้นจอส่งแล้ว · กดใหม่ = เซิร์ฟเวอร์กันซ้ำรายวันจากเนื้องานอยู่แล้ว (ก้อน A) */
      if(data.ref === undefined && data['แจ้งทีม'] === undefined){ btn.disabled=false; btn.textContent="ส่งรายงาน"; return; }
      document.querySelector('.sheet').innerHTML =
        /* 🔴 ของเดิมเขียนว่า "แอดมินได้รับแจ้งเตือนแล้ว" ทั้งที่ตอนนั้นยังไม่รู้ผลการส่ง
           ตอนนี้เซิร์ฟเวอร์คืนสถานะการแจ้งทีมมาจริง ⇒ พูดตามที่รู้
           ⚠️ "ส่งออกไปแล้ว" ยังไม่เท่ากับ "ถึงเครื่องผู้รับแล้ว" — ห้ามเขียนเกินนี้ */
        /* 🆕 23 ก.ย. 2026 — แยกจอ "ใบใหม่" กับ "ใบเดิมที่ส่งไปแล้ววันนี้"
           เซิร์ฟเวอร์รุ่น v41 กันซ้ำด้วยเนื้องาน+วันที่ ⇒ กดส่งเรื่องเดิมซ้ำจะไม่เข้าชีตและไม่แจ้งทีมอีก
           ของเดิมจอยังขึ้นว่า "ส่งแจ้งทีมออกไปแล้ว" ทั้งที่รอบนั้นไม่ได้ส่งอะไรเลย = จอโกหก */
        '<div class="ok"><div class="check">' + (data['ซ้ำคำขอ'] ? '📄' : '✅') + '</div><p>'
