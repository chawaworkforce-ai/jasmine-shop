<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>รายงานหน้างาน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --green:#2f7d55; --green-d:#256544; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans Thai",sans-serif;
        background:var(--bg); color:var(--ink); }
  header{ background:var(--green); color:#fff; padding:16px; position:sticky; top:0; z-index:5; }
  header h1{ font-size:16px; margin:0; font-weight:600; }
  header p{ font-size:13px; margin:4px 0 0; opacity:.85; }
  #status{ padding:24px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .grid{ padding:12px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .wcard{ background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
          cursor:pointer; transition:transform .05s; }
  .wcard:active{ transform:scale(.97); }
  .ava{ width:100%; aspect-ratio:4/5; background:#e6f0ea; color:var(--green-d);
        display:flex; align-items:center; justify-content:center; font-weight:600; font-size:34px; }
  .ava img{ width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }
  .wbody{ padding:9px 10px 11px; }
  .wname{ font-size:14px; line-height:1.3; font-weight:600; }
  .wsite{ font-size:11px; color:var(--muted); margin-top:2px; }

  /* overlay เลือกหัวข้อ */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; z-index:20; }
  .overlay.open{ display:flex; }
  .sheet{ background:#fff; width:100%; border-radius:18px 18px 0 0; padding:18px 16px 24px; max-height:88vh; overflow:auto; }
  .sheet h2{ font-size:16px; margin:0 0 2px; }
  .sheet .sub{ font-size:12px; color:var(--muted); margin:0 0 14px; }
  .issue{ display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line);
          border-radius:12px; padding:12px 14px; font-size:14.5px; line-height:1.35; margin-bottom:9px; color:var(--ink); cursor:pointer; }
  .issue.sel{ border-color:var(--green); background:#eef6f1; color:var(--green-d); font-weight:600; }
  textarea{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:14px;
            font-family:inherit; resize:none; margin-top:4px; }
  .row{ display:flex; gap:10px; margin-top:14px; }
  .btn{ flex:1; border:0; border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-send{ background:var(--green); color:#fff; }
  .btn-send:disabled{ background:#b9c7c0; }
  .btn-cancel{ background:#eef0ef; color:var(--ink); flex:0 0 90px; }
  .ok{ text-align:center; padding:30px 16px; }
  .ok .check{ font-size:40px; }
</style>
</head>
<body>
  <header>
    <h1>รายงานหน้างาน</h1>
    <p id="hsite">กำลังเชื่อมต่อ…</p>
  </header>
  <div id="status">กำลังโหลด…</div>
  <div class="grid" id="grid" style="display:none"></div>

  <!-- overlay -->
  <div class="overlay" id="ov">
    <div class="sheet">
      <h2 id="ovName">น้อง</h2>
      <p class="sub" id="ovSite"></p>
      <div id="issues"></div>
      <div id="otherWrap" style="display:none">
        <input id="otherText" type="text" placeholder="ระบุเรื่อง…" oninput="updateSend()"
               style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;margin-bottom:4px;">
      </div>
      <textarea id="note" rows="2" placeholder="โน้ตเพิ่มเติม (ถ้ามี)"></textarea>
      <div class="row">
        <button class="btn btn-cancel" onclick="closeOv()">ยกเลิก</button>
        <button class="btn btn-send" id="sendBtn" onclick="submitReport()" disabled>ส่งรายงาน</button>
      </div>
    </div>
  </div>

<script>
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";

/* ═══════════════════════════════════════════════════════════════════
   D1 — เติม "ตั๋วยืนยันตัวตน" ให้ทุกคำขอที่ยิงไปหลังบ้าน   (2 ก.ย. 2026)
   แทรกที่เดียว ครอบทุกจุดที่หน้านี้ยิง API_URL — ไม่ต้องแก้ทีละจุด
   · เติม idToken อัตโนมัติทุกคำขอ
   · คำสั่ง "อ่าน" ยิงไม่ออก → ลองใหม่อัตโนมัติ 1 ครั้ง (สคริปต์หลังบ้านเย็นตอนคำขอแรกของวัน)
   · คำสั่ง "เขียน" ห้ามลองใหม่เด็ดขาด — จะได้ข้อมูลซ้ำ
   · ตั๋วหมดอายุ (~1 ชม.) → ขึ้นหน้าจอ "เข้าใหม่" ให้กดปุ่มเดียว
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  var _ยิงเดิม = window.fetch;
  var คำสั่งเขียน_ = { report:1, kpi:1, support:1, grievance:1, refer_worker:1, refer_broker:1,
                       update_status:1, announce:1, link_member:1, unlink_member:1 };
  var เตือนแล้ว_ = false;

  function หน้าเข้าใหม่_(ไม่มีตั๋วเลย) {
    if (เตือนแล้ว_) return; เตือนแล้ว_ = true;
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;' +
      'flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;' +
      'font-family:-apple-system,"Segoe UI","Sarabun",sans-serif');
    if (ไม่มีตั๋วเลย) {
      d.innerHTML = '<div style="font-size:56px">🔧</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ตั้งค่าแอปยังไม่ครบ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">หน้านี้ยังขอ "ตั๋วยืนยันตัวตน" ไม่ได้<br>' +
        'App setup incomplete — please tell the admin</div>' +
        '<div style="font-size:13px;color:#888;margin-top:14px">แจ้งผู้ดูแลระบบ</div>';
    } else {
      d.innerHTML = '<div style="font-size:56px">⏱️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">หมดเวลา — เข้าใหม่</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">Session expired.<br>Please tap the button to continue.</div>' +
        '<button id="_d1เข้าใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔑 เข้าใหม่ / Log in again</button>';
    }
    document.body.appendChild(d);
    var b = document.getElementById('_d1เข้าใหม่');
    if (b) b.onclick = function () { location.reload(); };
  }

  window.fetch = function (u, o) {
    if (String(u) !== API_URL) return _ยิงเดิม.apply(this, arguments);

    var ก้อน = {};
    try { ก้อน = JSON.parse((o && o.body) || '{}'); } catch (e) { ก้อน = {}; }
    var ตั๋ว = null;
    try { ตั๋ว = liff.getIDToken(); } catch (e) {}
    if (ตั๋ว) ก้อน.idToken = ตั๋ว;

    var opt = { method: 'POST', body: JSON.stringify(ก้อน) };
    if (o) { for (var k in o) if (k !== 'method' && k !== 'body') opt[k] = o[k]; }

    var ลองใหม่ได้ = !คำสั่งเขียน_[ก้อน.action];
    function ยิง() { return _ยิงเดิม(u, opt); }

    return ยิง()['catch'](function (e) {
      if (!ลองใหม่ได้) throw e;                      // คำสั่งเขียน: ห้ามลองใหม่ จะได้ข้อมูลซ้ำ
      return new Promise(function (r) { setTimeout(r, 1500); }).then(ยิง);
    }).then(function (res) {
      try {
        res.clone().json().then(function (j) {
          if (j && j.ok === false && j.error === 'AUTH_REQUIRED') หน้าเข้าใหม่_(!ตั๋ว);
        })['catch'](function () {});
      } catch (e) {}
      return res;
    });
  };
})();
  const ISSUES = [
    "เกิดอุบัติเหตุ",
    "ไม่สบาย",
    "แต่งกายไม่เรียบร้อย / ไม่ถูกระเบียบ",
    "เรียนรู้งานช้า",
    "มีพฤติกรรมไม่ดีต่อเพื่อนร่วมงาน / มีปากเสียง ทะเลาะ",
    "พฤติกรรมไม่เหมาะสมในเวลางาน / สูบบุหรี่ ทาแป้ง เคี้ยวหมาก",
    "ทำสินค้า/ทรัพย์สินของโรงงานเสียหาย"
  ];
  const OTHER_LABEL = "อื่นๆ (โปรดระบุ)";

  let profile = null, currentWorker = null, selectedIssue = null;

  function setStatus(t){ const s=document.getElementById('status'); s.style.display='block'; s.textContent=t; }
  function hideStatus(){ document.getElementById('status').style.display='none'; }
  function showError(t){ setStatus("⚠️ "+t); }
  function initials(name){ const p=String(name||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      profile = await liff.getProfile();
      loadWorkers();
    }catch(e){ showError("เปิดผ่านแอป LINE ไม่สำเร็จ: "+(e.message||e)); }
  }

  async function loadWorkers(){
    setStatus("กำลังโหลดรายชื่อน้อง…");
    try{
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({ action:"workers", userId: profile.userId }) });
      const data = await res.json();
      if(!data.ok){ showError(data.error||"โหลดไม่สำเร็จ"); return; }
      if(!data.workers || data.workers.length===0){ showError(data.note || "ยังไม่มีน้องในไซต์ของคุณ"); return; }
      document.getElementById('hsite').textContent = "โรงงาน: " + data.sites.join(" · ");
      renderWorkers(data.workers);
    }catch(e){ showError(String(e.message||e)); }
  }

  function renderWorkers(workers){
    hideStatus();
    const g = document.getElementById('grid');
    g.style.display='grid';
    g.innerHTML = workers.map(function(w){
      const ava = w.photo_url
        ? '<img src="'+w.photo_url+'" alt="">'
        : initials(w.name);
      return '<div class="wcard" onclick=\'openOv('+JSON.stringify(w).replace(/'/g,"&#39;")+')\'>'
           +   '<div class="ava">'+ava+'</div>'
           +   '<div class="wbody">'
           +     '<div class="wname">'+w.name+'</div>'
           +     '<div class="wsite">'+w.site+'</div>'
           +   '</div>'
           + '</div>';
    }).join('');
  }

  function openOv(w){
    currentWorker = w; selectedIssue = null;
    document.getElementById('ovName').textContent = w.name;
    document.getElementById('ovSite').textContent = "โรงงาน: " + w.site;
    document.getElementById('note').value = "";
    document.getElementById('otherText').value = "";
    document.getElementById('otherWrap').style.display = "none";
    document.getElementById('sendBtn').disabled = true;
    const list = ISSUES.concat([OTHER_LABEL]);
    const box = document.getElementById('issues');
    box.innerHTML = list.map(function(it,i){ return '<button class="issue" data-i="'+i+'" onclick="pickIssue('+i+')">'+it+'</button>'; }).join('');
    document.getElementById('ov').classList.add('open');
  }
  function closeOv(){ document.getElementById('ov').classList.remove('open'); }

  function pickIssue(i){
    const list = ISSUES.concat([OTHER_LABEL]);
    selectedIssue = list[i];
    document.querySelectorAll('.issue').forEach(function(el){ el.classList.toggle('sel', el.dataset.i==i); });
    document.getElementById('otherWrap').style.display = (selectedIssue === OTHER_LABEL) ? "block" : "none";
    updateSend();
  }

  function updateSend(){
    let ok = !!selectedIssue;
    if (selectedIssue === OTHER_LABEL) ok = document.getElementById('otherText').value.trim().length > 0;
    document.getElementById('sendBtn').disabled = !ok;
  }

  async function submitReport(){
    if(!selectedIssue) return;
    let issueText = selectedIssue;
    if(selectedIssue === OTHER_LABEL){
      const t = document.getElementById('otherText').value.trim();
      if(!t) return;
      issueText = "อื่นๆ: " + t;
    }
    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = "กำลังส่ง…";
    try{
      const payload = {
        action:"report", userId: profile.userId, reporterName: profile.displayName,
        card_id: currentWorker.card_id, worker_name: currentWorker.name, site: currentWorker.site,
        issue: issueText, note: document.getElementById('note').value.trim()
      };
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if(!data.ok){ alert("ส่งไม่สำเร็จ: "+(data.error||"")); btn.disabled=false; btn.textContent="ส่งรายงาน"; return; }
      document.querySelector('.sheet').innerHTML =
        '<div class="ok"><div class="check">✅</div><p>ส่งรายงานเรียบร้อย<br>แอดมินได้รับแจ้งเตือนแล้ว</p>'
        + '<button class="btn btn-send" onclick="closeOv();location.reload()">เสร็จสิ้น</button></div>';
    }catch(e){ alert("ผิดพลาด: "+(e.message||e)); btn.disabled=false; btn.textContent="ส่งรายงาน"; }
  }

  main();
</script>
</body>
</html>
