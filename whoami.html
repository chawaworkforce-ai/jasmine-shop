<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My LINE ID</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --blue:#2a7d9b; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; --red:#a3322b; --green:#256544; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Sarabun",sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--blue); color:#fff; padding:14px 16px; font-size:17px; font-weight:700; }
  .wrap{ padding:16px 14px 40px; max-width:560px; margin:0 auto; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 18px; }
  h2{ font-size:17px; margin:0 0 6px; }
  p{ font-size:14px; color:#555; line-height:1.7; margin:6px 0; }
  .id{ font-family:ui-monospace,Menlo,monospace; font-size:15px; word-break:break-all; background:#f0f4f2;
       border:1px solid var(--line); border-radius:12px; padding:14px; margin:14px 0; line-height:1.6;
       -webkit-user-select:text; user-select:text; }
  button{ width:100%; padding:16px; border:0; border-radius:14px; background:var(--blue); color:#fff;
          font-size:17px; font-weight:700; }
  .warn{ margin-top:18px; background:#fff8e6; border:1px solid #f0dfae; border-radius:12px; padding:12px 14px;
         font-size:13px; color:#6b4e00; line-height:1.7; }
  .muted{ color:var(--muted); font-size:13px; text-align:center; margin-top:14px; }
</style>
</head>
<body>
<header>🪪 My LINE ID</header>
<div class="wrap" id="จอ"><div class="card"><p>กำลังโหลด… / Loading…</p></div></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   หน้า "รหัสไลน์ของฉัน" — 8 ก.ย. 2026
   ใช้ตอนต้องเพิ่มคนเข้าระบบ (แอดมินใหม่ หรือจับคู่น้อง) แล้วเราไม่รู้รหัสไลน์ของเขา

   🔒 หน้านี้ไม่คุยกับเซิร์ฟเวอร์เลยแม้แต่ครั้งเดียว
      ไม่มี API_URL ไม่มีคำสั่ง ไม่แตะด่าน ไม่แตะชีต
      อ่านรหัสจาก LINE แล้วแสดงบนจอเฉย ๆ ⇒ แต่ละคนเห็นได้เฉพาะรหัสของตัวเอง
   ══════════════════════════════════════════════════════════════════ */

  /* 🔴 ก๊อปค่านี้มาจากหน้าเว็บที่ใช้อยู่จริง ห้ามพิมพ์เอง (ระบบใช้ LIFF app เดียว) */
  const LIFF_ID = "__ใส่รหัส_LIFF__";

  function esc(s){
    return String(s == null ? '' : s).replace(/[<>&"]/g, function(c){
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c];
    });
  }
  function จอ_(h){ document.getElementById('จอ').innerHTML = h; }

  function จอผิดพลาด_(เหตุ){
    จอ_('<div class="card">' +
      '<h2 style="color:var(--red)">เปิดไม่ได้ / Cannot open</h2>' +
      '<p>ต้องเปิดหน้านี้จากในแอป LINE เท่านั้น เปิดจากลิงก์เว็บธรรมดาไม่ได้</p>' +
      '<p>Please open this page from inside the LINE app.</p>' +
      '<p class="muted">code: ' + esc(เหตุ) + '</p></div>');
  }

  (async function เริ่ม(){
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      var pf = await liff.getProfile();
      var uid = String(pf.userId || '');
      var ถูกรูปแบบ = /^U[0-9a-f]{32}$/.test(uid);

      จอ_('<div class="card">' +
        '<h2>' + esc(pf.displayName || '(ไม่ทราบชื่อ)') + '</h2>' +
        '<p>นี่คือรหัสไลน์ของคุณ กดปุ่มเพื่อคัดลอก แล้วส่งให้เจ้าของระบบ</p>' +
        '<p>This is your LINE ID. Copy it and send it to the system owner.</p>' +
        '<div class="id" id="ช่องรหัส">' + esc(uid) + '</div>' +
        (ถูกรูปแบบ ? '' : '<p style="color:var(--red)">⚠️ รูปแบบรหัสไม่ตรงกับที่ระบบคาดไว้ ให้ถ่ายรูปหน้าจอนี้ส่งแทน</p>') +
        '<button id="ป_ก๊อป">📋 คัดลอกรหัส / Copy</button>' +
        '<div class="warn">🔒 <b>ส่งรหัสนี้ให้เจ้าของระบบเท่านั้น</b><br>' +
        'อย่าโพสต์ลงกลุ่ม อย่าส่งให้คนนอก<br>' +
        'รหัสนี้ไม่ใช่รหัสผ่าน ใครถือไปก็เข้าระบบแทนคุณไม่ได้ แต่ก็ไม่ต้องแจกให้ใครโดยไม่จำเป็น</div>' +
        '<div class="muted">ถ้าปุ่มคัดลอกไม่ทำงาน ให้กดค้างที่ตัวหนังสือแล้วเลือกคัดลอก<br>หรือถ่ายรูปหน้าจอนี้ส่งไปก็ได้</div>' +
        '</div>');

      document.getElementById('ป_ก๊อป').onclick = function(){
        var ป = this;
        function สำเร็จ(){ ป.textContent = '✅ คัดลอกแล้ว / Copied'; ป.style.background = 'var(--green)'; }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(uid).then(สำเร็จ, เลือกข้อความแทน_);
            return;
          }
        } catch(e){}
        เลือกข้อความแทน_();
      };

      /* เบราว์เซอร์ในแอป LINE บางรุ่นไม่ให้ใช้คลิปบอร์ด ⇒ ไฮไลต์ให้แทน จะได้กดคัดลอกเองได้ */
      function เลือกข้อความแทน_(){
        try {
          var r = document.createRange();
          r.selectNodeContents(document.getElementById('ช่องรหัส'));
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          document.getElementById('ป_ก๊อป').textContent = '👆 กดค้างที่ตัวหนังสือแล้วเลือกคัดลอก';
        } catch(e){}
      }
    } catch (e) {
      จอผิดพลาด_('LIFF_INIT');
    }
  })();
</script>
</body>
</html>
