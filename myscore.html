<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Score</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --blue:#2a7d9b; --blue-d:#1f5f76; --star:#f5b50a; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; --red:#a3322b; --green:#256544; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Padauk",sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--blue); color:#fff; padding:18px 16px; position:sticky; top:0; z-index:5; }
  header h1{ font-size:18px; margin:0; font-weight:700; }
  header p{ font-size:13px; margin:5px 0 0; opacity:.9; }
  #status{ padding:30px 16px; text-align:center; color:var(--muted); font-size:14px; line-height:1.6; }
  .wrap{ padding:14px 14px 28px; max-width:560px; margin:0 auto; }
  .mon{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 14px 16px; margin-bottom:14px; }
  .mhead{ font-size:16px; font-weight:700; color:var(--blue-d); margin-bottom:10px; }
  .total{ display:inline-block; background:#eaf3f7; color:var(--blue-d); font-weight:700; border-radius:10px; padding:5px 12px; font-size:15px; margin-bottom:10px; }
  .crit{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #f1f4f2; }
  .crit:last-child{ border-bottom:0; }
  .clabel{ font-size:13px; line-height:1.3; } .clabel small{ color:var(--muted); display:block; font-size:11px; }
  .cstars{ color:#dcdcdc; font-size:17px; letter-spacing:1px; white-space:nowrap; }
  .cstars b{ color:var(--star); font-weight:normal; }
  .none{ font-size:13px; color:var(--muted); padding:4px 0; }
  .rep-h{ font-size:13px; font-weight:700; margin:12px 0 6px; }
  .rep{ background:#fdeceb; color:var(--red); border-radius:10px; padding:8px 10px; font-size:13px; margin-bottom:6px; line-height:1.4; }
  .rep small{ color:#9a6b67; }
  .rep0{ background:#eef6f1; color:var(--green); border-radius:10px; padding:8px 10px; font-size:13px; }
</style>
</head>
<body>
  <header>
    <h1>⭐ My Score / မိမိအမှတ်</h1>
    <p id="hsub">Connecting…</p>
  </header>
  <div id="status">Loading… / ခဏစောင့်ပါ…</div>
  <div class="wrap" id="wrap" style="display:none"></div>

<script>
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";

/* ── D1-ความเร็ว · 2 ก.ย. 2026 ─────────────────────────────────────────────
   เลิกยิงเน็ตขอโปรไฟล์ทุกครั้งที่เปิดหน้า
   ทำไม: liff.getProfile() คุยกับเซิร์ฟเวอร์ LINE 1 รอบ (ราว 0.3-0.8 วิ) ทุกครั้ง
         ทั้งที่ตั๋วที่อยู่ในมือเราอยู่แล้วมีทั้งรหัสไลน์และชื่ออยู่ข้างใน
         และตั้งแต่มีด่าน D1 หลังบ้านก็ไม่เชื่อ userId ที่หน้าเว็บส่งไปแล้วด้วย
   ปลอดภัย: ถ้าอ่านจากตั๋วไม่ได้ (เช่น LIFF app ไม่ได้ติ๊ก openid) จะถอยไปใช้วิธีเดิมเอง
            ⇒ แย่ที่สุดคือ "เท่าเดิม" เป็นไปไม่ได้ที่จะพังเพราะก้อนนี้
   รูปร่างที่คืนออกมาเหมือน getProfile() เป๊ะ ⇒ โค้ดส่วนอื่นไม่ต้องแก้เลย */
function โปรไฟล์เร็ว_() {
  try {
    var d = liff.getDecodedIDToken();
    if (d && d.sub) return { userId: d.sub, displayName: d.name || '', pictureUrl: d.picture || '' };
  } catch (e) {}
  return null;                       // อ่านไม่ได้ = คืน null ให้ผู้เรียกถอยไปใช้ getProfile() เดิม
}


/* ═══════════════════════════════════════════════════════════════════
   D1 — เติม "ตั๋วยืนยันตัวตน" ให้ทุกคำขอที่ยิงไปหลังบ้าน   (2 ก.ย. 2026)
   แทรกที่เดียว ครอบทุกจุดที่หน้านี้ยิง API_URL — ไม่ต้องแก้ทีละจุด
   · เติม idToken อัตโนมัติทุกคำขอ
   · คำสั่ง "อ่าน" ยิงไม่ออก → ลองใหม่อัตโนมัติ 1 ครั้ง (สคริปต์หลังบ้านเย็นตอนคำขอแรกของวัน)
   · คำสั่ง "เขียน" ห้ามลองใหม่เด็ดขาด — จะได้ข้อมูลซ้ำ
   · ตั๋วหมดอายุ (~1 ชม.) → ขึ้นหน้าจอ "เข้าใหม่" ให้กดปุ่มเดียว
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  var _ยิงเดิม = window.fetch;
  var คำสั่งเขียน_ = { report:1, kpi:1, support:1, grievance:1, refer_worker:1, refer_broker:1,
                       update_status:1, announce:1, link_member:1, unlink_member:1 };
  var เตือนแล้ว_ = false;

  function หนี_(s) {
    return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c];
    });
  }

  /* จอเต็มหน้าที่ใช้ร่วมกันทุกกรณี — ทับหน้าเดิมไว้ ไม่ให้น้องเห็นข้อความดิบ */
  function จอ_(html, ปิดได้) {
    if (เตือนแล้ว_) return;
    เตือนแล้ว_ = true;
    var d = document.createElement('div');
    d.id = '_d1จอ';
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;' +
      'flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;' +
      'text-align:center;overflow:auto;-webkit-overflow-scrolling:touch;' +
      'font-family:-apple-system,"Segoe UI","Sarabun","Noto Sans Myanmar","Padauk",sans-serif');
    d.innerHTML = html;
    document.body.appendChild(d);

    var โหลด = document.getElementById('_d1โหลดใหม่');
    if (โหลด) โหลด.onclick = function () { location.reload(); };

    var ปิด = document.getElementById('_d1ปิด');
    if (ปิด) ปิด.onclick = function () {
      var x = document.getElementById('_d1จอ');
      if (x && x.parentNode) x.parentNode.removeChild(x);
      เตือนแล้ว_ = false;
    };

    var สลับ = document.getElementById('_d1สลับ');
    if (สลับ) สลับ.onclick = function () {
      var x = document.getElementById('_d1รายละเอียด');
      if (x) x.style.display = (x.style.display === 'none' ? 'block' : 'none');
    };
  }

  function หน้าเข้าใหม่_(ไม่มีตั๋วเลย) {
    if (ไม่มีตั๋วเลย) {
      จอ_('<div style="font-size:56px">🔧</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ตั้งค่าแอปยังไม่ครบ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">หน้านี้ยังขอ "ตั๋วยืนยันตัวตน" ไม่ได้<br>' +
        'App setup incomplete — please tell the admin</div>' +
        '<div style="font-size:13px;color:#888;margin-top:14px">แจ้งผู้ดูแลระบบ</div>');
    } else {
      จอ_('<div style="font-size:56px">⏱️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">หมดเวลา — เข้าใหม่</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">Session expired.<br>Please tap the button to continue.</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔑 เข้าใหม่ / Log in again</button>');
    }
  }

  /* ── ของใหม่ 3 ก.ย. 2026 ──────────────────────────────────────────
     คำตอบกลับมาไม่ใช่ JSON (เช่นได้หน้าเว็บ HTML แทน)
     เดิม: `await res.json()` พัง → เอาข้อความดิบภาษาอังกฤษไปแปะบนจอน้อง
     ใหม่: ขึ้นจอ 2 ภาษา + ปุ่มลองใหม่ + รายละเอียดสำหรับผู้ดูแลให้ถ่ายรูปส่งมา
     · คำสั่งอ่าน  → ลองใหม่อัตโนมัติ 1 ครั้งก่อน แล้วค่อยขึ้นจอ
     · คำสั่งเขียน → ห้ามลองใหม่เด็ดขาด (จะได้ข้อมูลซ้ำ) ขึ้นจอ "อย่าส่งซ้ำ"
     ──────────────────────────────────────────────────────────────── */
  function กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ) {
    var เวลา = '';
    try { เวลา = new Date().toLocaleString(); } catch (e) {}
    return '<div id="_d1สลับ" style="margin-top:20px;font-size:12px;color:#9a9a9a;' +
      'text-decoration:underline">รายละเอียดสำหรับผู้ดูแล / details</div>' +
      '<div id="_d1รายละเอียด" style="display:none;margin-top:10px;max-width:100%;' +
      'background:#f4f4f4;border-radius:10px;padding:10px 12px;font-size:11px;color:#444;' +
      'text-align:left;word-break:break-all;line-height:1.5;-webkit-user-select:text;user-select:text">' +
      '<b>D1-ERR</b> · not-json<br>' +
      'code: ' + หนี_(รหัส) + '<br>' +
      'action: ' + หนี_(คำสั่ง) + '<br>' +
      'time: ' + หนี_(เวลา) + '<br>' +
      'body: ' + หนี_(String(ต้นข้อความ || '').replace(/\s+/g, ' ').slice(0, 300)) +
      '</div>';
  }

  function หน้าคำตอบเพี้ยน_(เขียน, รหัส, คำสั่ง, ต้นข้อความ) {
    if (เขียน) {
      จอ_('<div style="font-size:56px">⚠️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ส่งแล้ว แต่ยังไม่รู้ผล</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        '🔴 <b>อย่ากดส่งซ้ำ</b> — ให้แจ้งผู้ดูแลตรวจให้ก่อน<br>' +
        'Sent, but result unknown. Do NOT send again.<br>' +
        'ပို့ပြီးပါပြီ။ ရလဒ်ကို မသိရသေးပါ။<br>ထပ်မပို့ပါနှင့်။ အက်ဒမင်ကို ဆက်သွယ်ပါ။</div>' +
        '<button id="_d1ปิด" style="margin-top:22px;padding:14px 28px;border:0;border-radius:12px;' +
        'background:#8a8a8a;color:#fff;font-size:16px;font-weight:700">ปิด / Close</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    } else {
      จอ_('<div style="font-size:56px">📡</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">โหลดข้อมูลไม่สำเร็จ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        'เซิร์ฟเวอร์ตอบกลับมาไม่ถูกต้อง กรุณากดลองใหม่<br>' +
        'Could not load. Please try again.<br>' +
        'ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။<br>ထပ်မံ ကြိုးစားပါ။</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔄 ลองใหม่ / ထပ်စမ်းရန်</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    }
  }

  /* คืนวัตถุที่หน้าเว็บเรียก .json() / .text() / .clone() ได้เหมือน Response เดิม
     (จำเป็นเพราะเราอ่าน body ไปแล้ว 1 ครั้ง อ่านซ้ำจาก Response จริงไม่ได้) */
  function ห่อ_(r) {
    var เนื้อ = r.txt;
    var วัตถุ = {
      ok: r.res ? !!r.res.ok : false,
      status: r.res ? r.res.status : 0,
      statusText: r.res ? r.res.statusText : '',
      headers: r.res ? r.res.headers : null,
      text: function () { return Promise.resolve(เนื้อ); },
      json: function () {
        return r.ดี ? Promise.resolve(r.j)
                    : Promise.reject(new SyntaxError('D1: server did not return JSON'));
      }
    };
    วัตถุ.clone = function () { return วัตถุ; };
    return วัตถุ;
  }

  window.fetch = function (u, o) {
    if (String(u) !== API_URL) return _ยิงเดิม.apply(this, arguments);

    var ก้อน = {};
    try { ก้อน = JSON.parse((o && o.body) || '{}'); } catch (e) { ก้อน = {}; }
    var ตั๋ว = null;
    try { ตั๋ว = liff.getIDToken(); } catch (e) {}
    if (ตั๋ว) ก้อน.idToken = ตั๋ว;

    var opt = { method: 'POST', body: JSON.stringify(ก้อน) };
    if (o) { for (var k in o) if (k !== 'method' && k !== 'body') opt[k] = o[k]; }

    var เขียน = !!คำสั่งเขียน_[ก้อน.action];
    var ลองใหม่ได้ = !เขียน;

    function รอ_(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function ยิงแล้วอ่าน_() {
      return _ยิงเดิม(u, opt).then(function (res) {
        return res.text().then(function (txt) {
          var j = null, ดี = false;
          try { j = JSON.parse(txt); ดี = true; } catch (e) {}
          return { res: res, txt: txt, j: j, ดี: ดี };
        }, function () {
          return { res: res, txt: '', j: null, ดี: false };
        });
      });
    }

    /* ชั้น 1 — ยิงไม่ออกเลย (เน็ตหลุด): ลองใหม่ 1 ครั้งเฉพาะคำสั่งอ่าน (ของเดิม) */
    var งาน = ยิงแล้วอ่าน_()['catch'](function (e) {
      if (!ลองใหม่ได้) throw e;
      return รอ_(1500).then(ยิงแล้วอ่าน_);
    });

    /* ชั้น 2 — ยิงออกแต่คำตอบไม่ใช่ JSON: ลองใหม่ 1 ครั้งเฉพาะคำสั่งอ่าน (ของใหม่) */
    งาน = งาน.then(function (r) {
      if (r.ดี || !ลองใหม่ได้) return r;
      return รอ_(1200).then(ยิงแล้วอ่าน_)['catch'](function () { return r; });
    });

    return งาน.then(function (r) {
      if (!r.ดี) {
        หน้าคำตอบเพี้ยน_(เขียน, r.res ? r.res.status : 0, ก้อน.action, r.txt);
      } else if (r.j && r.j.ok === false && r.j.error === 'AUTH_REQUIRED') {
        หน้าเข้าใหม่_(!ตั๋ว);
      }
      return ห่อ_(r);
    });
  };
})();
  const CRIT = [
    { en:'Diligence', my:'ကြိုးစားမှု' },
    { en:'Work understanding', my:'အလုပ်နားလည်မှု' },
    { en:'Teamwork', my:'အသင်းအဖွဲ့လိုက်' },
    { en:'Dress & factory rules', my:'ဝတ်စုံ/စည်းကမ်း' },
    { en:'No product damage', my:'ပစ္စည်းမပျက်စီး' }
  ];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function esc(s){ return String(s||'').replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
  function stars(n){ n=Number(n)||0; var s=''; for(var i=1;i<=5;i++) s+= i<=n ? '<b>★</b>' : '★'; return s; }
  function monthLabel(m){ var p=String(m).split('-'); return (MON[(+p[1])-1]||p[1])+' '+p[0]; }

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const profile = (โปรไฟล์เร็ว_() || await liff.getProfile());
      load(profile.userId);
    }catch(e){ document.getElementById('status').textContent = "Open in LINE app please. ("+(e.message||e)+")"; }
  }

  async function load(userId){
    try{
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({ action:"my_score", userId: userId }) });
      const data = await res.json();
      if(!data.ok){ document.getElementById('status').textContent = "Error: "+(data.error||""); return; }
      if(!data.linked){
        document.getElementById('status').innerHTML =
          "Your account is not linked yet.<br>Please contact your admin.<br><br>"
          + "သင့်အကောင့် မချိတ်ဆက်ရသေးပါ။<br>အက်ဒမင်ကို ဆက်သွယ်ပါ။";
        return;
      }
      document.getElementById('hsub').textContent = data.name + " · " + data.site;
      render(data.months || []);
    }catch(e){ document.getElementById('status').textContent = String(e.message||e); }
  }

  function render(months){
    document.getElementById('status').style.display='none';
    const W = document.getElementById('wrap'); W.style.display='block';
    if(months.length===0){ W.innerHTML = '<div class="none" style="text-align:center;padding:24px">No records yet / မှတ်တမ်း မရှိသေးပါ</div>'; return; }
    W.innerHTML = months.map(function(mo){
      var html = '<div class="mon"><div class="mhead">'+monthLabel(mo.month)+'</div>';
      if(mo.kpi){
        html += '<div class="total">KPI '+mo.kpi.total+' / 25</div>';
        html += CRIT.map(function(c,i){
          return '<div class="crit"><div class="clabel">'+c.en+'<small>'+c.my+'</small></div>'
               + '<div class="cstars">'+stars(mo.kpi.scores[i])+'</div></div>';
        }).join('');
      } else {
        html += '<div class="none">No KPI this month / ဤလတွင် KPI မရှိသေး</div>';
      }
      html += '<div class="rep-h">Reports / အစီရင်ခံစာ ('+mo.reports.length+')</div>';
      if(mo.reports.length===0){
        html += '<div class="rep0">No reports ✅ / အစီရင်ခံစာ မရှိ ✅</div>';
      } else {
        html += mo.reports.map(function(r){
          var second = (r.my && r.my!==r.en) ? '<br><small>'+esc(r.my)+'</small>' : '';
          return '<div class="rep"><small>'+esc(r.date)+'</small> · '+esc(r.en)+second+'</div>';
        }).join('');
      }
      return html + '</div>';
    }).join('');
  }

  main();
</script>
</body>
</html>
