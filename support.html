<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Operations Support</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --green:#2f7d55; --green-d:#256544; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; --navy:#1f2a44; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--navy); color:#fff; padding:18px 16px; }
  header h1{ font-size:18px; margin:0; font-weight:700; }
  header p{ font-size:13px; margin:5px 0 0; opacity:.8; }
  .wrap{ padding:18px 16px; max-width:560px; margin:0 auto; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  label{ font-size:14px; color:var(--ink); font-weight:600; display:block; margin-bottom:8px; }
  textarea{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:15px; font-family:inherit; resize:none; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; border-radius:14px;
        padding:16px; font-size:16px; font-weight:700; cursor:pointer; text-decoration:none; margin-top:12px; }
  .btn-notify{ background:var(--green); color:#fff; }
  .btn-notify:disabled{ background:#b9c7c0; }
  .btn-call{ background:#fff; color:var(--navy); border:2px solid var(--navy); }
  .hint{ font-size:12.5px; color:var(--muted); margin:10px 2px 0; line-height:1.5; }
  .done{ text-align:center; padding:22px 12px; }
  .done .c{ font-size:42px; } .done p{ font-size:15px; margin:10px 0 0; }
  #status{ padding:20px 16px; text-align:center; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
  <header>
    <h1>Operations Support</h1>
    <p>ขอความช่วยเหลือ · ประสานงาน · แก้ปัญหา</p>
  </header>
  <div id="status">กำลังเชื่อมต่อ…</div>
  <div class="wrap" id="app" style="display:none">
    <div class="card" id="formCard">
      <label>เรื่องที่ต้องการให้ช่วย (ถ้ามี)</label>
      <textarea id="note" rows="3" placeholder="เช่น ขอคนเพิ่ม, ปัญหาหน้างาน, ขอคุยกับทีม…"></textarea>
      <button class="btn btn-notify" id="notifyBtn" onclick="sendSupport()">📨 แจ้งทีมงานให้ติดต่อกลับ</button>
      <a class="btn btn-call" href="tel:0970313769">📞 โทรหาแอดมินตอนนี้</a>
      <p class="hint">กด "แจ้งทีมงาน" เพื่อให้แอดมินติดต่อกลับ หรือกด "โทรหาแอดมิน" หากต้องการคุยด่วน</p>
    </div>
  </div>

<script>
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";

/* ═══════════════════════════════════════════════════════════════════
   D1 — เติม "ตั๋วยืนยันตัวตน" ให้ทุกคำขอที่ยิงไปหลังบ้าน   (2 ก.ย. 2026)
   แทรกที่เดียว ครอบทุกจุดที่หน้านี้ยิง API_URL — ไม่ต้องแก้ทีละจุด
   · เติม idToken อัตโนมัติทุกคำขอ
   · คำสั่ง "อ่าน" ยิงไม่ออก → ลองใหม่อัตโนมัติ 1 ครั้ง (สคริปต์หลังบ้านเย็นตอนคำขอแรกของวัน)
   · คำสั่ง "เขียน" ห้ามลองใหม่เด็ดขาด — จะได้ข้อมูลซ้ำ
   · ตั๋วหมดอายุ (~1 ชม.) → ขึ้นหน้าจอ "เข้าใหม่" ให้กดปุ่มเดียว
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  var _ยิงเดิม = window.fetch;
  var คำสั่งเขียน_ = { report:1, kpi:1, support:1, grievance:1, refer_worker:1, refer_broker:1,
                       update_status:1, announce:1, link_member:1, unlink_member:1 };
  var เตือนแล้ว_ = false;

  function หน้าเข้าใหม่_(ไม่มีตั๋วเลย) {
    if (เตือนแล้ว_) return; เตือนแล้ว_ = true;
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;' +
      'flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;' +
      'font-family:-apple-system,"Segoe UI","Sarabun",sans-serif');
    if (ไม่มีตั๋วเลย) {
      d.innerHTML = '<div style="font-size:56px">🔧</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ตั้งค่าแอปยังไม่ครบ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">หน้านี้ยังขอ "ตั๋วยืนยันตัวตน" ไม่ได้<br>' +
        'App setup incomplete — please tell the admin</div>' +
        '<div style="font-size:13px;color:#888;margin-top:14px">แจ้งผู้ดูแลระบบ</div>';
    } else {
      d.innerHTML = '<div style="font-size:56px">⏱️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">หมดเวลา — เข้าใหม่</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">Session expired.<br>Please tap the button to continue.</div>' +
        '<button id="_d1เข้าใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔑 เข้าใหม่ / Log in again</button>';
    }
    document.body.appendChild(d);
    var b = document.getElementById('_d1เข้าใหม่');
    if (b) b.onclick = function () { location.reload(); };
  }

  window.fetch = function (u, o) {
    if (String(u) !== API_URL) return _ยิงเดิม.apply(this, arguments);

    var ก้อน = {};
    try { ก้อน = JSON.parse((o && o.body) || '{}'); } catch (e) { ก้อน = {}; }
    var ตั๋ว = null;
    try { ตั๋ว = liff.getIDToken(); } catch (e) {}
    if (ตั๋ว) ก้อน.idToken = ตั๋ว;

    var opt = { method: 'POST', body: JSON.stringify(ก้อน) };
    if (o) { for (var k in o) if (k !== 'method' && k !== 'body') opt[k] = o[k]; }

    var ลองใหม่ได้ = !คำสั่งเขียน_[ก้อน.action];
    function ยิง() { return _ยิงเดิม(u, opt); }

    return ยิง()['catch'](function (e) {
      if (!ลองใหม่ได้) throw e;                      // คำสั่งเขียน: ห้ามลองใหม่ จะได้ข้อมูลซ้ำ
      return new Promise(function (r) { setTimeout(r, 1500); }).then(ยิง);
    }).then(function (res) {
      try {
        res.clone().json().then(function (j) {
          if (j && j.ok === false && j.error === 'AUTH_REQUIRED') หน้าเข้าใหม่_(!ตั๋ว);
        })['catch'](function () {});
      } catch (e) {}
      return res;
    });
  };
})();
  let profile = null;

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      profile = await liff.getProfile();
      document.getElementById('status').style.display='none';
      document.getElementById('app').style.display='block';
    }catch(e){ document.getElementById('status').textContent = "เปิดผ่านแอป LINE ไม่สำเร็จ: "+(e.message||e); }
  }

  async function sendSupport(){
    const btn = document.getElementById('notifyBtn');
    btn.disabled = true; btn.textContent = "กำลังแจ้ง…";
    try{
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({
        action:"support", userId: profile.userId, reporterName: profile.displayName,
        note: document.getElementById('note').value.trim()
      })});
      const data = await res.json();
      if(!data.ok){ alert("แจ้งไม่สำเร็จ: "+(data.error||"")); btn.disabled=false; btn.textContent="📨 แจ้งทีมงานให้ติดต่อกลับ"; return; }
      document.getElementById('formCard').innerHTML =
        '<div class="done"><div class="c">✅</div><p>แจ้งทีมงานเรียบร้อย<br>แอดมินจะติดต่อกลับโดยเร็วครับ</p>'
        + '<a class="btn btn-call" href="tel:0970313769">📞 โทรหาแอดมินตอนนี้</a></div>';
    }catch(e){ alert("ผิดพลาด: "+(e.message||e)); btn.disabled=false; btn.textContent="📨 แจ้งทีมงานให้ติดต่อกลับ"; }
  }

  main();
</script>
</body>
</html>
