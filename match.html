<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>จับคู่ไลน์น้อง</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --slate:#33415c; --slate-d:#26324a; --green:#2f7d55; --red:#b3453b; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--slate); color:#fff; padding:16px; position:sticky; top:0; z-index:5; }
  header h1{ font-size:16px; margin:0; font-weight:600; }
  header p{ font-size:13px; margin:4px 0 0; opacity:.85; }
  .tabs{ display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:64px; z-index:4; }
  .tab{ flex:1; text-align:center; padding:12px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; }
  .tab.on{ color:var(--slate); border-bottom-color:var(--slate); }
  #status{ padding:24px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .note{ padding:10px 16px; font-size:12.5px; color:var(--muted); }
  .list{ padding:10px 12px; }
  .mcard{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:10px; }
  .mava{ width:48px; height:48px; border-radius:50%; background:#dde3ec; color:var(--slate-d); display:flex; align-items:center; justify-content:center; font-weight:600; overflow:hidden; flex:0 0 48px; }
  .mava img{ width:100%; height:100%; object-fit:cover; }
  .mava.sq{ border-radius:9px; width:44px; height:54px; flex:0 0 44px; background:#e6f0ea; color:var(--green); }
  .mava.sq img{ object-position:center top; }
  .minfo{ flex:1; min-width:0; }
  .mname{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .mbtn{ border:0; border-radius:10px; color:#fff; font-weight:600; font-size:13px; padding:9px 14px; cursor:pointer; flex:0 0 auto; }
  .b-link{ background:var(--green); } .b-unlink{ background:var(--red); }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:20; }
  .overlay.open{ display:flex; }
  .sheet{ background:#fff; width:100%; border-radius:18px 18px 0 0; padding:16px; max-height:88vh; display:flex; flex-direction:column; }
  .sheet h2{ font-size:15px; margin:0 0 10px; }
  .search{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; font-family:inherit; margin-bottom:10px; }
  .wlist{ overflow:auto; flex:1; }
  .wrow{ display:flex; align-items:center; gap:11px; padding:9px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
  .wrow:active{ background:#f0f3f0; }
  .wava{ width:46px; height:56px; border-radius:9px; background:#e6f0ea; color:var(--green); display:flex; align-items:center; justify-content:center; font-weight:600; overflow:hidden; flex:0 0 46px; }
  .wava img{ width:100%; height:100%; object-fit:cover; object-position:center top; }
  .wn{ font-size:14px; font-weight:600; } .ws{ font-size:11px; color:var(--muted); margin-top:2px; }
  .cancel{ border:0; background:#eef0ef; color:var(--ink); border-radius:12px; padding:13px; font-size:15px; font-weight:600; margin-top:10px; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <h1>จับคู่ไลน์น้อง ↔ การ์ด</h1>
    <p>เลือกไลน์ → จับคู่กับน้องในทะเบียน · หรือเลิกจับคู่</p>
  </header>
  <div class="tabs">
    <div class="tab on" id="tab-un" onclick="switchTab('un')">ยังไม่จับคู่</div>
    <div class="tab" id="tab-ma" onclick="switchTab('ma')">จับคู่แล้ว</div>
  </div>
  <div id="status">กำลังเชื่อมต่อ…</div>
  <div class="note" id="note" style="display:none"></div>
  <div class="list" id="list" style="display:none"></div>

  <div class="overlay" id="ov">
    <div class="sheet">
      <h2 id="ovTitle">เลือกน้องที่ตรงกับไลน์นี้</h2>
      <input class="search" id="search" placeholder="พิมพ์ค้นหาชื่อ/โรงงาน…" oninput="filterWorkers()">
      <div class="wlist" id="wlist"></div>
      <button class="cancel" onclick="closeOv()">ยกเลิก</button>
    </div>
  </div>

<script>
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";

/* ── D1-ความเร็ว · 2 ก.ย. 2026 ─────────────────────────────────────────────
   เลิกยิงเน็ตขอโปรไฟล์ทุกครั้งที่เปิดหน้า
   ทำไม: liff.getProfile() คุยกับเซิร์ฟเวอร์ LINE 1 รอบ (ราว 0.3-0.8 วิ) ทุกครั้ง
         ทั้งที่ตั๋วที่อยู่ในมือเราอยู่แล้วมีทั้งรหัสไลน์และชื่ออยู่ข้างใน
         และตั้งแต่มีด่าน D1 หลังบ้านก็ไม่เชื่อ userId ที่หน้าเว็บส่งไปแล้วด้วย
   ปลอดภัย: ถ้าอ่านจากตั๋วไม่ได้ (เช่น LIFF app ไม่ได้ติ๊ก openid) จะถอยไปใช้วิธีเดิมเอง
            ⇒ แย่ที่สุดคือ "เท่าเดิม" เป็นไปไม่ได้ที่จะพังเพราะก้อนนี้
   รูปร่างที่คืนออกมาเหมือน getProfile() เป๊ะ ⇒ โค้ดส่วนอื่นไม่ต้องแก้เลย */
function โปรไฟล์เร็ว_() {
  try {
    var d = liff.getDecodedIDToken();
    if (d && d.sub) return { userId: d.sub, displayName: d.name || '', pictureUrl: d.picture || '' };
  } catch (e) {}
  return null;                       // อ่านไม่ได้ = คืน null ให้ผู้เรียกถอยไปใช้ getProfile() เดิม
}


/* ═══════════════════════════════════════════════════════════════════
   D1 — เติม "ตั๋วยืนยันตัวตน" ให้ทุกคำขอที่ยิงไปหลังบ้าน   (2 ก.ย. 2026)
   แทรกที่เดียว ครอบทุกจุดที่หน้านี้ยิง API_URL — ไม่ต้องแก้ทีละจุด
   · เติม idToken อัตโนมัติทุกคำขอ
   · คำสั่ง "อ่าน" ยิงไม่ออก → ลองใหม่อัตโนมัติ 1 ครั้ง (สคริปต์หลังบ้านเย็นตอนคำขอแรกของวัน)
   · คำสั่ง "เขียน" ห้ามลองใหม่เด็ดขาด — จะได้ข้อมูลซ้ำ
   · ตั๋วหมดอายุ (~1 ชม.) → ขึ้นหน้าจอ "เข้าใหม่" ให้กดปุ่มเดียว
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  var _ยิงเดิม = window.fetch;
  var คำสั่งเขียน_ = { report:1, kpi:1, support:1, grievance:1, refer_worker:1, refer_broker:1,
                       update_status:1, announce:1, link_member:1, unlink_member:1 };
  var เตือนแล้ว_ = false;

  function หนี_(s) {
    return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c];
    });
  }

  /* จอเต็มหน้าที่ใช้ร่วมกันทุกกรณี — ทับหน้าเดิมไว้ ไม่ให้น้องเห็นข้อความดิบ */
  function จอ_(html, ปิดได้) {
    if (เตือนแล้ว_) return;
    เตือนแล้ว_ = true;
    var d = document.createElement('div');
    d.id = '_d1จอ';
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;' +
      'flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;' +
      'text-align:center;overflow:auto;-webkit-overflow-scrolling:touch;' +
      'font-family:-apple-system,"Segoe UI","Sarabun","Noto Sans Myanmar","Padauk",sans-serif');
    d.innerHTML = html;
    document.body.appendChild(d);

    var โหลด = document.getElementById('_d1โหลดใหม่');
    if (โหลด) โหลด.onclick = function () { location.reload(); };

    var ปิด = document.getElementById('_d1ปิด');
    if (ปิด) ปิด.onclick = function () {
      var x = document.getElementById('_d1จอ');
      if (x && x.parentNode) x.parentNode.removeChild(x);
      เตือนแล้ว_ = false;
    };

    var สลับ = document.getElementById('_d1สลับ');
    if (สลับ) สลับ.onclick = function () {
      var x = document.getElementById('_d1รายละเอียด');
      if (x) x.style.display = (x.style.display === 'none' ? 'block' : 'none');
    };
  }

  function หน้าเข้าใหม่_(ไม่มีตั๋วเลย) {
    if (ไม่มีตั๋วเลย) {
      จอ_('<div style="font-size:56px">🔧</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ตั้งค่าแอปยังไม่ครบ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">หน้านี้ยังขอ "ตั๋วยืนยันตัวตน" ไม่ได้<br>' +
        'App setup incomplete — please tell the admin</div>' +
        '<div style="font-size:13px;color:#888;margin-top:14px">แจ้งผู้ดูแลระบบ</div>');
    } else {
      จอ_('<div style="font-size:56px">⏱️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">หมดเวลา — เข้าใหม่</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">Session expired.<br>Please tap the button to continue.</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔑 เข้าใหม่ / Log in again</button>');
    }
  }

  /* ── ของใหม่ 3 ก.ย. 2026 ──────────────────────────────────────────
     คำตอบกลับมาไม่ใช่ JSON (เช่นได้หน้าเว็บ HTML แทน)
     เดิม: `await res.json()` พัง → เอาข้อความดิบภาษาอังกฤษไปแปะบนจอน้อง
     ใหม่: ขึ้นจอ 2 ภาษา + ปุ่มลองใหม่ + รายละเอียดสำหรับผู้ดูแลให้ถ่ายรูปส่งมา
     · คำสั่งอ่าน  → ลองใหม่อัตโนมัติ 1 ครั้งก่อน แล้วค่อยขึ้นจอ
     · คำสั่งเขียน → ห้ามลองใหม่เด็ดขาด (จะได้ข้อมูลซ้ำ) ขึ้นจอ "อย่าส่งซ้ำ"
     ──────────────────────────────────────────────────────────────── */
  function กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ) {
    var เวลา = '';
    try { เวลา = new Date().toLocaleString(); } catch (e) {}
    return '<div id="_d1สลับ" style="margin-top:20px;font-size:12px;color:#9a9a9a;' +
      'text-decoration:underline">รายละเอียดสำหรับผู้ดูแล / details</div>' +
      '<div id="_d1รายละเอียด" style="display:none;margin-top:10px;max-width:100%;' +
      'background:#f4f4f4;border-radius:10px;padding:10px 12px;font-size:11px;color:#444;' +
      'text-align:left;word-break:break-all;line-height:1.5;-webkit-user-select:text;user-select:text">' +
      '<b>D1-ERR</b> · not-json<br>' +
      'code: ' + หนี_(รหัส) + '<br>' +
      'action: ' + หนี_(คำสั่ง) + '<br>' +
      'time: ' + หนี_(เวลา) + '<br>' +
      'body: ' + หนี_(String(ต้นข้อความ || '').replace(/\s+/g, ' ').slice(0, 300)) +
      '</div>';
  }

  function หน้าคำตอบเพี้ยน_(เขียน, รหัส, คำสั่ง, ต้นข้อความ) {
    if (เขียน) {
      จอ_('<div style="font-size:56px">⚠️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ส่งแล้ว แต่ยังไม่รู้ผล</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        '🔴 <b>อย่ากดส่งซ้ำ</b> — ให้แจ้งผู้ดูแลตรวจให้ก่อน<br>' +
        'Sent, but result unknown. Do NOT send again.<br>' +
        'ပို့ပြီးပါပြီ။ ရလဒ်ကို မသိရသေးပါ။<br>ထပ်မပို့ပါနှင့်။ အက်ဒမင်ကို ဆက်သွယ်ပါ။</div>' +
        '<button id="_d1ปิด" style="margin-top:22px;padding:14px 28px;border:0;border-radius:12px;' +
        'background:#8a8a8a;color:#fff;font-size:16px;font-weight:700">ปิด / Close</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    } else {
      จอ_('<div style="font-size:56px">📡</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">โหลดข้อมูลไม่สำเร็จ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.7">' +
        'เซิร์ฟเวอร์ตอบกลับมาไม่ถูกต้อง กรุณากดลองใหม่<br>' +
        'Could not load. Please try again.<br>' +
        'ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။<br>ထပ်မံ ကြိုးစားပါ။</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔄 ลองใหม่ / ထပ်စမ်းရန်</button>' +
        กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ));
    }
  }

  /* คืนวัตถุที่หน้าเว็บเรียก .json() / .text() / .clone() ได้เหมือน Response เดิม
     (จำเป็นเพราะเราอ่าน body ไปแล้ว 1 ครั้ง อ่านซ้ำจาก Response จริงไม่ได้) */
  function ห่อ_(r) {
    var เนื้อ = r.txt;
    var วัตถุ = {
      ok: r.res ? !!r.res.ok : false,
      status: r.res ? r.res.status : 0,
      statusText: r.res ? r.res.statusText : '',
      headers: r.res ? r.res.headers : null,
      text: function () { return Promise.resolve(เนื้อ); },
      json: function () {
        return r.ดี ? Promise.resolve(r.j)
                    : Promise.reject(new SyntaxError('D1: server did not return JSON'));
      }
    };
    วัตถุ.clone = function () { return วัตถุ; };
    return วัตถุ;
  }

  window.fetch = function (u, o) {
    if (String(u) !== API_URL) return _ยิงเดิม.apply(this, arguments);

    var ก้อน = {};
    try { ก้อน = JSON.parse((o && o.body) || '{}'); } catch (e) { ก้อน = {}; }
    var ตั๋ว = null;
    try { ตั๋ว = liff.getIDToken(); } catch (e) {}
    if (ตั๋ว) ก้อน.idToken = ตั๋ว;

    var opt = { method: 'POST', body: JSON.stringify(ก้อน) };
    if (o) { for (var k in o) if (k !== 'method' && k !== 'body') opt[k] = o[k]; }

    var เขียน = !!คำสั่งเขียน_[ก้อน.action];
    var ลองใหม่ได้ = !เขียน;

    function รอ_(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function ยิงแล้วอ่าน_() {
      return _ยิงเดิม(u, opt).then(function (res) {
        return res.text().then(function (txt) {
          var j = null, ดี = false;
          try { j = JSON.parse(txt); ดี = true; } catch (e) {}
          return { res: res, txt: txt, j: j, ดี: ดี };
        }, function () {
          return { res: res, txt: '', j: null, ดี: false };
        });
      });
    }

    /* ชั้น 1 — ยิงไม่ออกเลย (เน็ตหลุด): ลองใหม่ 1 ครั้งเฉพาะคำสั่งอ่าน (ของเดิม) */
    var งาน = ยิงแล้วอ่าน_()['catch'](function (e) {
      if (!ลองใหม่ได้) throw e;
      return รอ_(1500).then(ยิงแล้วอ่าน_);
    });

    /* ชั้น 2 — ยิงออกแต่คำตอบไม่ใช่ JSON: ลองใหม่ 1 ครั้งเฉพาะคำสั่งอ่าน (ของใหม่) */
    งาน = งาน.then(function (r) {
      if (r.ดี || !ลองใหม่ได้) return r;
      return รอ_(1200).then(ยิงแล้วอ่าน_)['catch'](function () { return r; });
    });

    return งาน.then(function (r) {
      if (!r.ดี) {
        หน้าคำตอบเพี้ยน_(เขียน, r.res ? r.res.status : 0, ก้อน.action, r.txt);
      } else if (r.j && r.j.ok === false && r.j.error === 'AUTH_REQUIRED') {
        หน้าเข้าใหม่_(!ตั๋ว);
      }
      return ห่อ_(r);
    });
  };
})();
  let admin = null, members = [], workers = [], matched = [], currentMember = null, view = 'un', loadedMatched = false;

  function setStatus(t){ const s=document.getElementById('status'); s.style.display='block'; s.textContent=t; }
  function hideStatus(){ document.getElementById('status').style.display='none'; }
  function esc(s){ return String(s||'').replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
  function ini(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }

  async function api(body){ const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body)}); return r.json(); }

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      admin = (โปรไฟล์เร็ว_() || await liff.getProfile());
      loadUnmatched();
    }catch(e){ setStatus("เปิดผ่านแอป LINE ไม่สำเร็จ: "+(e.message||e)); }
  }

  function switchTab(v){
    view = v;
    document.getElementById('tab-un').classList.toggle('on', v==='un');
    document.getElementById('tab-ma').classList.toggle('on', v==='ma');
    if(v==='ma'){ loadMatched(); } else { render(); document.getElementById('note').style.display='block'; }
  }

  async function loadUnmatched(){
    setStatus("กำลังโหลดข้อมูล…");
    try{
      const data = await api({ action:"matching_data", userId: admin.userId });
      if(!data.ok){ setStatus(data.error==='NOT_ADMIN' ? "⚠️ หน้านี้สำหรับแอดมินเท่านั้น" : ("⚠️ "+(data.error||""))); return; }
      members = data.members || []; workers = data.workers || [];
      render();
    }catch(e){ setStatus(String(e.message||e)); }
  }

  async function loadMatched(){
    setStatus("กำลังโหลดรายชื่อที่จับคู่…"); document.getElementById('list').style.display='none'; document.getElementById('note').style.display='none';
    try{
      const data = await api({ action:"matched_list", userId: admin.userId });
      if(!data.ok){ setStatus("⚠️ "+(data.error||"")); return; }
      matched = data.matched || []; loadedMatched = true;
      render();
    }catch(e){ setStatus(String(e.message||e)); }
  }

  function render(){
    hideStatus();
    const L = document.getElementById('list'); L.style.display='block';
    const note = document.getElementById('note');
    if(view==='un'){
      note.style.display='block';
      note.textContent = "ไลน์ที่ยังไม่จับคู่ " + members.length + " · น้องที่ยังไม่ผูก " + workers.length;
      if(members.length===0){ L.innerHTML = '<div style="text-align:center;padding:30px;color:#2f7d55">✅ ไม่มีไลน์ค้างจับคู่</div>'; return; }
      L.innerHTML = members.map(function(m,i){
        const ava = m.picture ? '<img src="'+esc(m.picture)+'">' : esc(ini(m.name));
        return '<div class="mcard"><div class="mava">'+ava+'</div>'
             + '<div class="minfo"><div class="mname">'+esc(m.name)+'</div><div class="msub">ชื่อ/รูปที่น้องตั้งเอง</div></div>'
             + '<button class="mbtn b-link" onclick="openOv('+i+')">จับคู่</button></div>';
      }).join('');
    } else {
      note.style.display='none';
      if(matched.length===0){ L.innerHTML = '<div style="text-align:center;padding:30px;color:#7b8a82">ยังไม่มีน้องที่จับคู่</div>'; return; }
      L.innerHTML = matched.map(function(m){
        const ava = m.photo_url ? '<img src="'+esc(m.photo_url)+'">' : esc(ini(m.name));
        return '<div class="mcard"><div class="mava sq">'+ava+'</div>'
             + '<div class="minfo"><div class="mname">'+esc(m.name)+'</div><div class="msub">'+esc(m.site)+' · LINE: '+esc(m.line_name||'-')+'</div></div>'
             + '<button class="mbtn b-unlink" onclick=\'unlink('+JSON.stringify(m).replace(/'/g,"&#39;")+')\'>เลิกจับคู่</button></div>';
      }).join('');
    }
  }

  function openOv(i){
    currentMember = members[i];
    document.getElementById('ovTitle').textContent = 'ไลน์ "'+currentMember.name+'" คือน้องคนไหน?';
    document.getElementById('search').value = '';
    renderWorkers(workers);
    document.getElementById('ov').classList.add('open');
  }
  function closeOv(){ document.getElementById('ov').classList.remove('open'); }

  function renderWorkers(list){
    document.getElementById('wlist').innerHTML = list.map(function(w){
      const ava = w.photo_url ? '<img src="'+esc(w.photo_url)+'">' : esc(ini(w.name));
      return '<div class="wrow" onclick=\'pickWorker('+JSON.stringify(w).replace(/'/g,"&#39;")+')\'>'
           + '<div class="wava">'+ava+'</div><div><div class="wn">'+esc(w.name)+'</div><div class="ws">'+esc(w.site)+'</div></div></div>';
    }).join('') || '<div style="padding:20px;text-align:center;color:#7b8a82">ไม่พบน้อง</div>';
  }
  function filterWorkers(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    renderWorkers(!q ? workers : workers.filter(function(w){ return (w.name+' '+w.site).toLowerCase().indexOf(q)>-1; }));
  }

  async function pickWorker(w){
    if(!confirm('ยืนยันผูก\n\nไลน์: '+currentMember.name+'\n= น้อง: '+w.name+' ('+w.site+')')) return;
    try{
      const data = await api({ action:"link_member", userId: admin.userId, target_user_id: currentMember.user_id, card_id: w.card_id });
      if(!data.ok){ alert("ผูกไม่สำเร็จ: "+(data.error||"")); return; }
      members = members.filter(function(m){ return m.user_id !== currentMember.user_id; });
      workers = workers.filter(function(x){ return x.card_id !== w.card_id; });
      loadedMatched = false;
      closeOv(); render();
      alert("✅ ผูกแล้ว: "+w.name);
    }catch(e){ alert("ผิดพลาด: "+(e.message||e)); }
  }

  async function unlink(m){
    if(!confirm('เลิกจับคู่น้อง "'+m.name+'" ('+m.site+') ?\nLINE: '+(m.line_name||'-'))) return;
    try{
      const data = await api({ action:"unlink_member", userId: admin.userId, card_id: m.card_id });
      if(!data.ok){ alert("เลิกจับคู่ไม่สำเร็จ: "+(data.error||"")); return; }
      matched = matched.filter(function(x){ return x.card_id !== m.card_id; });
      render();
      alert("✅ เลิกจับคู่แล้ว: "+m.name+"\n(สลับไปแท็บ 'ยังไม่จับคู่' เพื่อจับใหม่ได้)");
    }catch(e){ alert("ผิดพลาด: "+(e.message||e)); }
  }

  main();
</script>
</body>
</html>
