<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>จับคู่ไลน์น้อง</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --slate:#33415c; --slate-d:#26324a; --green:#2f7d55; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--slate); color:#fff; padding:16px; position:sticky; top:0; z-index:5; }
  header h1{ font-size:16px; margin:0; font-weight:600; }
  header p{ font-size:13px; margin:4px 0 0; opacity:.85; }
  #status{ padding:24px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .note{ padding:10px 16px; font-size:12.5px; color:var(--muted); }
  .list{ padding:10px 12px; }
  .mcard{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:10px; }
  .mava{ width:48px; height:48px; border-radius:50%; background:#dde3ec; color:var(--slate-d); display:flex; align-items:center; justify-content:center; font-weight:600; overflow:hidden; flex:0 0 48px; }
  .mava img{ width:100%; height:100%; object-fit:cover; }
  .minfo{ flex:1; min-width:0; }
  .mname{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .mbtn{ border:0; border-radius:10px; background:var(--green); color:#fff; font-weight:600; font-size:13px; padding:9px 14px; cursor:pointer; flex:0 0 auto; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:20; }
  .overlay.open{ display:flex; }
  .sheet{ background:#fff; width:100%; border-radius:18px 18px 0 0; padding:16px; max-height:88vh; display:flex; flex-direction:column; }
  .sheet h2{ font-size:15px; margin:0 0 10px; }
  .search{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; font-family:inherit; margin-bottom:10px; }
  .wlist{ overflow:auto; flex:1; }
  .wrow{ display:flex; align-items:center; gap:11px; padding:9px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
  .wrow:active{ background:#f0f3f0; }
  .wava{ width:46px; height:56px; border-radius:9px; background:#e6f0ea; color:var(--green); display:flex; align-items:center; justify-content:center; font-weight:600; overflow:hidden; flex:0 0 46px; }
  .wava img{ width:100%; height:100%; object-fit:cover; object-position:center top; }
  .wn{ font-size:14px; font-weight:600; } .ws{ font-size:11px; color:var(--muted); margin-top:2px; }
  .cancel{ border:0; background:#eef0ef; color:var(--ink); border-radius:12px; padding:13px; font-size:15px; font-weight:600; margin-top:10px; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <h1>จับคู่ไลน์น้อง ↔ การ์ด</h1>
    <p>เลือกไลน์ทางซ้าย → จับคู่กับน้องในทะเบียน</p>
  </header>
  <div id="status">กำลังเชื่อมต่อ…</div>
  <div class="note" id="note" style="display:none"></div>
  <div class="list" id="list" style="display:none"></div>

  <div class="overlay" id="ov">
    <div class="sheet">
      <h2 id="ovTitle">เลือกน้องที่ตรงกับไลน์นี้</h2>
      <input class="search" id="search" placeholder="พิมพ์ค้นหาชื่อ/โรงงาน…" oninput="filterWorkers()">
      <div class="wlist" id="wlist"></div>
      <button class="cancel" onclick="closeOv()">ยกเลิก</button>
    </div>
  </div>

<script>
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";
  let admin = null, members = [], workers = [], currentMember = null;

  function setStatus(t){ const s=document.getElementById('status'); s.style.display='block'; s.textContent=t; }
  function hideStatus(){ document.getElementById('status').style.display='none'; }
  function esc(s){ return String(s||'').replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
  function ini(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      admin = await liff.getProfile();
      load();
    }catch(e){ setStatus("เปิดผ่านแอป LINE ไม่สำเร็จ: "+(e.message||e)); }
  }

  async function load(){
    setStatus("กำลังโหลดข้อมูล…");
    try{
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({ action:"matching_data", userId: admin.userId }) });
      const data = await res.json();
      if(!data.ok){ setStatus(data.error==='NOT_ADMIN' ? "⚠️ หน้านี้สำหรับแอดมินเท่านั้น" : ("⚠️ "+(data.error||""))); return; }
      members = data.members || []; workers = data.workers || [];
      const note = document.getElementById('note');
      note.style.display='block';
      note.textContent = "ไลน์ที่ยังไม่จับคู่ " + members.length + " · น้องที่ยังไม่ผูก " + workers.length
        + (data.capped ? " (แสดง 60 รายแรก จับคู่แล้วรีเฟรชดูต่อ)" : "");
      render();
    }catch(e){ setStatus(String(e.message||e)); }
  }

  function render(){
    hideStatus();
    const L = document.getElementById('list'); L.style.display='block';
    if(members.length===0){ L.innerHTML = '<div style="text-align:center;padding:30px;color:#2f7d55">✅ ไม่มีไลน์ค้างจับคู่</div>'; return; }
    L.innerHTML = members.map(function(m,i){
      const ava = m.picture ? '<img src="'+esc(m.picture)+'">' : esc(ini(m.name));
      return '<div class="mcard"><div class="mava">'+ava+'</div>'
           + '<div class="minfo"><div class="mname">'+esc(m.name)+'</div><div class="msub">ชื่อ/รูปที่น้องตั้งเอง</div></div>'
           + '<button class="mbtn" onclick="openOv('+i+')">จับคู่</button></div>';
    }).join('');
  }

  function openOv(i){
    currentMember = members[i];
    document.getElementById('ovTitle').textContent = 'ไลน์ "'+currentMember.name+'" คือน้องคนไหน?';
    document.getElementById('search').value = '';
    renderWorkers(workers);
    document.getElementById('ov').classList.add('open');
  }
  function closeOv(){ document.getElementById('ov').classList.remove('open'); }

  function renderWorkers(list){
    document.getElementById('wlist').innerHTML = list.map(function(w){
      const ava = w.photo_url ? '<img src="'+esc(w.photo_url)+'">' : esc(ini(w.name));
      return '<div class="wrow" onclick=\'pickWorker('+JSON.stringify(w).replace(/'/g,"&#39;")+')\'>'
           + '<div class="wava">'+ava+'</div><div><div class="wn">'+esc(w.name)+'</div><div class="ws">'+esc(w.site)+'</div></div></div>';
    }).join('') || '<div style="padding:20px;text-align:center;color:#7b8a82">ไม่พบน้อง</div>';
  }
  function filterWorkers(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    renderWorkers(!q ? workers : workers.filter(function(w){ return (w.name+' '+w.site).toLowerCase().indexOf(q)>-1; }));
  }

  async function pickWorker(w){
    if(!confirm('ยืนยันผูก\n\nไลน์: '+currentMember.name+'\n= น้อง: '+w.name+' ('+w.site+')')) return;
    try{
      const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({
        action:"link_member", userId: admin.userId, target_user_id: currentMember.user_id, card_id: w.card_id }) });
      const data = await res.json();
      if(!data.ok){ alert("ผูกไม่สำเร็จ: "+(data.error||"")); return; }
      members = members.filter(function(m){ return m.user_id !== currentMember.user_id; });
      workers = workers.filter(function(x){ return x.card_id !== w.card_id; });
      closeOv();
      document.getElementById('note').textContent = "ไลน์ที่ยังไม่จับคู่ " + members.length + " · น้องที่ยังไม่ผูก " + workers.length;
      render();
      alert("✅ ผูกแล้ว: "+w.name);
    }catch(e){ alert("ผิดพลาด: "+(e.message||e)); }
  }

  main();
</script>
</body>
</html>
