<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jasmine Shop</title>
<style>
  :root{
    --bg:#f6f5f0; --card:#ffffff; --ink:#23291f; --muted:#7c8473;
    --line:#e7e4d8; --brand:#4f7a4d; --brand-d:#3c6140; --accent:#c8a04b;
    --danger:#b3402f; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Noto Sans Myanmar","Padauk","Noto Sans",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:96px;}
  header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.3px}
  .brand .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);
    display:grid;place-items:center;font-size:14px}
  .lang{display:flex;gap:4px}
  .lang button{border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
  .lang button.on{background:#fff;color:var(--brand-d)}
  .userbar{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:13px}
  .userbar img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--line)}
  .state{padding:40px 20px;text-align:center;color:var(--muted)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{margin:16px;padding:16px;border:1px solid var(--danger);border-radius:var(--radius);
    background:#fdecea;color:var(--danger);font-size:14px;line-height:1.5;display:none;white-space:pre-wrap}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column}
  .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line);display:block}
  .body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .pname{font-weight:700;font-size:14px;line-height:1.35}
  .pdesc{font-size:12px;color:var(--muted);line-height:1.4}
  .stockline{font-size:11px;color:var(--muted)}
  .stockline.out{color:var(--danger);font-weight:700}
  .price{font-weight:800;color:var(--brand-d);font-size:15px;margin-top:auto}
  .price span{font-size:12px;font-weight:600;color:var(--muted)}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:20px;font-weight:700;color:var(--brand-d);cursor:pointer;line-height:1}
  .stepper .add{flex:1;height:34px;border-radius:10px;border:0;background:var(--brand);
    color:#fff;font-weight:700;font-size:13px;cursor:pointer}
  .stepper .add:disabled{background:#bbb;cursor:default}
  .qty{min-width:30px;text-align:center;font-weight:800;font-size:16px}
  .qtygroup{display:flex;align-items:center;gap:8px;flex:1;justify-content:space-between}
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
    border-top:1px solid var(--line);padding:12px 16px;display:none;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .cartbar.show{display:block}
  .cartbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cartbar .sum{font-size:13px;color:var(--muted)}
  .cartbar .sum b{display:block;font-size:20px;color:var(--ink)}
  .cartbar .confirm{border:0;border-radius:12px;background:var(--brand);color:#fff;
    padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer;flex-shrink:0}
  .cartbar .confirm:disabled{opacity:.5}
  .success{margin:16px;padding:22px 18px;border-radius:var(--radius);background:#eef6ee;
    border:1px solid #cfe3cf;text-align:center;display:none}
  .success .check{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
  .success h2{margin:6px 0;font-size:18px}
  .success .oid{font-weight:800;color:var(--brand-d);font-size:16px;margin:4px 0}
  .success ul{text-align:left;margin:12px 0;padding:0 0 0 4px;list-style:none;font-size:14px}
  .success li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
  .success .again{margin-top:14px;border:0;background:var(--brand);color:#fff;
    border-radius:12px;padding:12px 24px;font-weight:700;cursor:pointer}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  #debug{margin:16px;padding:10px;border-radius:10px;background:#1f241b;color:#9fe39f;
    font:12px/1.5 monospace;white-space:pre-wrap;display:none}

  /* ── D1-ความเร็ว 2 ก.ย. 2026 · โหมด "ทางผ่าน" ──
     เปิดผ่านลิงก์ LIFF ที่มีชื่อหน้าต่อท้าย → LINE พามาหน้านี้ก่อนเสมอ แล้ว liff.init() จะพาไปหน้าจริง
     ระหว่างนั้นซ่อนทุกอย่างที่เป็น "ร้านค้า" ไว้ เหลือแต่วงหมุน จะได้ไม่เห็นข้อความพม่าแวบมา
     ใช้ visibility ไม่ใช่ display เพื่อไม่ให้หน้ากระตุกตอนปลดโหมด */
  html.liff-pass header,
  html.liff-pass .userbar,
  html.liff-pass #loadingText,
  html.liff-pass .errbox { visibility:hidden !important; }
</style>
</head>
<body>
<script>/* D1-ความเร็ว: ต้องรันก่อนหน้าถูกวาด ไม่งั้นข้อความพม่าจะแวบให้เห็น */
if(/[?&]liff\.state=/.test(location.search)) document.documentElement.className += ' liff-pass';
</script>

  <header>
    <div class="brand"><span class="dot">🌼</span><span>Jasmine Shop</span></div>
    <div class="lang">
      <button data-lang="my" class="on">မြန်မာ</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <div class="userbar" id="userbar" style="display:none">
    <img id="uPic" alt=""><span id="uName"></span>
  </div>

  <div class="errbox" id="errbox"></div>

  <div class="state" id="loading">
    <div class="spinner"></div>
    <div id="loadingText">ဆိုင်ဖွင့်နေသည်...</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="success" id="success">
    <div class="check">✓</div>
    <h2 id="okTitle"></h2>
    <div class="oid" id="okId"></div>
    <ul id="okItems"></ul>
    <div id="okNote" class="note"></div>
    <button class="again" id="againBtn"></button>
  </div>

  <div class="cartbar" id="cartbar">
    <div class="row">
      <div class="sum"><span id="cartCount"></span><b id="cartTotal">0 ฿</b></div>
      <button class="confirm" id="confirmBtn"></button>
    </div>
  </div>

  <pre id="debug"></pre>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
  (function () {
    "use strict";

    // ====== ตั้งค่า ======
    var LIFF_ID = '2010242926-nreePSO4';
    var API_URL = 'https://script.google.com/macros/s/AKfycbxn_hBzAy512R8msX-qXd4y1G_o4DFu78PZwENZRmQlt5R3Ns1bprUN3PeYxWMMrzv9ew/exec';
    var DEBUG   = false; // เปลี่ยนเป็น true ถ้าต้องการดูสถานะตอนแก้ปัญหา

    // ====== คำแปล (มြန်မာ / English) ======
    var I18N = {
      my:{open:'ဆိုင်ဖွင့်နေသည်...',loadErr:'ပစ္စည်းများ ဖွင့်၍မရပါ',empty:'ပစ္စည်း မရှိသေးပါ',
          add:'ထည့်မည်',confirm:'အော်ဒါ အတည်ပြုမည်',items:'ခု',baht:'ဘတ်',sending:'သိမ်းနေသည်...',
          okTitle:'မှာယူမှု အောင်မြင်ပါသည်',orderNo:'အော်ဒါနံပါတ်',again:'ထပ်မှာမည်',
          left:'ကျန်',outOfStock:'ကုန်သွားပြီ',
          sent:'အော်ဒါအချက်အလက်ကို LINE chat သို့ ပို့ပြီးပါပြီ',
          notSent:'အော်ဒါ သိမ်းပြီးပါပြီ။ ဆိုင်မှ လက်ခံရရှိပါပြီ။',
          loginNeed:'LINE login သို့ ပြန်ညွှန်းနေသည်...'},
      en:{open:'Opening shop...',loadErr:'Failed to load products',empty:'No products yet',
          add:'Add',confirm:'Confirm order',items:'items',baht:'฿',sending:'Saving...',
          okTitle:'Order placed',orderNo:'Order No.',again:'Order more',
          left:'left',outOfStock:'Out of stock',
          sent:'Order summary sent to your LINE chat',
          notSent:'Order saved. The shop has received it.',
          loginNeed:'Redirecting to LINE login...'}
    };

    var lang='my', products=[], cart={}, profile=null;
    function $(id){ return document.getElementById(id); }
    function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.my[k] || k; }
    function dbg(m){ if(!DEBUG) return; var b=$('debug'); b.style.display='block'; b.textContent+=m+'\n'; }

    function showError(msg){
      $('loading').style.display='none';
      var box=$('errbox'); box.style.display='block'; box.textContent='⚠️ '+msg; dbg('ERROR: '+msg);
    }
    window.onerror = function(m){ showError('JS Error: ' + m); };

    function prodById(id){ for(var i=0;i<products.length;i++){ if(products[i].id===id) return products[i]; } return null; }

    // ชื่อ/รายละเอียด ตามภาษา (ไม่ดึงภาษาไทยมาโชว์)
    function pName(p){
      if(lang==='en') return p.name_en || p.name_my || p.name || p.id;
      return p.name_my || p.name_en || p.name || p.id;
    }
    function pDesc(p){
      if(lang==='en') return p.desc_en || p.desc_my || '';
      return p.desc_my || p.desc_en || '';
    }

    /* ══ D1-ความเร็ว · 2 ก.ย. 2026 ═══════════════════════════════════════════════
       ปัญหา: กดเมนู Ops อะไรก็ตาม จะเห็นจอร้านค้า + ข้อความพม่าแวบก่อนเสมอ
       สาเหตุ: LIFF app ตัวเดียวใช้ทุกหน้า · LINE โหลด "Endpoint URL" (= หน้านี้) ก่อนเสมอ
               แล้วส่ง liff.state มา จากนั้น liff.init() ถึงพาไปหน้าจริง — เป็นกลไกปกติของ LIFF ไม่ใช่บั๊ก
       วิธีแก้: หน้านี้ยอมเป็น "ทางผ่าน" — ไม่โชว์ร้าน ไม่โหลดโปรไฟล์ ไม่โหลดสินค้า แล้วปล่อยให้ SDK พาไป
       🔴 ห้ามเปลี่ยน URL เอง · ห้ามแตะ liff.state · ห้าม redirect ก่อน liff.init() เสร็จ (เอกสาร LINE)
       ตัวกันสำรอง: ถ้า 5 วินาทีแล้วยังอยู่หน้านี้ = SDK ไม่ได้พาไปไหน → เปิดร้านตามปกติ
                     (ถ้า SDK พาไปแล้ว หน้านี้จะถูกทิ้ง ตัวจับเวลาไม่มีวันทำงาน)
       ══════════════════════════════════════════════════════════════════════════ */
    var เป็นทางผ่าน_ = /[?&]liff\.state=/.test(location.search);
    var ร้านเปิดแล้ว_ = false;

    function ปลดโหมดทางผ่าน_(){
      document.documentElement.className =
        document.documentElement.className.replace(/\s*liff-pass/g, '');
    }

    /** ใส่โปรไฟล์ลงแถบบน แล้วโหลดสินค้า (ของเดิม แยกออกมาให้เรียกได้ 2 ทาง) */
    function ใส่โปรไฟล์แล้วโหลดสินค้า_(p){
      if(!p){ loadProducts(); return; }
      profile = { userId:p.userId, displayName:p.displayName, pictureUrl:p.pictureUrl };
      dbg('profile='+profile.displayName);
      $('uName').textContent = profile.displayName || '';
      if(profile.pictureUrl) $('uPic').src = profile.pictureUrl;
      $('userbar').style.display='flex';
      loadProducts();
    }

    /** เปิดร้านตามปกติ — เรียกได้ทั้งจากทางปกติ และจากตัวกันสำรอง 5 วิ
     *  เขียนให้ทนทาง: ถ้า liff.init() ยังไม่เสร็จตอนตัวกันสำรองทำงาน ก็ยังเปิดร้านได้ (แค่ไม่มีชื่อบนแถบ) */
    function เปิดร้านตามปกติ_(){
      if(ร้านเปิดแล้ว_) return; ร้านเปิดแล้ว_ = true;
      ปลดโหมดทางผ่าน_();
      $('loadingText').textContent = t('open');
      try {
        if(!liff.isLoggedIn() && !liff.isInClient()){
          $('loadingText').textContent = t('loginNeed'); liff.login(); return;
        }
        liff.getProfile()
          .then(ใส่โปรไฟล์แล้วโหลดสินค้า_)
          .catch(function(){ loadProducts(); });      // โปรไฟล์ล้ม ก็ยังต้องเปิดร้านได้
      } catch(e){ loadProducts(); }                    // init ยังไม่เสร็จ → ข้ามโปรไฟล์ เปิดร้านเลย
    }

    function start(){
      if(!เป็นทางผ่าน_) $('loadingText').textContent = t('open');
      if(typeof liff === 'undefined'){ ปลดโหมดทางผ่าน_(); showError('LIFF SDK load failed'); return; }
      if(เป็นทางผ่าน_) setTimeout(เปิดร้านตามปกติ_, 5000);   // ตัวกันสำรอง
      liff.init({ liffId: LIFF_ID })
        .then(function(){
          dbg('liff.init OK isInClient='+liff.isInClient()+' isLoggedIn='+liff.isLoggedIn()+' ทางผ่าน='+เป็นทางผ่าน_);
          if(เป็นทางผ่าน_) return null;                 // 🔴 SDK กำลังพาไปหน้าจริง — จบแค่นี้ ห้ามทำอะไรต่อ
          เปิดร้านตามปกติ_();
          return null;
        })
        .catch(function(err){
          ปลดโหมดทางผ่าน_();
          showError('LIFF init failed: '+(err && err.message ? err.message : err));
        });
    }

    function loadProducts(){
      fetch(API_URL + '?action=products')
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(!res || !res.ok){ showError(t('loadErr')+' : '+(res && res.error)); return; }
          products = res.products || [];
          $('loading').style.display='none';
          renderGrid();
        })
        .catch(function(err){ showError(t('loadErr')+' : '+err); });
    }

    function renderGrid(){
      var grid=$('grid'); grid.innerHTML='';
      if(products.length===0){ grid.innerHTML='<div class="state">'+t('empty')+'</div>'; return; }
      products.forEach(function(p){
        var card=document.createElement('div'); card.className='card';
        var img=p.image_url || 'https://placehold.co/600x600?text=No+Image';
        var desc=pDesc(p);
        var stockHtml='';
        if(p.stock!==null && p.stock!==undefined){
          if(p.stock<=0) stockHtml='<div class="stockline out">'+t('outOfStock')+'</div>';
          else stockHtml='<div class="stockline">'+t('left')+' '+p.stock+'</div>';
        }
        card.innerHTML=
          '<img class="thumb" src="'+escAttr(img)+'" alt="" '+
            'onerror="this.src=\'https://placehold.co/600x600?text=No+Image\'">'+
          '<div class="body">'+
            '<div class="pname">'+escHtml(pName(p))+'</div>'+
            (desc?'<div class="pdesc">'+escHtml(desc)+'</div>':'')+
            stockHtml+
            '<div class="price">'+p.price+' <span>'+t('baht')+'</span></div>'+
            '<div class="stepper" data-id="'+escAttr(p.id)+'"></div>'+
          '</div>';
        grid.appendChild(card);
        renderStepper(card.querySelector('.stepper'), p);
      });
    }

    function renderStepper(el, p){
      var id=p.id, qty=cart[id]||0;
      var out = (p.stock!==null && p.stock!==undefined && p.stock<=0);
      if(out){
        el.innerHTML='<button class="add" disabled>'+t('outOfStock')+'</button>';
        return;
      }
      if(qty<=0){
        el.innerHTML='<button class="add">'+t('add')+'</button>';
        el.querySelector('.add').onclick=function(){ setQty(id,1); };
      } else {
        el.innerHTML='<div class="qtygroup"><button class="minus">−</button>'+
          '<span class="qty">'+qty+'</span><button class="plus">+</button></div>';
        el.querySelector('.minus').onclick=function(){ setQty(id,qty-1); };
        el.querySelector('.plus').onclick =function(){ setQty(id,qty+1); };
      }
    }

    function setQty(id,q){
      var p=prodById(id);
      var max=(p && p.stock!==null && p.stock!==undefined)?p.stock:Infinity;
      q=Math.max(0,Math.min(q,max));
      if(q===0) delete cart[id]; else cart[id]=q;
      var el=document.querySelector('.stepper[data-id="'+cssEsc(id)+'"]');
      if(el && p) renderStepper(el,p);
      updateCartBar();
    }

    function cartSummary(){
      var count=0,total=0;
      products.forEach(function(p){ var q=cart[p.id]||0; if(q>0){ count+=q; total+=p.price*q; } });
      return { count:count, total:total };
    }
    function updateCartBar(){
      var s=cartSummary(), bar=$('cartbar');
      if(s.count>0){
        bar.classList.add('show');
        $('cartCount').textContent=s.count+' '+t('items')+'  ';
        $('cartTotal').textContent=s.total+' '+t('baht');
        $('confirmBtn').textContent=t('confirm');
      } else { bar.classList.remove('show'); }
    }

    function confirmOrder(){
      var items=[];
      Object.keys(cart).forEach(function(id){ items.push({ id:id, qty:cart[id] }); });
      if(items.length===0) return;
      if(!profile){ showError('No LINE profile'); return; }
      var btn=$('confirmBtn'); btn.disabled=true; btn.textContent=t('sending');
      fetch(API_URL, { method:'POST', body: JSON.stringify({ profile:profile, items:items }) })
        .then(function(r){ return r.json(); })
        .then(function(res){
          btn.disabled=false; btn.textContent=t('confirm');
          if(!res || !res.ok){ showError('Cannot save order: '+(res && res.error)); return; }
          onOrderSuccess(res);
        })
        .catch(function(err){
          btn.disabled=false; btn.textContent=t('confirm');
          showError('Cannot save order: '+err);
        });
    }

    function onOrderSuccess(res){
      cart={}; updateCartBar();
      $('grid').style.display='none';
      $('cartbar').classList.remove('show');
      $('okTitle').textContent=t('okTitle');
      $('okId').textContent=t('orderNo')+' : '+res.orderId;
      var ul=$('okItems'); ul.innerHTML='';
      var lines=['🌼 Jasmine Shop', t('orderNo')+' '+res.orderId];
      res.items.forEach(function(it){
        var li=document.createElement('li');
        li.innerHTML='<span>'+escHtml(it.name)+' x'+it.qty+'</span><span>'+it.subtotal+' '+t('baht')+'</span>';
        ul.appendChild(li);
        lines.push('• '+it.name+' x'+it.qty+' = '+it.subtotal+t('baht'));
      });
      var liT=document.createElement('li');
      liT.innerHTML='<b>'+t('items')+'</b><b>'+res.total+' '+t('baht')+'</b>';
      ul.appendChild(liT);
      lines.push('Total '+res.total+t('baht'));
      $('againBtn').textContent=t('again');
      $('success').style.display='block';
      window.scrollTo(0,0);
      var noteEl=$('okNote');
      if(typeof liff!=='undefined' && liff.isInClient()){
        liff.sendMessages([{ type:'text', text: lines.join('\n') }])
          .then(function(){ noteEl.textContent='✓ '+t('sent'); })
          .catch(function(e){ noteEl.textContent=t('notSent'); dbg('sendMessages fail: '+e); });
      } else { noteEl.textContent=t('notSent'); }
    }

    function bindUI(){
      var btns=document.querySelectorAll('.lang button');
      btns.forEach(function(b){
        b.onclick=function(){
          lang=b.getAttribute('data-lang');
          btns.forEach(function(x){ x.classList.remove('on'); });
          b.classList.add('on');
          renderGrid(); updateCartBar();
          $('againBtn').textContent=t('again');
        };
      });
      $('confirmBtn').onclick=confirmOrder;
      $('againBtn').onclick=function(){
        $('success').style.display='none';
        $('grid').style.display='grid';
        $('okNote').textContent='';
        window.scrollTo(0,0);
      };
      $('againBtn').textContent=t('again');
    }

    function escHtml(s){ return String(s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function escAttr(s){ return escHtml(s); }
    function cssEsc(s){ return String(s).replace(/"/g,'\\"'); }

    bindUI();
    start();
  })();
  </script>
</body>
</html>
