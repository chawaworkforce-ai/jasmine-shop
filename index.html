<meta charset="utf-8">
<script>
/* สวิตช์ปิดหน้า (S4-4) 21 ก.ย. 2026 — ปิดหน้าไหนก็ได้โดยแก้ไฟล์ flags.json ไฟล์เดียว
   หลักที่ยึด: "อ่านไม่ได้ = เปิดตามปกติ" (fail-open)
   ถ้าเน็ตช้า ไฟล์หาย หรือไฟล์เสีย ⇒ หน้าทำงานปกติ ห้ามพังเพราะตัวกันพัง
   ใส่ ?ts= กับ no-store เพื่อไม่ให้ติดแคช 10 นาทีของ GitHub Pages ⇒ ปิดแล้วเห็นผลเกือบทันที */
(function () {
  try {
    if (!window.fetch || !window.AbortController) return;          // เบราว์เซอร์เก่า = เปิดตามปกติ
    var ชื่อหน้า = (location.pathname.split('/').pop() || '').replace(/\.html$/i, '') || 'index';
    var ตัวตัด = new AbortController();
    var นาฬิกา = setTimeout(function () { ตัวตัด.abort(); }, 3000); // เกิน 3 วินาที = เลิกถาม เปิดตามปกติ
    fetch('flags.json?ts=' + Date.now(), { cache: 'no-store', signal: ตัวตัด.signal })
      .then(function (r) { clearTimeout(นาฬิกา); return r.ok ? r.json() : null; })
      .then(function (ธง) {
        if (ธง && String(ธง[ชื่อหน้า] == null ? '' : ธง[ชื่อหน้า]).trim().toLowerCase() === 'off') {
          location.replace('maintenance.html?p=' + encodeURIComponent(ชื่อหน้า));
        }
      })
      .catch(function () { clearTimeout(นาฬิกา); });                 // อ่านไม่ได้ = เปิดตามปกติ
  } catch (e) { /* อะไรก็ตามที่พังตรงนี้ ห้ามทำให้หน้าพัง */ }
})();
</script>

  #debug{margin:16px;padding:10px;border-radius:10px;background:#1f241b;color:#9fe39f;
    font:12px/1.5 monospace;white-space:pre-wrap;display:none}

  /* ── D1-ความเร็ว 2 ก.ย. 2026 · โหมด "ทางผ่าน" ──
     เปิดผ่านลิงก์ LIFF ที่มีชื่อหน้าต่อท้าย → LINE พามาหน้านี้ก่อนเสมอ แล้ว liff.init() จะพาไปหน้าจริง
     ระหว่างนั้นซ่อนทุกอย่างที่เป็น "ร้านค้า" ไว้ เหลือแต่วงหมุน จะได้ไม่เห็นข้อความพม่าแวบมา

<script>/* D1-ความเร็ว: ต้องรันก่อนหน้าถูกวาด ไม่งั้นข้อความพม่าจะแวบให้เห็น */
if(/[?&]liff\.state=/.test(location.search)) document.documentElement.className += ' liff-pass';

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
  (function () {
    "use strict";

    // ====== ตั้งค่า ======
    var LIFF_ID = '2010242926-nreePSO4';
    var API_URL = 'https://script.google.com/macros/s/AKfycbxn_hBzAy512R8msX-qXd4y1G_o4DFu78PZwENZRmQlt5R3Ns1bprUN3PeYxWMMrzv9ew/exec';
    var DEBUG   = false; // เปลี่ยนเป็น true ถ้าต้องการดูสถานะตอนแก้ปัญหา

    // ====== คำแปล (มြန်မာ / English) ======
    var I18N = {
      my:{open:'ဆိုင်ဖွင့်နေသည်...',loadErr:'ပစ္စည်းများ ဖွင့်၍မရပါ',empty:'ပစ္စည်း မရှိသေးပါ',
          add:'ထည့်မည်',confirm:'အော်ဒါ အတည်ပြုမည်',items:'ခု',baht:'ဘတ်',sending:'သိမ်းနေသည်...',
          okTitle:'မှာယူမှု အောင်မြင်ပါသည်',orderNo:'အော်ဒါနံပါတ်',again:'ထပ်မှာမည်',
          left:'ကျန်',outOfStock:'ကုန်သွားပြီ',
          sent:'အော်ဒါအချက်အလက်ကို LINE chat သို့ ပို့ပြီးပါပြီ',
          notSent:'အော်ဒါ သိမ်းပြီးပါပြီ။ ဆိုင်မှ လက်ခံရရှိပါပြီ။',
          loginNeed:'LINE login သို့ ပြန်ညွှန်းနေသည်...',
          /* ฝากซื้อเฟส 1 — รอล่าม (ไฟล์ 40 A1-6 ฉบับแก้ + ไฟล์ 41 · F-25 จากไฟล์ 40) ว่าง = ใช้อังกฤษแทน */
          brand:'', k1_1:'', k1_2:'', k1_3:'', k1_4:'', k1_5:'', k1_6:'', k1_7:'', k1_8:'', f25:''},
      en:{open:'Opening shop...',loadErr:'Failed to load products',empty:'No products yet',
          add:'Add',confirm:'Confirm order',items:'items',baht:'฿',sending:'Saving...',
          okTitle:'Order placed',orderNo:'Order No.',again:'Order more',
          left:'left',outOfStock:'Out of stock',
          sent:'Order summary sent to your LINE chat',
          notSent:'Order saved. The shop has received it.',
          loginNeed:'Redirecting to LINE login...',
          brand:'Jasmine · Buy for Me',
          k1_1:'Items will be delivered on the next payday visit',
          k1_2:'Delivery date: {date}',
          k1_3:'You can cancel until {date}',
          k1_4:'Up to {n} items per order',
          k1_5:'This service is not open for your site yet',
          k1_6:'Your account cannot use this service right now. Please call the team.',
          k1_7:'View my orders',
          k1_8:'No reply yet. Please check "My orders" before ordering again.',
          f25:'Your account is not linked yet. Please call the team.'}
    };

    var lang='my', products=[], cart={}, profile=null;
    var buy=null;          /* ฝากซื้อเฟส 1: {max_items, round, cancel_until} จากหลังบ้าน */
    var reqId=null;        /* เลขคำขอของตะกร้านี้ — ส่งซ้ำหลังเน็ตหลุด หลังบ้านคืนออเดอร์เดิม ไม่สร้างซ้ำ */
    function $(id){ return document.getElementById(id); }
    function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.my[k] || I18N.en[k] || k; }   /* ฝากซื้อเฟส 1: พม่ายังไม่มา → อังกฤษ */
    function tv(k,v){ var s=t(k); Object.keys(v||{}).forEach(function(n){ s=s.split('{'+n+'}').join(String(v[n])); }); return s; }
    function วันเลข(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m ? Number(m[3])+'/'+Number(m[2])+'/'+m[1] : String(s||''); }
    function dbg(m){ if(!DEBUG) return; var b=$('debug'); b.style.display='block'; b.textContent+=m+'\n'; }

    function showError(msg){
      $('loading').style.display='none';
      var box=$('errbox'); box.style.display='block'; box.textContent='⚠️ '+msg; dbg('ERROR: '+msg);
    }
    window.onerror = function(m){ showError('JS Error: ' + m); };

    function prodById(id){ for(var i=0;i<products.length;i++){ if(products[i].id===id) return products[i]; } return null; }

    // ชื่อ/รายละเอียด ตามภาษา (ไม่ดึงภาษาไทยมาโชว์)
    function pName(p){
      if(lang==='en') return p.name_en || p.name_my || p.name || p.id;
      return p.name_my || p.name_en || p.name || p.id;
    }
    function pDesc(p){
      if(lang==='en') return p.desc_en || p.desc_my || '';
      return p.desc_my || p.desc_en || '';
    }

    /* ══ D1-ความเร็ว · 2 ก.ย. 2026 ═══════════════════════════════════════════════
       ปัญหา: กดเมนู Ops อะไรก็ตาม จะเห็นจอร้านค้า + ข้อความพม่าแวบก่อนเสมอ
       สาเหตุ: LIFF app ตัวเดียวใช้ทุกหน้า · LINE โหลด "Endpoint URL" (= หน้านี้) ก่อนเสมอ
               แล้วส่ง liff.state มา จากนั้น liff.init() ถึงพาไปหน้าจริง — เป็นกลไกปกติของ LIFF ไม่ใช่บั๊ก
       วิธีแก้: หน้านี้ยอมเป็น "ทางผ่าน" — ไม่โชว์ร้าน ไม่โหลดโปรไฟล์ ไม่โหลดสินค้า แล้วปล่อยให้ SDK พาไป
       🔴 ห้ามเปลี่ยน URL เอง · ห้ามแตะ liff.state · ห้าม redirect ก่อน liff.init() เสร็จ (เอกสาร LINE)
       ตัวกันสำรอง: ถ้า 5 วินาทีแล้วยังอยู่หน้านี้ = SDK ไม่ได้พาไปไหน → เปิดร้านตามปกติ
                     (ถ้า SDK พาไปแล้ว หน้านี้จะถูกทิ้ง ตัวจับเวลาไม่มีวันทำงาน)
       ══════════════════════════════════════════════════════════════════════════ */
    var เป็นทางผ่าน_ = /[?&]liff\.state=/.test(location.search);
    var ร้านเปิดแล้ว_ = false;

    function ปลดโหมดทางผ่าน_(){
      document.documentElement.className =
        document.documentElement.className.replace(/\s*liff-pass/g, '');
    }

    /** ใส่โปรไฟล์ลงแถบบน แล้วโหลดสินค้า (ของเดิม แยกออกมาให้เรียกได้ 2 ทาง) */
    function ใส่โปรไฟล์แล้วโหลดสินค้า_(p){
      if(!p){ loadProducts(); return; }
      profile = { userId:p.userId, displayName:p.displayName, pictureUrl:p.pictureUrl };
      dbg('profile='+profile.displayName);
      $('uName').textContent = profile.displayName || '';
      if(profile.pictureUrl) $('uPic').src = profile.pictureUrl;
      $('userbar').style.display='flex';
      loadProducts();
    }

    /** เปิดร้านตามปกติ — เรียกได้ทั้งจากทางปกติ และจากตัวกันสำรอง 5 วิ
     *  เขียนให้ทนทาง: ถ้า liff.init() ยังไม่เสร็จตอนตัวกันสำรองทำงาน ก็ยังเปิดร้านได้ (แค่ไม่มีชื่อบนแถบ) */
    function เปิดร้านตามปกติ_(){
      if(ร้านเปิดแล้ว_) return; ร้านเปิดแล้ว_ = true;
      ปลดโหมดทางผ่าน_();
      $('loadingText').textContent = t('open');
      try {
        if(!liff.isLoggedIn() && !liff.isInClient()){
          $('loadingText').textContent = t('loginNeed'); liff.login(); return;
        }
        liff.getProfile()
          .then(ใส่โปรไฟล์แล้วโหลดสินค้า_)
          .catch(function(){ loadProducts(); });      // โปรไฟล์ล้ม ก็ยังต้องเปิดร้านได้
      } catch(e){ loadProducts(); }                    // init ยังไม่เสร็จ → ข้ามโปรไฟล์ เปิดร้านเลย
    }

    function start(){
      if(!เป็นทางผ่าน_) $('loadingText').textContent = t('open');
      if(typeof liff === 'undefined'){ ปลดโหมดทางผ่าน_(); showError('LIFF SDK load failed'); return; }
      if(เป็นทางผ่าน_) setTimeout(เปิดร้านตามปกติ_, 5000);   // ตัวกันสำรอง
      liff.init({ liffId: LIFF_ID })
        .then(function(){
          dbg('liff.init OK isInClient='+liff.isInClient()+' isLoggedIn='+liff.isLoggedIn()+' ทางผ่าน='+เป็นทางผ่าน_);
          if(เป็นทางผ่าน_) return null;                 // 🔴 SDK กำลังพาไปหน้าจริง — จบแค่นี้ ห้ามทำอะไรต่อ
          เปิดร้านตามปกติ_();
          return null;
        })
        .catch(function(err){
          ปลดโหมดทางผ่าน_();
          showError('LIFF init failed: '+(err && err.message ? err.message : err));
        });
    }

    /* 🔴 ก8 (มติผู้วางแผนรอบ 49 · 24 ก.ย. 2026) — เปิดหน้าครั้งแรกเคยขึ้น "Unexpected token '<'" เพราะ Google ตอบหน้า HTML แทน JSON
       ของใหม่: คำสั่งอ่าน (โหลดสินค้า) ลองใหม่อัตโนมัติ 1 ครั้ง เฉพาะตอนยิงไม่ออกหรือคำตอบไม่ใช่ JSON
       · คำตอบ JSON ที่บอกว่าไม่สำเร็จ = คำตอบจริง ไม่ลองซ้ำ · คำสั่งสั่งซื้อไม่ลองซ้ำเอง (น้องกดใหม่ = ใช้เลขคำขอเดิม) */
    function loadProducts(){ อ่านสินค้า_(1); }
    function อ่านสินค้า_(ครั้ง){
      fetch(API_URL + '?action=products')
        .then(function(r){ return r.text(); })
        .then(function(txt){ try { return JSON.parse(txt); } catch(e){ return { __ไม่ใช่JSON: true }; } },
              function(){ return { __ยิงไม่ออก: true }; })
        .then(function(res){
          if(res.__ไม่ใช่JSON || res.__ยิงไม่ออก){
            if(ครั้ง < 2){ dbg('products retry'); setTimeout(function(){ อ่านสินค้า_(ครั้ง + 1); }, 1200); return; }
            showError(t('loadErr')); return;
          }
          if(!res || !res.ok){ showError(t('loadErr')+' : '+(res && res.error)); return; }
          products = res.products || [];
          buy = res.buy || null;
          $('loading').style.display='none';
          renderBuyInfo();
          renderGrid();
        })
        .catch(function(err){ showError(t('loadErr')+' : '+err); });   /* พังตอนวาดหน้า (ไม่ใช่เรื่องเน็ต) = ไม่ลองซ้ำ บอกตรง ๆ แบบเดิม */
    }

    /* ฝากซื้อเฟส 1 — แถบบอกวันส่งของ/ยกเลิกได้ถึง/เพดานชิ้น (ค่าจริงคิดที่หลังบ้าน) */
    function renderBuyInfo(){
      var box=$('buyinfo');
      if(!buy){ box.style.display='none'; return; }
      $('biWhen').textContent = t('k1_1');
      $('biDate').textContent = tv('k1_2',{date:วันเลข(buy.round)});
      $('biCancel').textContent = tv('k1_3',{date:วันเลข(buy.cancel_until)});
      var lim=$('biLimit'); lim.textContent = tv('k1_4',{n:buy.max_items});
      lim.className = 'lim' + (cartSummary().count>=buy.max_items ? ' hit' : '');
      $('brandName').textContent = t('brand');
      box.style.display='block';
    }

    function renderGrid(){
      var grid=$('grid'); grid.innerHTML='';
      if(products.length===0){ grid.innerHTML='<div class="state">'+t('empty')+'</div>'; return; }
      products.forEach(function(p){
        var card=document.createElement('div'); card.className='card';
        var img=p.image_url || 'https://placehold.co/600x600?text=No+Image';
        var desc=pDesc(p);
        var stockHtml='';
        if(p.stock!==null && p.stock!==undefined){
          if(p.stock<=0) stockHtml='<div class="stockline out">'+t('outOfStock')+'</div>';
          else stockHtml='<div class="stockline">'+t('left')+' '+p.stock+'</div>';
        }
        card.innerHTML=
          '<img class="thumb" src="'+escAttr(img)+'" alt="" '+
            'onerror="this.src=\'https://placehold.co/600x600?text=No+Image\'">'+
          '<div class="body">'+
            '<div class="pname">'+escHtml(pName(p))+'</div>'+
            (desc?'<div class="pdesc">'+escHtml(desc)+'</div>':'')+
            stockHtml+
            '<div class="price">'+p.price+' <span>'+t('baht')+'</span></div>'+
            '<div class="stepper" data-id="'+escAttr(p.id)+'"></div>'+
          '</div>';
        grid.appendChild(card);
        renderStepper(card.querySelector('.stepper'), p);
      });
    }

    function renderStepper(el, p){
      var id=p.id, qty=cart[id]||0;
      var out = (p.stock!==null && p.stock!==undefined && p.stock<=0);
      if(out){
        el.innerHTML='<button class="add" disabled>'+t('outOfStock')+'</button>';
        return;
      }
      if(qty<=0){
        el.innerHTML='<button class="add">'+t('add')+'</button>';
        el.querySelector('.add').onclick=function(){ setQty(id,1); };
      } else {
        el.innerHTML='<div class="qtygroup"><button class="minus">−</button>'+
          '<span class="qty">'+qty+'</span><button class="plus">+</button></div>';
        el.querySelector('.minus').onclick=function(){ setQty(id,qty-1); };
        el.querySelector('.plus').onclick =function(){ setQty(id,qty+1); };
      }
    }

    function setQty(id,q){
      var p=prodById(id);
      var max=(p && p.stock!==null && p.stock!==undefined)?p.stock:Infinity;
      if(buy && buy.max_items){                                    /* ฝากซื้อเฟส 1: เพดานชิ้นรวมทั้งตะกร้า */
        var อื่น=cartSummary().count-(cart[id]||0);
        max=Math.min(max, Math.max(0, buy.max_items-อื่น));
      }
      q=Math.max(0,Math.min(q,max));
      if(q===0) delete cart[id]; else cart[id]=q;
      reqId=null;                                                  /* ตะกร้าเปลี่ยน = คำขอใหม่ */
      var el=document.querySelector('.stepper[data-id="'+cssEsc(id)+'"]');
      if(el && p) renderStepper(el,p);
      updateCartBar();
      renderBuyInfo();
    }

    function cartSummary(){
      var count=0,total=0;
      products.forEach(function(p){ var q=cart[p.id]||0; if(q>0){ count+=q; total+=p.price*q; } });
      return { count:count, total:total };
    }
    function updateCartBar(){
      var s=cartSummary(), bar=$('cartbar');
      if(s.count>0){
        bar.classList.add('show');
        $('cartCount').textContent=s.count+' '+t('items')+'  ';
        $('cartTotal').textContent=s.total+' '+t('baht');
        $('confirmBtn').textContent=t('confirm');
      } else { bar.classList.remove('show'); }
    }

    function confirmOrder(){
      var items=[];
      Object.keys(cart).forEach(function(id){ items.push({ id:id, qty:cart[id] }); });
      if(items.length===0) return;
      if(!profile){ showError('No LINE profile'); return; }
      var btn=$('confirmBtn'); btn.disabled=true; btn.textContent=t('sending');
      /* 🔴 ด่านตรวจตัวตน — เพิ่ม 20 ก.ย. 2026 ห้ามถอดออก
         ของเดิมส่งรหัสไลน์ของตัวเองไปให้หลังบ้านเชื่อตรง ๆ ⇒ ใครรู้ที่อยู่ /exec ก็สั่งซื้อแทนคนอื่นได้
         ของใหม่ส่ง "ตั๋ว" ที่ LINE ออกให้ หลังบ้านเอาไปถาม LINE ว่าเป็นของใคร แล้วเชื่อคำตอบนั้นเท่านั้น */
      var tk = null;
      try { tk = liff.getIDToken(); } catch(e) {}
      if(!tk){ showError('Please open the shop from the LINE menu'); btn.disabled=false; btn.textContent=t('confirm'); return; }
      /* ฝากซื้อเฟส 1: เลขคำขอ + เพดานรอ 20 วินาที · ไม่ยิงซ้ำเอง
         เน็ตหลุดแล้วน้องกดใหม่ = เลขคำขอเดิม ⇒ หลังบ้านคืนออเดอร์เดิม ไม่ได้ของ 2 เท่า */
      if(!reqId){ reqId = 'w-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10); }
      var ตัด = window.AbortController ? new AbortController() : null;
      var นาฬิกา = ตัด ? setTimeout(function(){ ตัด.abort(); }, 20000) : null;
      $('errbox').style.display='none';
      fetch(API_URL, { method:'POST', body: JSON.stringify({ idToken:tk, profile:profile, items:items, action:'place_order', req_id:reqId }),
                       signal: ตัด ? ตัด.signal : undefined })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(นาฬิกา) clearTimeout(นาฬิกา);
          btn.disabled=false; btn.textContent=t('confirm');
          if(!res || !res.ok){ showOrderError(res); return; }
          /* รอบ 50 (ทดสอบผ่าน /exec 24 ก.ย.): บางครั้ง Google ส่งคำตอบของ doGet (รายการสินค้า ok:true) กลับมาแทนผลการสั่ง
             ⇒ ไม่มีเลขออร์เดอร์ = ยังไม่ทราบผล · ห้ามขึ้นจอสำเร็จ ห้ามล้างตะกร้า · เก็บเลขคำขอเดิม (กดใหม่ = ได้ออร์เดอร์เดิม ไม่ซ้ำ) */
          if(typeof res.orderId !== 'string' || !res.orderId || !Array.isArray(res.items)){ showError(t('k1_8')); return; }
          onOrderSuccess(res);
        })
        .catch(function(err){
          if(นาฬิกา) clearTimeout(นาฬิกา);
          btn.disabled=false; btn.textContent=t('confirm');
          showError(t('k1_8'));                                    /* ไม่รู้ผล — ให้ดูรายการก่อน กดซ้ำได้อย่างปลอดภัย */
        });
    }

    /* ฝากซื้อเฟส 1 — แปลรหัสจากหลังบ้านเป็นข้อความที่น้องอ่านได้ */
    function showOrderError(res){
      var e = String((res && res.error) || '');
      if(e==='NOT_REGISTERED') return showError(t('f25'));
      if(e==='NOT_ALLOWED' || e==='DUPLICATE_LINK') return showError(t('k1_6'));
      if(e==='SITE_NOT_OPEN') return showError(t('k1_5'));
      if(e==='TOO_MANY_ITEMS') return showError(tv('k1_4',{n:(res.max_items || (buy && buy.max_items) || 5)}));
      if(e.indexOf('NOT_ENOUGH_STOCK')===0 || e.indexOf('PRODUCT_ON_HOLD')===0){ showError(t('outOfStock')); loadProducts(); return; }   /* รอบ 50: สินค้าที่พักตรวจยอด = ชั่วคราวสั่งไม่ได้ */
      if(e==='SERVICE_NOT_OPEN') return showError(t('k1_5'));                     /* รอบ 50: ยังไม่เปิดบริการ (รอฝั่งเงินเดือนพร้อม) */
      if(e==='SERVICE_PAUSED') return showError(t('k1_5'));                       /* รุ่น 18: เจ้าของสั่งพักคำสั่งเขียน — ใช้ข้อความที่แปลแล้ว ไม่แต่งคำใหม่ · ตะกร้า+เลขคำขอเดิมยังอยู่ */
      if(e==='ORDER_NOT_SETTLED' || e==='ORDER_ON_HOLD') return showError(t('k1_8'));   /* รอบ 50: บันทึกแล้วแต่ยังไม่เสร็จ = ยังไม่ทราบผล · เลขคำขอเดิมยังเก็บไว้ */
      if(e==='NO_TICKET' || e==='BAD_TICKET') return showError('Please open the shop from the LINE menu');
      showError('Cannot save order: '+e);
    }

    function onOrderSuccess(res){
      cart={}; updateCartBar();
      $('grid').style.display='none';
      $('cartbar').classList.remove('show');
      $('okTitle').textContent=t('okTitle');
      $('okId').textContent=t('orderNo')+' : '+res.orderId;
      reqId=null;                                                  /* สั่งสำเร็จ = ตะกร้าใหม่ใช้เลขใหม่ */
      $('okDates').textContent = res.round ? (tv('k1_2',{date:วันเลข(res.round)}) + '\n' + tv('k1_3',{date:วันเลข(res.cancel_until)})) : '';
      $('okDates').style.whiteSpace='pre-line';
      $('mineBtn').textContent=t('k1_7');
      var ul=$('okItems'); ul.innerHTML='';
      var lines=['🌼 Jasmine', t('orderNo')+' '+res.orderId];
      res.items.forEach(function(it){
        /* รุ่น 18 (มติรอบ 50 ★3): ชื่อตามภาษาที่น้องเลือก · ไม่มีคำแปลหรือหาสินค้าไม่เจอ = ชื่อจากคำตอบของออร์เดอร์/รหัสสินค้า
           จำนวน ราคา ยอด = ค่าของออร์เดอร์ที่หลังบ้านยืนยัน (ไม่คิดใหม่จากรายการสินค้าตอนนี้) */
        var p=prodById(it.id), แปล=p ? (lang==='en' ? (p.name_en||p.name_my) : (p.name_my||p.name_en)) : '';
        var nm=แปล || it.name || it.id;
        var li=document.createElement('li');
        li.innerHTML='<span>'+escHtml(nm)+' x'+it.qty+'</span><span>'+it.subtotal+' '+t('baht')+'</span>';
        ul.appendChild(li);
        lines.push('• '+nm+' x'+it.qty+' = '+it.subtotal+t('baht'));
      });
      var liT=document.createElement('li');
      liT.innerHTML='<b>'+t('items')+'</b><b>'+res.total+' '+t('baht')+'</b>';
      ul.appendChild(liT);
      lines.push('Total '+res.total+t('baht'));
      $('againBtn').textContent=t('again');
      $('success').style.display='block';
      window.scrollTo(0,0);
      var noteEl=$('okNote');
      if(typeof liff!=='undefined' && liff.isInClient()){
        liff.sendMessages([{ type:'text', text: lines.join('\n') }])
          .then(function(){ noteEl.textContent='✓ '+t('sent'); })
          .catch(function(e){ noteEl.textContent=t('notSent'); dbg('sendMessages fail: '+e); });
      } else { noteEl.textContent=t('notSent'); }
    }

    function bindUI(){
      var btns=document.querySelectorAll('.lang button');
      btns.forEach(function(b){
        b.onclick=function(){
          lang=b.getAttribute('data-lang');
          btns.forEach(function(x){ x.classList.remove('on'); });
          b.classList.add('on');
          renderGrid(); updateCartBar(); renderBuyInfo();
          $('againBtn').textContent=t('again'); $('mineBtn').textContent=t('k1_7');
        };
      });
      $('confirmBtn').onclick=confirmOrder;
      $('againBtn').onclick=function(){
        $('success').style.display='none';
        $('grid').style.display='grid';
        $('okNote').textContent='';
        window.scrollTo(0,0);
      };
      $('mineBtn').onclick=function(){ location.href='buy-my.html'; };   /* ฝากซื้อเฟส 1: รายการฝากซื้อของฉัน */
      $('againBtn').textContent=t('again');
    }

    function escHtml(s){ return String(s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function escAttr(s){ return escHtml(s); }
    function cssEsc(s){ return String(s).replace(/"/g,'\\"'); }

    bindUI();
    start();
  })();
  </script>
</body>
</html>
