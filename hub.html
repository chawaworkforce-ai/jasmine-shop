<title>CHAWA GROUP — ศูนย์บัญชาการธุรกิจ</title>
<style>
 :root{--bg1:#0a0e1a;--glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.06);--bd:rgba(255,255,255,.08);--tx:#e7edf6;--tx2:#8a97ab;--tx3:#5c6a80}
 *{margin:0;padding:0;box-sizing:border-box}
 body{font-family:"Segoe UI",system-ui,-apple-system,"Sarabun",sans-serif;background:var(--bg1);color:var(--tx);-webkit-font-smoothing:antialiased}
 a{text-decoration:none}
 .layout{display:flex;min-height:100vh}
 .side{width:228px;flex-shrink:0;background:linear-gradient(180deg,#0b1020,#0a0e1a);border-right:1px solid var(--bd);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
 .logo{display:flex;align-items:center;gap:11px;padding:4px 6px 20px;font-weight:800;font-size:17px}
 .logo .dot{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:grid;place-items:center;box-shadow:0 0 18px rgba(124,58,237,.5);font-size:16px}
 .nav{display:flex;flex-direction:column;gap:3px}
 .nav .lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;padding:14px 8px 5px}
 .nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:var(--tx2);font-size:13.5px;cursor:pointer;transition:.15s}
 .nav a:hover{background:var(--glass);color:var(--tx)}
 .nav a.active{background:linear-gradient(90deg,rgba(124,58,237,.20),rgba(37,99,235,.05));color:#fff;box-shadow:inset 2px 0 0 #7c3aed}
 .main{flex:1;min-width:0;background:radial-gradient(1100px 380px at 72% -8%,rgba(37,99,235,.10),transparent),radial-gradient(800px 460px at 105% 108%,rgba(20,184,166,.07),transparent)}
 .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 26px;border-bottom:1px solid var(--bd);position:sticky;top:0;backdrop-filter:blur(12px);background:rgba(10,14,26,.72);z-index:5}
 .top h1{font-size:19px}.top .sub{font-size:12px;color:var(--tx2);margin-top:1px}
 .search{flex:1;max-width:280px;background:var(--glass);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;color:var(--tx2);font-size:12.5px}
 .prof{display:flex;align-items:center;gap:9px;font-size:12.5px}
 .prof .av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#ec4899,#7c3aed);display:grid;place-items:center;font-weight:700}
 .content{padding:22px 26px 60px}
 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px}
 .stat{background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center}
 .stat .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex-shrink:0}
 .stat .num{font-size:27px;font-weight:800;line-height:1}
 .stat .cap{font-size:12px;color:var(--tx2);margin-top:5px}
 .sec{margin-bottom:30px}
 .sec h2{font-size:15px;margin-bottom:15px;display:flex;align-items:center;gap:11px}
 .sec h2 .bar{width:4px;height:19px;border-radius:3px}
 .sec h2 .cnt{font-size:12px;color:var(--tx2);font-weight:400}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:14px}
 .card{background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.18s}
 .card:hover{transform:translateY(-3px);border-color:rgba(124,58,237,.5);box-shadow:0 14px 32px rgba(0,0,0,.45)}
 .card .hd{display:flex;gap:12px;align-items:flex-start}
 .card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
 .card .tp{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
 .card h3{font-size:14.5px;margin-top:2px;line-height:1.25}
 .card p{font-size:12px;color:var(--tx2);flex:1;line-height:1.5}
 .src{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx3);line-height:1.35}
 .src svg{width:13px;height:13px;stroke:var(--tx3);fill:none;stroke-width:1.7;flex-shrink:0}
 .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
 .pill{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
 .p-live{background:rgba(16,185,129,.15);color:#34d399;box-shadow:0 0 12px rgba(16,185,129,.22)}
 .p-wait{background:rgba(245,158,11,.15);color:#fbbf24}
 .p-prog{background:rgba(59,130,246,.16);color:#60a5fa}
 .p-soon{background:rgba(148,163,184,.14);color:#94a3b8}
 .open{display:block;text-align:center;background:var(--glass2);border:1px solid var(--bd);color:var(--tx);font-size:12.5px;font-weight:600;padding:9px;border-radius:10px;transition:.15s}
 .open:hover{background:linear-gradient(90deg,#7c3aed,#2563eb);border-color:transparent;box-shadow:0 0 16px rgba(124,58,237,.45)}
 .open.dim{opacity:.4;pointer-events:none}
 .g-chawa{background:linear-gradient(135deg,#ef4444,#f59e0b);box-shadow:0 0 16px rgba(239,68,68,.28)}
 .g-jasmine{background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 0 16px rgba(139,92,246,.28)}
 .g-wealth{background:linear-gradient(135deg,#14b8a6,#22c55e);box-shadow:0 0 16px rgba(20,184,166,.28)}
 .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .stat .ic svg{width:23px;height:23px}
 .logo .dot svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
 .nav a [data-ic],.search [data-ic]{display:inline-flex;align-items:center}
 .search{display:flex;align-items:center;gap:7px}
 .search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 @media(max-width:720px){.side{display:none}.content{padding:18px 14px 50px}.top{padding:14px 16px}.search{display:none}}
</style>
</head>

const PILL={"ใช้งาน":"p-live","รอจับคู่ไลน์":"p-wait","กำลังต่อ":"p-prog","กำลังทำ":"p-prog","coming soon":"p-soon"};
const BIZ={chawa:["CHAWA — เอกสาร · การเงิน · เคส","#ef4444"],jasmine:["JASMINE — ระบบ LINE บอท","#8b5cf6"],wealth:["WEALTHLAND — อสังหา (จัดทีหลัง)","#14b8a6"]};
const secEl=document.getElementById('sections'),statEl=document.getElementById('stats');
function stats(){
  const t=SYS.length,live=SYS.filter(s=>s.st==="ใช้งาน").length,
   prog=SYS.filter(s=>s.st==="กำลังต่อ"||s.st==="กำลังทำ").length,
   other=SYS.filter(s=>s.st==="รอจับคู่ไลน์"||s.st==="coming soon").length;
  const S=[["layers","g-jasmine",t,"ระบบทั้งหมด"],["check","g-wealth",live,"ใช้งานได้"],["wrench","g-jasmine",prog,"กำลังทำ/ต่อ"],["clock","g-chawa",other,"รอ/เร็วๆนี้"]];
  statEl.innerHTML=S.map(([i,g,n,c])=>`<div class="stat"><div class="ic ${g}">${svg(i)}</div><div><div class="num">${n}</div><div class="cap">${c}</div></div></div>`).join('');
}
function render(filter){
  secEl.innerHTML='';
  Object.keys(BIZ).forEach(key=>{
    if(filter!=='all'&&filter!==key)return;
    const items=SYS.filter(s=>s.biz===key);if(!items.length)return;
    const [title,color]=BIZ[key];
    const cards=items.map(s=>{
      const pill=PILL[s.st]||'p-soon';
      const btn=s.link?`<a class="open" href="${s.link}" target="_blank" rel="noopener">เปิด →</a>`:`<span class="open dim">ยังไม่พร้อม</span>`;
      return `<div class="card"><div class="hd"><div class="ic g-${key}">${svg(s.ic)}</div><div><div class="tp">${s.tp}</div><h3>${s.name}</h3></div></div>
        <p>${s.desc}</p>${s.src?`<div class="src">${svg('database')} ฐานข้อมูล: ${s.src}</div>`:''}<div class="row"><span class="pill ${pill}">${s.st}</span></div>${btn}</div>`;
    }).join('');
    secEl.insertAdjacentHTML('beforeend',
      `<div class="sec"><h2><span class="bar" style="background:${color}"></span>${title} <span class="cnt">· ${items.length} รายการ</span></h2><div class="grid">${cards}</div></div>`);
  });
}
document.getElementById('nav').addEventListener('click',e=>{
  const a=e.target.closest('a[data-f]');if(!a)return;
  document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');render(a.dataset.f);
});
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=svg(e.dataset.ic));stats();render('all');
</script>
