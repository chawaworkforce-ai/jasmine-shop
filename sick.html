<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>နေမကောင်း / ဆေးခန်း</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --blue:#2a7d9b; --blue-d:#1f5f76; --ink:#1f2b25; --muted:#7b8a82; --line:#e7ece9; --bg:#f4f6f5; --red:#a3322b; --green:#256544; --amber:#8a5a00; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Padauk","Sarabun",sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--blue); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  header h1{ font-size:17px; margin:0; font-weight:700; }
  .langbar{ display:flex; gap:8px; padding:10px 14px 0; max-width:560px; margin:0 auto; }
  .langbar button{ flex:1; padding:9px 0; border:1px solid var(--line); background:#fff; border-radius:10px; font-size:14px; color:var(--muted); font-weight:600; }
  .langbar button[aria-pressed="true"]{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .wrap{ padding:14px 14px 40px; max-width:560px; margin:0 auto; }
  .big{ width:100%; padding:30px 18px; border:0; border-radius:18px; color:#fff; font-size:22px; font-weight:800;
        line-height:1.5; margin-bottom:16px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .big small{ display:block; font-size:15px; font-weight:600; opacity:.92; margin-top:6px; }
  .b-sick{ background:var(--blue); }
  .b-ride{ background:var(--green); }
  .big:disabled{ opacity:.5; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 18px; text-align:center; }
  .card h2{ font-size:19px; margin:6px 0 10px; }
  .card p{ font-size:15px; color:#444; line-height:1.7; margin:6px 0; }
  .ref{ font-family:ui-monospace,Menlo,monospace; font-size:17px; font-weight:700; background:#f0f4f2; border-radius:10px; padding:8px 12px; display:inline-block; margin:8px 0; }
  .tel{ display:block; margin-top:16px; padding:16px; border-radius:14px; background:var(--red); color:#fff; font-size:19px; font-weight:800; text-decoration:none; }
  .ghost{ display:block; width:100%; margin-top:12px; padding:14px; border:1px solid var(--line); background:#fff; border-radius:12px; font-size:15px; font-weight:600; color:var(--muted); }
  .warn{ background:#fff8e6; border-color:#f0dfae; }
  .hint{ font-size:13px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.6; }
  .emoji{ font-size:52px; line-height:1; }
</style>
</head>
<body>
<header><span class="emoji" style="font-size:22px">🤒</span><h1 id="ห_หัว">နေမကောင်း / ဆေးခန်း</h1></header>
<div class="langbar">
  <button id="ป_mm" aria-pressed="true">&#4121;&#4156;&#4116;&#4154;&#4121;&#4140;</button>
  <button id="ป_en" aria-pressed="false">English</button>
</div>
<div class="wrap" id="จอ"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   หน้า "แจ้งป่วย / ขอรถไปหาหมอ" — ชุดที่ 3 รุ่น 1 (8 ก.ย. 2026)
   สเปก: คู่มือระบบกลาง ฉบับ 2 ส่วนที่ 3.3

   🔒 หน้านี้ "ไม่มีช่องพิมพ์" โดยตั้งใจ และด่านฝั่งเซิร์ฟเวอร์ก็ไม่รับช่องข้อความ
      ⇒ ถึงมีคนแก้ไฟล์นี้ให้ส่งอาการไปด้วย เซิร์ฟเวอร์จะทิ้งก่อนถึงโค้ดงาน
      🔴 ห้ามเพิ่มช่องพิมพ์ในหน้านี้เด็ดขาด นี่เป็นนโยบายที่เจ้าของกับทีมตรวจเคาะแล้ว

   🔴 ห้ามลองส่งใหม่อัตโนมัติ — เบอร์สำรองคือทางออกแทนการลองใหม่
   ══════════════════════════════════════════════════════════════════ */

  /* 🔴 2 บรรทัดข้างล่างนี้ ต้องก๊อปมาจากหน้าเว็บที่ใช้อยู่จริง — ห้ามพิมพ์เอง
     LIFF_ID  : ระบบนี้ใช้ LIFF app เดียว (Endpoint เป็นรากเว็บ) ก๊อปค่าเดียวกับ myscore.html
     API_URL  : ก๊อปจากหน้าใดก็ได้ ทุกหน้าใช้บานเดียวกัน */
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";

  /* เบอร์สำรอง: เจ้าของยืนยันว่าเป็นเบอร์บริษัท จึงฝังในหน้าเว็บได้
     เซิร์ฟเวอร์จะส่งเบอร์กลับมาทุกคำตอบ ถ้าส่งมาเราใช้ของเซิร์ฟเวอร์
     ตัวที่ฝังไว้นี้คือ "ตาข่ายกันตก" เผื่อเซิร์ฟเวอร์ไม่ตอบเลย */
  var เบอร์สำรอง = "0849842516";

  /* 🔴 20 ก.ย. 2026 (เจ้าของสั่ง): เปิดหน้ามาเป็นพม่าก่อนเสมอ
     น้องอ่านอังกฤษได้ราว 10% เท่านั้น · กดปุ่ม English เปลี่ยนได้ และระบบจะจำค่าที่กดไว้ */
  var ภาษา = 'mm';
  var โปรไฟล์ = null;
  var ตั๋วล่าสุด = null;
  var กำลังส่ง = false;
  /* 🔴 รุ่น 1.2 (ผลตรวจทีม 8 ก.ย. ข้อ 2): ห้ามเปิดปุ่มส่งก่อนระบบตัวตนพร้อม
     รุ่น 1.1 วาดปุ่มก่อน await liff.init() ⇒ ทีมกดทันได้จริง แล้วคำขอออกไปโดยไม่มีตั๋วและ userId ว่าง */
  var พร้อมส่ง = false;
  /* 🔴 (ข้อ 1): เลขรอบของคำขอ — คำตอบที่ไม่ใช่ของรอบปัจจุบัน ต้องถูกทิ้ง
     ไม่งั้นคำตอบของคำขอเก่าจะมาทับจอของคำขอใหม่ (ทีมทำซ้ำได้: ป่วย FAIL แล้วจอเด้งเขียวทับ) */
  var รอบส่ง = 0;

  var ข้อความ = {
    en: {
      head:   'Sick / Clinic',
      sick:   'I am sick today',
      sickS:  'Tell the team I cannot work',
      ride:   'I need a ride to the clinic',
      rideS:  'Ask the team to take me',
      askT:   'Send this now?',
      askS:   'The team will be told right away.',
      yes:    'Yes, send',
      no:     'Cancel',
      sending:'Sending…',
      okT:    'Saved and sent to the team',
      okS:    'Show this number if they ask.',
      failT:  'Saved, but the team was NOT told',
      failS:  'Please call this number now.',
      unkT:   'Not sure if it went through',
      unkS:   'Please call this number to be sure.',
      call:   'Call the team',
      again:  'Send again',
      back:   'Back',
      dupT:   'You already told us',
      dupS:   'minutes ago',
      dupQ:   'Send again only if you still need help.',
      errT:   'Something went wrong',
      errS:   'Please call this number.',
      notyou: 'Your account is not linked yet. Please call the team.',
      out:    'Your account is closed. Please call the team.',
      needline: 'Please open this page from the LINE menu, not from a web link.',
      onlyworker: 'This page is for workers only. Admin accounts cannot send from here.',
      waiting: 'Connecting to LINE… the buttons will turn on in a moment.'
    },
    mm: {
      head:   'နေမကောင်း / ဆေးခန်း',
      sick:   'တွေရက် နေမကောင်းပါ',
      sickS:  'အလုပ်မလုပ်နိုင်ကြောင်း အစီအစဉ်ကို အကြောင်းကြားပါ',
      ride:   'ဆေးခန်းသွားရန် ကားလိုပါသည်',
      rideS:  'အစီအစဉ်ကို ကားတောင်းပါ',
      askT:   'အခု ပို့မလား။',
      askS:   'အစီအစဉ်ထံ ချက်ချင်းရောက်ပါမည်။',
      yes:    'ဟုတ်ကဲ့ ပို့ပါ',
      no:     'မပို့တော့ပါ',
      sending:'ပို့နေပါသည်…',
      okT:    'မျတ်တမ်းပြီး အစီအစဉ်ထံ ပို့ပြီးပါပြီ',
      okS:    'မေးရင် ဤနံပါတ်ကို ပြပါ',
      failT:  'မျတ်တမ်းပြီး ဒါပေမယ့် အစီအစဉ်ထံ မရောက်ပါ',
      failS:  '\u1024\u1016\u102F\u1014\u103A\u1038\u1014\u1036\u1015\u102B\u1010\u103A\u1000\u102D\u102F \u1001\u103B\u1000\u103A\u1001\u103B\u1004\u103A\u1038 \u1006\u1000\u103A\u101E\u103D\u101A\u103A\u1015\u102B',
      unkT:   'ရောက်မရောက် မသေချာပါ',
      unkS:   'စိတ်ချရန် ဤဖုန်းနံပါတ်ကို ခေါ်ပါ',
      call:   'အစီအစဉ်ကို ဖုန်းခေါ်ပါ',
      again:  'ထပ်ပို့ပါ',
      back:   'နောက်သို့',
      dupT:   'ခုနက အကြောင်းပို့ပြီးပါပြီ',
      dupS:   'မိနစ်က ပို့ထားသည်',
      dupQ:   'လိုအပ်သေးလျှင်သာ ထပ်ပို့ပါ',
      errT:   'တစ်ခုခု မမှန်ပါ',
      errS:   'ဤဖုန်းနံပါတ်ကို ခေါ်ပါ',
      notyou: 'သင့်အကောင့် မချိတ်ရသေးပါ။ အစီအစဉ်ကို ဖုန်းဆက်ပါ',
      out:    'သင့်အကောင့် ပိတ်ထားပါသည်။ အစီအစဉ်ကို ဖုန်းဆက်ပါ',
      needline: '\u1024\u1005\u102C\u1019\u103B\u1000\u103A\u1014\u103E\u102C\u1000\u102D\u102F LINE \u1019\u102E\u1014\u1030\u1038\u1019\u103E \u1016\u103D\u1004\u1037\u103A\u1015\u102B',
      onlyworker: '\u1024\u1005\u102C\u1019\u103B\u1000\u103A\u1014\u103E\u102C\u101E\u100A\u103A \u1021\u101C\u102F\u1015\u103A\u101E\u1019\u102C\u1038\u1019\u103B\u102C\u1038\u1021\u1010\u103D\u1000\u103A\u101E\u102C \u1016\u103C\u1005\u103A\u1015\u102B\u101E\u100A\u103A',
      waiting: 'LINE \u1014\u103E\u1004\u1037\u103A \u1001\u103B\u102D\u1010\u103A\u1006\u1000\u103A\u1014\u1031\u1015\u102B\u101E\u100A\u103A\u2026'
    }
  };
  /* 🟡 ข้อความพม่าข้างบนเป็น "ร่าง" — ต้องให้เจ้าของหรือพี่มายตรวจก่อนใช้จริง
     ใช้กติกาเดียวกับหน้ากฎบริษัทและระบบกู้ยืมที่เขียนไว้ว่าภาษาพม่าเป็นอนุมัติร่าง */

  function esc(s){
    return String(s == null ? '' : s).replace(/[<>&"]/g, function(c){
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c];
    });
  }
  function t_(){ return ข้อความ[ภาษา]; }
  function จอ_(html){ document.getElementById('จอ').innerHTML = html; }
  function เบอร์(){ return String(เบอร์สำรอง || '').replace(/[^0-9+]/g, ''); }
  function ปุ่มโทร_(){
    var b = เบอร์();
    if (!b) return '';
    return '<a class="tel" href="tel:' + esc(b) + '">📞 ' + esc(t_().call) + '<br>' + esc(b) + '</a>';
  }

  /* ── ความจำในเครื่อง: ใช้เตือน "เพิ่งแจ้งไป" เท่านั้น ─────────────
     🔴 ไม่ใช่ตัวตัดสินธง "ซ้ำ" — ตัวตัดสินจริงคือแถวในชีตฝั่งเซิร์ฟเวอร์
     เพราะแคชในเครื่องหายได้ ชีตไม่หาย (สเปก 3.3) */
  /* 🔴 (Q5): กุญแจต้องผูกกับบัญชีผู้ใช้ ไม่งั้นเปลี่ยนบัญชีในเครื่องเดิม
     จะเห็นเลขเรื่องของคนก่อนหน้า (ทีมทำซ้ำได้) */
  function กุญแจจำ_(type){
    var uid = (โปรไฟล์ && โปรไฟล์.userId) ? String(โปรไฟล์.userId) : 'ยังไม่รู้';
    return 'jm_sick_' + uid + '_' + type;
  }
  function จำการส่ง_(type, ref){
    try { localStorage.setItem(กุญแจจำ_(type), JSON.stringify({ t: Date.now(), ref: ref })); } catch(e){}
  }
  function เพิ่งส่งไป_(type){
    try {
      var v = JSON.parse(localStorage.getItem(กุญแจจำ_(type)) || 'null');
      if (!v || !v.t) return null;
      var นาที = Math.floor((Date.now() - v.t) / 60000);
      return (นาที >= 0 && นาที < 10) ? { นาที: นาที, ref: v.ref } : null;
    } catch(e){ return null; }
  }

  function ตั๋วสด_(){
    try { return liff.getIDToken() || null; } catch(e){ return null; }
  }
  function ล็อกปุ่มภาษา_(ล็อก){
    ['ป_en','ป_mm'].forEach(function(id){
      var b = document.getElementById(id);
      if (b) { b.disabled = !!ล็อก; b.style.opacity = ล็อก ? '.5' : '1'; }
    });
  }

  function uuid_(){
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = (c === 'x') ? r : ((r&0x3)|0x8);
      return v.toString(16);
    });
  }

  /* ── จอที่ 1 — 2 ปุ่มใหญ่ ไม่มีช่องพิมพ์ ───────────────────────── */
  function จอเลือก_(){
    กำลังส่ง = false;
    รอบส่ง++;                 /* คำตอบของรอบก่อนหน้าที่ยังค้างอยู่ ถือว่าหมดอายุทันที */
    ล็อกปุ่มภาษา_(false);
    var t = t_();
    var ปิด = พร้อมส่ง ? '' : ' disabled';
    จอ_(
      '<button class="big b-sick" id="ป_sick"' + ปิด + '>🤒 ' + esc(t.sick) + '<small>' + esc(t.sickS) + '</small></button>' +
      '<button class="big b-ride" id="ป_ride"' + ปิด + '>🚗 ' + esc(t.ride) + '<small>' + esc(t.rideS) + '</small></button>' +
      (พร้อมส่ง ? '' : '<div class="hint">⏳ ' + esc(t.waiting) + '</div>') +
      '<div class="hint">' + esc(เบอร์()) + '</div>'
    );
    if (!พร้อมส่ง) return;    /* ยังไม่พร้อม = ปุ่มกดไม่ได้จริง ๆ ไม่ใช่แค่ดูจาง */
    document.getElementById('ป_sick').onclick = function(){ กดเลือก_('sick'); };
    document.getElementById('ป_ride').onclick = function(){ กดเลือก_('ride'); };
  }

  function กดเลือก_(type){
    var เก่า = เพิ่งส่งไป_(type);
    if (เก่า) return จอเพิ่งแจ้ง_(type, เก่า);
    จอยืนยัน_(type);
  }

  /* ── จอ "เพิ่งแจ้งไปเมื่อ X นาทีที่แล้ว" ─────────────────────────
     🔴 มีปุ่ม "ส่งอีกครั้ง" เสมอ — ห้ามปิดทาง เพราะอาการอาจแย่ลง */
  function จอเพิ่งแจ้ง_(type, เก่า){
    var t = t_();
    จอ_('<div class="card warn"><div class="emoji">⏱️</div>' +
      '<h2>' + esc(t.dupT) + '</h2>' +
      '<p>' + esc(เก่า.นาที) + ' ' + esc(t.dupS) + '</p>' +
      (เก่า.ref ? '<div class="ref">#' + esc(เก่า.ref) + '</div>' : '') +
      '<p>' + esc(t.dupQ) + '</p>' +
      '<button class="big b-sick" style="margin-top:14px" id="ป_อีก">' + esc(t.again) + '</button>' +
      '<button class="ghost" id="ป_กลับ">' + esc(t.back) + '</button>' +
      ปุ่มโทร_() + '</div>');
    document.getElementById('ป_อีก').onclick = function(){ จอยืนยัน_(type); };
    document.getElementById('ป_กลับ').onclick = จอเลือก_;
  }

  /* ── จอยืนยัน 1 จอ — กันกดพลาดในกระเป๋า ───────────────────────── */
  function จอยืนยัน_(type){
    var t = t_();
    จอ_('<div class="card"><div class="emoji">' + (type === 'sick' ? '🤒' : '🚗') + '</div>' +
      '<h2>' + esc(t.askT) + '</h2>' +
      '<p>' + esc(type === 'sick' ? t.sick : t.ride) + '</p>' +
      '<p style="color:#777">' + esc(t.askS) + '</p>' +
      '<button class="big ' + (type === 'sick' ? 'b-sick' : 'b-ride') + '" style="margin-top:14px" id="ป_ยืนยัน">' + esc(t.yes) + '</button>' +
      '<button class="ghost" id="ป_ยกเลิก">' + esc(t.no) + '</button></div>');
    document.getElementById('ป_ยืนยัน').onclick = function(){ ส่ง_(type, this); };
    /* 🔴 (ข้อ 1): ปุ่มนี้ต้องถูกปิดระหว่างส่ง ไม่งั้นกดออกไปตั้งคำขอใหม่ซ้อนได้ */
    document.getElementById('ป_ยกเลิก').onclick = function(){ if (!กำลังส่ง) จอเลือก_(); };
  }

  /* ── ส่งจริง ─────────────────────────────────────────────────────
     🔴 ห้ามลองใหม่อัตโนมัติ ต่อให้ไม่ได้คำตอบเลย
     req_id สุ่มใหม่ทุกครั้งที่ "คนกด" — ไม่ใช่ทุกครั้งที่ยิง */
  function ส่ง_(type, ปุ่ม){
    if (กำลังส่ง) return;
    /* 🔴 (ข้อ 2): ไม่มีตั๋ว = ไม่ยิง — ยิงไปก็รู้อยู่แล้วว่าด่านจะปฏิเสธ
       บอกวิธีแก้พร้อมเบอร์โทรแทน ดีกว่าให้คนป่วยเห็นคำว่า "ผิดพลาด" เฉย ๆ */
    var ตั๋ว = ตั๋วสด_();
    if (!พร้อมส่ง || !ตั๋ว || !(โปรไฟล์ && โปรไฟล์.userId)) return จอผิดพลาด_('AUTH_REQUIRED');

    กำลังส่ง = true;
    ล็อกปุ่มภาษา_(true);       /* สลับภาษาระหว่างรอ = กลับหน้าเลือก = ตั้งคำขอซ้อนได้ */
    if (ปุ่ม) { ปุ่ม.disabled = true; ปุ่ม.textContent = t_().sending; }
    var ปยก = document.getElementById('ป_ยกเลิก');
    if (ปยก) { ปยก.disabled = true; ปยก.style.opacity = '.5'; }

    var รอบนี้ = ++รอบส่ง;
    var ของรอบนี้ = function(){ return รอบนี้ === รอบส่ง; };
    var rid = uuid_();
    var หมดเวลา = setTimeout(function(){ if (ของรอบนี้()) จอไม่รู้ผล_(); }, 25000);

    /* 🔴🔴 ต้องแนบตั๋วยืนยันตัวตนไปด้วยทุกคำขอ ไม่งั้นด่านตีกลับเป็น AUTH_REQUIRED
       เกิดจริง 8 ก.ย. 2026: รุ่น 1 ลืมบรรทัดนี้ ทดสอบบนมือถือแล้วขึ้น Something went wrong
       หน้าอื่นในระบบทำเรื่องนี้ในตัวห่อ fetch ของตัวเอง แต่หน้านี้แนบตรง ๆ
       เพราะตัวห่อนั้นมีการลองส่งใหม่อัตโนมัติ ซึ่งหน้านี้ห้ามมีเด็ดขาด
       ด่านลบ idToken ทิ้งทันทีหลังตรวจ จึงไม่หลุดไปถึงชีตหรือบันทึกการทำงาน */
    var ก้อน = {
      action: 'sick_report',
      userId: โปรไฟล์ ? โปรไฟล์.userId : '',
      type: type,
      req_id: rid
    };
    ก้อน.idToken = ตั๋ว;

    fetch(API_URL, { method: 'POST', body: JSON.stringify(ก้อน) })
    .then(function(r){ return r.text(); })
    .then(function(txt){
      clearTimeout(หมดเวลา);
      /* 🔴 คำตอบที่มาช้ากว่ารอบปัจจุบัน = ของเก่า ห้ามเอามาวาดจอทับ */
      if (!ของรอบนี้()) return;
      var d = null;
      try { d = JSON.parse(txt); } catch(e){}
      if (!d) return จอไม่รู้ผล_();
      if (d.phone) เบอร์สำรอง = d.phone;
      if (d.ok === false) return จอผิดพลาด_(d.error);
      var ส่งไลน์ = d['ส่งไลน์'];
      /* 🔴 (Q5): จำเฉพาะตอนแจ้งทีมสำเร็จจริง
         รุ่น 1.1 จำก่อนแยกผล ⇒ FAIL แล้วกดใหม่ ขึ้น "คุณแจ้งไปแล้ว" ทั้งที่ทีมยังไม่รู้เรื่อง */
      if (ส่งไลน์ === 'OK') { จำการส่ง_(type, d.ref); return จอสำเร็จ_(d.ref); }
      if (ส่งไลน์ === 'FAIL') return จอบันทึกแต่ไม่ถึงทีม_(d.ref);
      return จอไม่รู้ผล_(d.ref);
    })
    .catch(function(){ clearTimeout(หมดเวลา); if (ของรอบนี้()) จอไม่รู้ผล_(); });
  }

  /* ── จอผลลัพธ์ 3 แบบ — ข้อความห้ามพูดเกินหลักฐาน (หลักการข้อ 13) ── */
  function จอสำเร็จ_(ref){
    var t = t_();
    /* ✅ "ส่งเรื่องถึงทีมแล้ว" ไม่ใช่ "ทีมได้รับเรื่องแล้ว" — เรายืนยันไม่ได้ว่ามีคนอ่าน */
    จอ_('<div class="card"><div class="emoji">✅</div>' +
      '<h2 style="color:var(--green)">' + esc(t.okT) + '</h2>' +
      (ref ? '<div class="ref">#' + esc(ref) + '</div>' : '') +
      '<p>' + esc(t.okS) + '</p>' +
      ปุ่มโทร_() +
      '<button class="ghost" id="ป_กลับ">' + esc(t.back) + '</button></div>');
    document.getElementById('ป_กลับ').onclick = จอเลือก_;
  }
  function จอบันทึกแต่ไม่ถึงทีม_(ref){
    var t = t_();
    จอ_('<div class="card"><div class="emoji">⚠️</div>' +
      '<h2 style="color:var(--amber)">' + esc(t.failT) + '</h2>' +
      (ref ? '<div class="ref">#' + esc(ref) + '</div>' : '') +
      '<p><b>' + esc(t.failS) + '</b></p>' +
      ปุ่มโทร_() +
      '<button class="ghost" id="ป_กลับ">' + esc(t.back) + '</button></div>');
    document.getElementById('ป_กลับ').onclick = จอเลือก_;
  }
  function จอไม่รู้ผล_(ref){
    var t = t_();
    /* 🔴 ไม่มีปุ่ม "ลองใหม่" ตรงนี้โดยตั้งใจ — คำสั่งเขียนที่ไม่รู้ผล ห้ามยิงซ้ำเอง
       ทางออกคือโทร ไม่ใช่กดซ้ำ */
    จอ_('<div class="card"><div class="emoji">❓</div>' +
      '<h2 style="color:var(--amber)">' + esc(t.unkT) + '</h2>' +
      (ref ? '<div class="ref">#' + esc(ref) + '</div>' : '') +
      '<p><b>' + esc(t.unkS) + '</b></p>' +
      ปุ่มโทร_() +
      '<button class="ghost" id="ป_กลับ">' + esc(t.back) + '</button></div>');
    document.getElementById('ป_กลับ').onclick = จอเลือก_;
  }
  function จอผิดพลาด_(รหัส){
    var t = t_();
    var บอก = t.errS;
    if (รหัส === 'NOT_MAPPED') บอก = t.notyou;
    if (รหัส === 'WORKER_INACTIVE') บอก = t.out;
    if (รหัส === 'AUTH_REQUIRED' || รหัส === 'LIFF_INIT') บอก = t.needline;
    /* บัญชีแอดมินเปิดหน้านี้ได้ แต่ส่งไม่ได้ เพราะ sick_report เป็นของ worker เท่านั้น (ตั้งใจ)
       ถ้าจะทดสอบ ต้องใช้บัญชีไลน์ที่อยู่ในแท็บ Workers และไม่อยู่ในแท็บ AdminUsers */
    if (รหัส === 'FORBIDDEN' || รหัส === 'NO_ROLE') บอก = t.onlyworker;
    จอ_('<div class="card"><div class="emoji">🛑</div>' +
      '<h2 style="color:var(--red)">' + esc(t.errT) + '</h2>' +
      '<p>' + esc(บอก) + '</p>' +
      '<div class="hint">code: ' + esc(รหัส || '-') + '</div>' +
      ปุ่มโทร_() +
      '<button class="ghost" id="ป_กลับ">' + esc(t.back) + '</button></div>');
    document.getElementById('ป_กลับ').onclick = จอเลือก_;
  }

  /* ── ภาษา ────────────────────────────────────────────────────── */
  function จำภาษา_(v){ try { localStorage.setItem('jm_sick_lang', v); } catch(e){} }
  function ภาษาที่จำไว้_(){
    /* ค่าเริ่มต้น = พม่า · จะเป็นอังกฤษก็ต่อเมื่อน้องเคยกดปุ่ม English ไว้เองเท่านั้น */
    try { var v = localStorage.getItem('jm_sick_lang'); return (v === 'en') ? 'en' : 'mm'; }
    catch(e){ return 'mm'; }
  }
  function ตั้งปุ่มภาษา_(){
    var en = document.getElementById('ป_en'), mm = document.getElementById('ป_mm');
    function สลับ(v){
      if (กำลังส่ง) return;    /* 🔴 (ข้อ 1): สลับภาษาระหว่างรอ = กลับหน้าเลือก = ส่งซ้อนได้ */
      if (ภาษา === v) return;
      ภาษา = v; จำภาษา_(v);
      en.setAttribute('aria-pressed', v === 'en' ? 'true' : 'false');
      mm.setAttribute('aria-pressed', v === 'mm' ? 'true' : 'false');
      document.getElementById('ห_หัว').textContent = t_().head;
      จอเลือก_();
    }
    en.onclick = function(){ สลับ('en'); };
    mm.onclick = function(){ สลับ('mm'); };
    en.setAttribute('aria-pressed', ภาษา === 'en' ? 'true' : 'false');
    mm.setAttribute('aria-pressed', ภาษา === 'mm' ? 'true' : 'false');
    document.getElementById('ห_หัว').textContent = t_().head;
  }

  (async function เริ่ม(){
    ภาษา = ภาษาที่จำไว้_();
    ตั้งปุ่มภาษา_();
    จอเลือก_();               /* วาดจอไว้ก่อนให้เห็นเบอร์โทรทันที แต่ปุ่มยังกดไม่ได้ */
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      โปรไฟล์ = await liff.getProfile();
      ตั๋วล่าสุด = ตั๋วสด_();
      /* 🔴 (ข้อ 2): เปิดปุ่มเฉพาะเมื่อ "มีตัวตนและมีตั๋วจริง" เท่านั้น
         ได้โปรไฟล์แต่ไม่มีตั๋ว = ยิงไปก็ถูกด่านปฏิเสธ ⇒ บอกวิธีแก้ตั้งแต่ต้น */
      if (!โปรไฟล์ || !โปรไฟล์.userId || !ตั๋วล่าสุด) return จอผิดพลาด_('AUTH_REQUIRED');
      พร้อมส่ง = true;
      จอเลือก_();             /* วาดใหม่อีกรอบ คราวนี้ปุ่มกดได้ */
    } catch (e) {
      /* เข้า LIFF ไม่ได้ = ส่งไม่ได้ แต่ต้องยังกดโทรได้ (สเปก: เบอร์ต้องโชว์แม้เซิร์ฟเวอร์ไม่ตอบ) */
      จอผิดพลาด_('LIFF_INIT');
    }
  })();
</script>
