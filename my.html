<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Stuff</title>
<style>
  /* ── สีชุดเดียวกับ myscore.html เป๊ะ ห้ามเปลี่ยน ไม่งั้นน้องจะรู้สึกว่าคนละระบบ ── */
  :root{ --blue:#2a7d9b; --blue-d:#1f5f76; --ink:#1f2b25; --muted:#7b8a82;
         --line:#e7ece9; --bg:#f4f6f5; --lock:#9aa5a0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Padauk",sans-serif;
        background:var(--bg); color:var(--ink); }
  header{ background:var(--blue); color:#fff; padding:18px 16px; position:sticky; top:0; z-index:5; }
  header h1{ font-size:18px; margin:0; font-weight:700; }
  .wrap{ padding:16px 14px 28px; max-width:560px; margin:0 auto; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:16px;
         padding:16px 16px 18px; margin-bottom:14px; display:block;
         text-decoration:none; color:inherit; }
  .card.soon{ opacity:.72; }
  .ctitle{ font-size:15.5px; font-weight:700; color:var(--blue-d); margin:0 0 6px;
           line-height:1.45; display:flex; align-items:flex-start; gap:8px; }
  .ctitle > span:nth-child(2){ flex:1; }
  .cwhy{ font-size:13px; line-height:1.55; color:var(--muted); margin:0; }
  .cmy{ font-size:13px; line-height:1.7; color:var(--muted); margin:4px 0 0; }
  .pill{ flex:0 0 auto; background:#eef2f0; color:var(--lock); font-size:11px;
         font-weight:700; border-radius:999px; padding:3px 9px; margin-top:2px; }

  .back{ display:block; width:100%; text-align:center; background:#fff;
         border:1px solid var(--line); border-radius:14px; padding:13px;
         font-size:15px; font-weight:700; color:var(--blue-d);
         text-decoration:none; margin-top:4px; }
</style>
</head>
<body>
  <header><h1 id="t_title">⭐ My Stuff</h1></header>

  <div class="wrap">

    <div class="card soon">
      <p class="ctitle"><span>🧾</span><span id="t_pay_en">Payslip and loan statement</span>
         <span class="pill">SOON</span></p>
      <p class="cmy" id="t_pay_my"></p>
    </div>

    <div class="card soon">
      <p class="ctitle"><span>⭐</span><span id="t_score_en">My Score</span>
         <span class="pill">SOON</span></p>
      <p class="cmy" id="t_score_my"></p>
    </div>

    <a class="back" href="#" id="t_back">← Back</a>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   my.html — หน้ารวม "เรื่องของฉัน"  · สร้าง 20 ก.ย. 2026
   ตั้งใจให้ไม่มีหลังบ้านเลย: ไม่เรียก LIFF ไม่ยิง API ไม่ต้องมีตั๋ว
   ⇒ พังไม่ได้ ไม่ต้องรอ deployment ไม่กิน quota
   พอสลิป/คะแนนพร้อมเมื่อไหร่ ค่อยเปลี่ยน <div class="card"> เป็น <a href="...">
   ═══════════════════════════════════════════════════════════════════ */

/* ── ข้อความทั้งหมดอยู่ที่เดียวตรงนี้ รหัสตรงกับใบล่ามชุด A ──
   🔴 น้องเห็นแค่ en กับ my เท่านั้น — ไทยไม่ขึ้นบนหน้าจอ
      เพราะหน้าเว็บของน้องทุกหน้าที่มีอยู่ (rules/sick/grievance/refer/myscore)
      เป็นอังกฤษ+พม่า ไม่มีไทยเลย · ไทยเก็บไว้ให้เจ้าของกับล่ามอ่านเทียบเท่านั้น */
var T = {
  'A4-1': { en:'My Stuff',
            th:'เรื่องของฉัน',
            my:'' },                      /* ← เติมคำพม่าตรงนี้ 26 ก.ย. */
  'A4-2': { en:'Payslip and loan statement — coming soon',
            th:'สลิปเงินเดือน และใบกู้ยืมเงิน — เร็ว ๆ นี้',
            my:'' },
  'A4-3': { en:'My Score — opens after your factory gives the first score',
            th:'คะแนนของฉัน — จะเปิดเมื่อโรงงานให้คะแนนรอบแรก',
            my:'' },
  'A4-4': { en:'Back',
            th:'กลับ',
            my:'' }
};

/* หัวข้อหน้า: อังกฤษ + พม่า (แบบเดียวกับ myscore.html "⭐ My Score / မိမိအမှတ်") */
(function () {
  var h = document.getElementById('t_title');
  h.textContent = '⭐ ' + T['A4-1'].en + (T['A4-1'].my ? ' / ' + T['A4-1'].my : '');

  document.getElementById('t_pay_en').textContent   = T['A4-2'].en;
  document.getElementById('t_score_en').textContent = T['A4-3'].en;
  document.getElementById('t_pay_my').textContent   = T['A4-2'].my || '';
  document.getElementById('t_score_my').textContent = T['A4-3'].my || '';

  var b = document.getElementById('t_back');
  b.textContent = '← ' + T['A4-4'].en + (T['A4-4'].my ? ' / ' + T['A4-4'].my : '');
})();

/* ปุ่มกลับ: ถ้ามีหน้าก่อนหน้าให้ถอยกลับ ถ้าไม่มี (เปิดจากเมนูตรง ๆ) ให้ปิดหน้าต่าง LIFF
   ถ้าปิดไม่ได้ด้วย (เปิดในเบราว์เซอร์ปกติ) ก็ไม่ทำอะไร ดีกว่าพาไปหน้าที่ไม่มีจริง */
document.getElementById('t_back').addEventListener('click', function (e) {
  e.preventDefault();
  if (history.length > 1) { history.back(); return; }
  try { if (window.liff && liff.isInClient && liff.isInClient()) { liff.closeWindow(); } } catch (err) {}
});
</script>
</body>
</html>
