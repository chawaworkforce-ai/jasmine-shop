  var ซ้ำได้ = { my_orders: 1, cancel_order: 1, confirm_receipt: 1, dispute_receipt: 1 };
  function รูปถูก(action, j) {   /* คำตอบสำเร็จต้องตรงรูปของคำสั่ง (มติรอบ 50 ★1) */
