      w.appendChild(el('div', 'hold', '⚠️ พักตรวจยอด — บันทึกออเดอร์แล้วแต่ตัดสต็อกไม่ครบ และยอดตอนนี้ไม่ตรงกับที่ควรเป็น\n' +
        'สินค้าในออเดอร์นี้ถูกพักไม่ให้สั่งเพิ่ม · ตรวจนับของจริงแล้วแก้แท็บ Products ให้ถูกก่อน แล้วค่อยกดล้างข้างล่าง (ระบบไม่แตะสต็อกให้)'));
    }

    var tb = el('table'), tr = el('tr');
    ['ของ', 'สั่ง', 'ส่งแล้ว', 'เหลือ', 'ส่งรอบนี้'].forEach(function (x, i) { tr.appendChild(el('th', i ? 'n' : null, x)); });
    tb.appendChild(tr);
    var ช่อง = [];
    var ส่งได้ = ทำรายการได้ && (o.status === 'NEW' || o.status === 'PARTIAL');
    o.items.forEach(function (it) {
      var r = el('tr');
      r.appendChild(el('td', null, it.name + ' (' + บาท(it.price) + ')'));
      r.appendChild(el('td', 'n', it.qty)); r.appendChild(el('td', 'n', it.delivered));
      r.appendChild(el('td', 'n', it.closed ? '0 (ปิด ' + it.closed + ')' : it.remaining));

        var inp = el('input', 'q'); inp.type = 'number'; inp.min = '0'; inp.max = String(it.remaining); inp.value = String(it.remaining); inp.inputMode = 'numeric';
        inp.setAttribute('aria-label', 'จำนวนที่ส่ง ' + it.name);
        ช่อง.push({ id: it.id, inp: inp, max: it.remaining }); td.appendChild(inp);
      } else td.textContent = '–';
      r.appendChild(td); tb.appendChild(r);
    });
    w.appendChild(tb);

    var msg = el('div', 'msg');
    var acts = el('div', 'acts');
    var ปุ่มทั้งหมด = [];
    if (ส่งได้) {
      var bSend = el('button', 'b-go', '✅ บันทึกส่งของ'); bSend.type = 'button';
      var reqส่ง = เลขคำขอ();   // เลขเดียวต่อการกดครั้งนี้ — กดซ้ำหลังเน็ตหลุดจะได้ใบเดิม
      bSend.onclick = function () {
        var items = [], ผิด = '';
        ช่อง.forEach(function (c) { var q = Math.floor(Number(c.inp.value) || 0); if (q < 0 || q > c.max) ผิด = 'จำนวนต้องอยู่ระหว่าง 0 ถึง ' + c.max; if (q > 0) items.push({ id: c.id, qty: q }); });
        if (ผิด) { msg.className = 'msg bad'; msg.textContent = ผิด; return; }
        if (!items.length) { msg.className = 'msg bad'; msg.textContent = 'ยังไม่ได้ใส่จำนวน'; return; }
        กดแล้วรอ(ปุ่มทั้งหมด, msg, { action: 'admin_record_delivery', req_id: reqส่ง, order_id: o.order_id, items: items }, function (r) {
          return 'บันทึกแล้ว ใบรับของ ' + r.receipt_no + ' · ' + บาท(r.amount) + (r.duplicate ? ' (ใบเดิม)' : '') +
            (r.worker_notified === false ? '\n⚠️ ส่งไลน์ถึงน้องไม่สำเร็จ — แจ้งน้องให้กดยืนยันเอง' : '');
        });
      };
      acts.appendChild(bSend); ปุ่มทั้งหมด.push(bSend);
    }
    /* รอบ 50 — ล้าง/ปิดส่วนค้าง: รอส่ง = ล้างทั้งออเดอร์ · ส่งบางส่วน = ปิดเฉพาะที่ยังไม่ส่ง · พักตรวจยอด = ล้างหลังแก้สต็อกแล้ว
       ต้องเลือกชนิดเหตุผล (ข้อเลือก 1 มติรอบ 49): ของไม่มีจริง = ไม่คืนสต็อก · เหตุอื่น = คืนสต็อกส่วนที่ยังไม่ส่ง */
    var ล้างได้ = ทำรายการได้ && (o.status === 'NEW' || o.status === 'PARTIAL' || o.status === 'HOLD');
    if (ล้างได้) {
      var ป้ายล้าง = o.status === 'PARTIAL' ? '🧹 ปิดส่วนที่ยังไม่ส่ง' : (o.status === 'HOLD' ? '🧹 ล้างออเดอร์ที่พัก' : '🧹 ล้างออเดอร์');
      var bClear = el('button', 'b-no', ป้ายล้าง); bClear.type = 'button';
      var why = el('input', 't'); why.placeholder = o.status === 'HOLD' ? 'บันทึกผลตรวจนับ เช่น นับจริงเหลือ 9' : 'เหตุผล เช่น ของหมด'; why.maxLength = 200;
      var กลุ่ม = 'why-' + o.order_id;
      var ชนิด = el('div', 'why');
      ['NO_STOCK', 'OTHER'].forEach(function (k) {
        var lb = el('label'); var rb = el('input'); rb.type = 'radio'; rb.name = กลุ่ม; rb.value = k;
        lb.appendChild(rb); lb.appendChild(el('span', null, o.status === 'HOLD' ? (k === 'NO_STOCK' ? 'ของไม่มีจริง' : 'เหตุอื่น') : ชนิดล้างไทย[k]));
        ชนิด.appendChild(lb);
      });
      bClear.onclick = function () {
        var เลือก = ชนิด.querySelector('input:checked');
        if (!เลือก) { msg.className = 'msg bad'; msg.textContent = 'เลือกก่อนว่าล้างเพราะของไม่มีจริง หรือเหตุอื่น'; return; }
        if (!why.value.trim()) { msg.className = 'msg bad'; msg.textContent = 'ใส่เหตุผลก่อน'; why.focus(); return; }
        กดแล้วรอ(ปุ่มทั้งหมด, msg, { action: 'admin_clear_order', order_id: o.order_id, reason: why.value.trim(), reason_type: เลือก.value }, function (r) {
          var คืน = (r.returned || []).map(function (x) { return x.id + ' +' + x.qty; }).join(', ');
          if (r.status === 'PARTIAL_CLOSED') return 'ปิดส่วนที่ยังไม่ส่งแล้ว · ของที่ส่งแล้ว ใบรับของ และเลขหนี้ยังอยู่ครบ · ' + (คืน ? 'คืนสต็อก ' + คืน : 'ไม่คืนสต็อก') + ' · อย่าลืมแจ้งน้องเอง';
          return 'ล้างแล้ว · บันทึกว่า ' + (r.by || 'คุณ') + ' เป็นคนกด · ' + (o.status === 'HOLD' ? 'สต็อกไม่ถูกแตะ' : (คืน ? 'คืนสต็อก ' + คืน : 'ไม่คืนสต็อก')) + ' · อย่าลืมแจ้งน้องเอง';
        });
      };
      acts.appendChild(bClear); ปุ่มทั้งหมด.push(bClear);
      w.appendChild(acts); w.appendChild(ชนิด); w.appendChild(why);
    } else if (ส่งได้) {
      w.appendChild(acts);
    }
    (o.receipts || []).forEach(function (rc) { w.appendChild(วาดใบรับ(rc)); });
    w.appendChild(msg);
    return w;
  }

  function วาดใบรับ(rc) {
    var b = el('div', 'rc');
    var h = el('div', 'h'); h.appendChild(el('span', null, '🧾 ' + rc.receipt_no + ' · ' + บาท(rc.amount)));
    h.appendChild(el('span', null, rc.loan_ref ? 'ลงหนี้แล้ว' : (ใบไทย[rc.confirm_status] || rc.confirm_status))); b.appendChild(h);
    b.appendChild(el('div', 'muted', (rc.items || []).map(function (it) { return it.name + ' x' + it.qty; }).join(' · ') + ' · บันทึกโดย ' + (rc.recorded_by || '-')));
    if (rc.loan_ref) { b.appendChild(el('div', 'muted', 'เลขรายการหนี้: ' + rc.loan_ref)); return b; }
    var msg = el('div', 'msg');
    var acts = el('div', 'acts');
    var bCopy = el('button', 'b-mid', '📋 คัดลอกเลขใบรับของ'); bCopy.type = 'button';
    bCopy.onclick = function () { คัดลอก(rc.receipt_no, msg); };
    acts.appendChild(bCopy);
    if (rc.card_id) {   /* รุ่น 18 PAY-5: รหัสการ์ดเต็มจากใบรับของนั้น · 6 ตัวท้ายไว้ช่วยอ่าน · ไม่ให้พิมพ์เอง */
      var bCard = el('button', 'b-mid', '📋 คัดลอกรหัสการ์ด …' + String(rc.card_id).slice(-6)); bCard.type = 'button';
      bCard.onclick = function () { คัดลอก(String(rc.card_id), msg, 'รหัสการ์ดเต็ม (…' + String(rc.card_id).slice(-6) + ')'); };

    if (ทำรายการได้ && rc.confirm_status === 'CONFIRMED') {
      var ref = el('input', 't'); ref.placeholder = 'เลขรายการหนี้จากระบบกู้ยืม'; ref.maxLength = 60;
      var amt = el('input', 't'); amt.type = 'number'; amt.value = String(rc.amount); amt.inputMode = 'decimal'; amt.setAttribute('aria-label', 'ยอดที่ลงหนี้');

      bLoan.onclick = function () {

        กดแล้วรอ([bLoan], msg, { action: 'admin_record_loan', receipt_no: rc.receipt_no, loan_ref: ref.value.trim(), loan_amount: Number(amt.value) }, function (r) {
          return 'บันทึกแล้ว · ' + r.loan_ref + (r.already ? ' (ของเดิม)' : '');
        });

    if (ทำรายการได้ && rc.confirm_status !== 'VOID') {

      var bVoid = el('button', 'b-no', '✖ ยกเลิกใบนี้'); bVoid.type = 'button';
      bVoid.onclick = function () {
        if (!why.value.trim()) { msg.className = 'msg bad'; msg.textContent = 'ใส่เหตุผลก่อนยกเลิกใบ'; why.focus(); return; }
        กดแล้วรอ([bVoid], msg, { action: 'admin_void_receipt', receipt_no: rc.receipt_no, reason: why.value.trim() }, function () {
          return 'ยกเลิกใบนี้แล้ว (ประวัติยังอยู่) · ของในใบนี้กลับเป็น "ยังไม่ส่ง"';

  function กดแล้วรอ(ปุ่ม, msg, body, ข้อความสำเร็จ) {
    ปุ่ม.forEach(function (x) { x.disabled = true; });
    msg.className = 'msg'; msg.textContent = 'กำลังบันทึก…';
    ยิง(body).then(function (r) {
      if (r.ok) {
        msg.className = 'msg ok'; msg.textContent = ข้อความสำเร็จ(r) + '\nกำลังโหลดใหม่…';
        setTimeout(โหลด, 900);
        return;
      }
      ปุ่ม.forEach(function (x) { x.disabled = false; });
      msg.className = 'msg bad';
      msg.textContent = ยังไม่รู้ผล(r) ? 'ยังไม่ได้รับคำตอบ — กด "โหลดใหม่" ดูก่อนว่าบันทึกแล้วหรือยัง แล้วค่อยกดซ้ำ' : แปลผิด(r);
    });
  }

  function คัดลอก(ข้อความ, msg, ป้าย) {   /* รุ่น 18: ป้าย = ข้อความที่โชว์แทน (ข้อมูลยาว/รหัสเต็ม) */
    function สำเร็จ() { msg.className = 'msg ok'; msg.textContent = 'คัดลอกแล้ว: ' + (ป้าย || ข้อความ); }
    function สำรอง() {
      try {
        var t = document.createElement('textarea'); t.value = ข้อความ; t.setAttribute('readonly', '');
        t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
        var ok = document.execCommand('copy'); document.body.removeChild(t);
        if (ok) สำเร็จ(); else { msg.className = 'msg'; msg.textContent = 'คัดลอกเองได้: ' + ข้อความ; }
      } catch (e) { msg.className = 'msg'; msg.textContent = 'คัดลอกเองได้: ' + ข้อความ; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ข้อความ).then(สำเร็จ, สำรอง); else สำรอง();
  }

  /* ── รุ่น 18 PAY-10: ส่งออก 6 ช่อง (คำสั่งอ่านอย่างเดียว · ผู้ทำรายการเท่านั้น · ตรวจรูปคำตอบของคำสั่งนี้) ── */
  $('expBtn').onclick = function () {
    var b = this, out = $('expOut');
    b.disabled = true; out.className = 'msg'; out.textContent = 'กำลังส่งออก…';
    Array.prototype.slice.call($('exp').querySelectorAll('.expres')).forEach(function (x) { x.parentNode.removeChild(x); });
    ยิง({ action: 'admin_export_receipts' }).then(function (r) {
      b.disabled = false;
      if (!r.ok) { out.className = 'msg bad'; out.textContent = ยังไม่รู้ผล(r) ? 'ยังไม่ได้รับคำตอบ — กดใหม่ได้ (คำสั่งนี้อ่านอย่างเดียว ไม่บันทึกอะไร)' : แปลผิด(r); return; }
      if (r.kind !== 'jasmine-buy-receipts' || !Array.isArray(r.columns) || !Array.isArray(r.rows) || !Array.isArray(r.test_rows)) {
        out.className = 'msg bad'; out.textContent = 'คำตอบไม่ใช่ข้อมูลส่งออก — กดใหม่ได้'; return;
      }
      if (r.headers_ok !== true) { out.className = 'msg bad'; out.textContent = 'หัวคอลัมน์แท็บใบรับของไม่ครบ (' + (r.missing_headers || []).join(', ') + ') — ยังไม่ส่งออก ให้แจ้งผู้ลงมือ'; return; }
      var ข้อมูล = { kind: r.kind, format_version: r.format_version, exported_at: r.exported_at, timezone: r.timezone, exported_by: r.exported_by,
        source_tab: r.source_tab, columns: r.columns, count: r.count, rows: r.rows, test_count: r.test_count, test_rows: r.test_rows };
      var ข้อความ = JSON.stringify(ข้อมูล);
      out.className = 'msg ok';
      out.textContent = 'ส่งออกแล้ว ' + r.exported_at + ' · ใช้จริง ' + r.count + ' ใบ · ทดสอบ (แยกไว้ ไม่ใช้กระทบยอดจริง) ' + r.test_count + ' ใบ' +
        (r.tab_exists ? '' : '\nยังไม่มีแท็บใบรับของ = ยังไม่เคยบันทึกส่งของ (ไม่ใช่ข้อมูลหาย)');
      var กล่อง = el('div', 'expres');
      var acts = el('div', 'acts'), msg2 = el('div', 'msg');
      var bc = el('button', 'b-mid', '📋 คัดลอกข้อมูลส่งออก'); bc.type = 'button';
      bc.onclick = function () { คัดลอก(ข้อความ, msg2, 'ข้อมูลส่งออก ' + r.count + ' ใบ (' + r.exported_at + ')'); };
      var ชื่อไฟล์ = 'jasmine-receipts-' + String(r.exported_at).replace(/[^0-9]/g, '').slice(0, 14) + '-n' + r.count + '-t' + r.test_count + '.json';
      var bf = el('button', 'b-mid', '💾 บันทึกเป็นไฟล์'); bf.type = 'button';
      bf.onclick = function () {
        try {
          var blob = new Blob([ข้อความ], { type: 'application/json' });
          var f = (typeof File === 'function') ? new File([blob], ชื่อไฟล์, { type: 'application/json' }) : null;
          if (f && navigator.canShare && navigator.canShare({ files: [f] }) && navigator.share) {
            navigator.share({ files: [f], title: ชื่อไฟล์ }).then(function () { msg2.className = 'msg ok'; msg2.textContent = 'ส่งไฟล์แล้ว: ' + ชื่อไฟล์; },
              function () { msg2.className = 'msg'; msg2.textContent = 'ยกเลิกการส่งไฟล์ — ใช้ปุ่มคัดลอกแทนได้'; });
            return;
          }
          var u = URL.createObjectURL(blob), a2 = document.createElement('a');
          a2.href = u; a2.download = ชื่อไฟล์; document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
          setTimeout(function () { URL.revokeObjectURL(u); }, 5000);
          msg2.className = 'msg'; msg2.textContent = 'สั่งบันทึกไฟล์ ' + ชื่อไฟล์ + ' แล้ว — ถ้าไม่เห็นไฟล์ ใช้ปุ่มคัดลอกแทน';
        } catch (e) { msg2.className = 'msg bad'; msg2.textContent = 'บันทึกไฟล์ไม่ได้บนเครื่องนี้ — ใช้ปุ่มคัดลอกแทน'; }
      };
      acts.appendChild(bc); acts.appendChild(bf); กล่อง.appendChild(acts);
      var ta = el('textarea'); ta.readOnly = true; ta.value = ข้อความ; ta.setAttribute('aria-label', 'ข้อมูลส่งออก (กดค้างเพื่อเลือกทั้งหมดได้)');
      กล่อง.appendChild(ta); กล่อง.appendChild(msg2);
      $('exp').appendChild(กล่อง);
    });
  };

  $('reload').onclick = โหลด;
  $('round').onchange = function () { รอบที่เลือก = this.value; โหลด(); };

  if (typeof liff === 'undefined') { สถานะ('โหลดไลน์ไม่สำเร็จ — ปิดแล้วเปิดใหม่จากไลน์', true); return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    โหลด();
  }).catch(function (e) { สถานะ('เชื่อมต่อไลน์ไม่สำเร็จ: ' + (e && e.message ? e.message : e), true); });
})();
