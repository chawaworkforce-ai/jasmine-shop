<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วัดความเร็ว D1</title>
<style>
 :root{--bg:#f6f5f0;--card:#fff;--ink:#23291f;--muted:#7c8473;--line:#e7e4d8;--brand:#4f7a4d;--warn:#b3402f}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
   font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;padding:14px}
 h1{font-size:17px;margin:0 0 4px} .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
 label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
 input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
 button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;
   font-size:16px;font-weight:700;margin-top:12px}
 button:disabled{opacity:.5}
 table{width:100%;border-collapse:collapse;font-size:14px} td{padding:6px 0;border-bottom:1px solid var(--line)}
 td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
 .ms{color:var(--brand)} .big{font-size:20px}
 .err{color:var(--warn);font-weight:700;white-space:pre-wrap;word-break:break-all}
 .note{font-size:12px;color:var(--muted);margin-top:8px}
 #log{font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-all;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<h1>⏱️ วัดความเร็ว D1</h1>
<div class="sub">หน้าทดสอบชั่วคราว · ใช้เสร็จแล้วลบออกจากที่เก็บ · ไม่มีการเขียนข้อมูลใด ๆ</div>

<div class="card">
  <label>รหัส LIFF (ถ้าเว้นว่าง จะใช้ค่าที่จำไว้)</label>
  <input id="liffId" placeholder="เช่น 2010xxxxxx-xxxxxxxx">
  <label>ที่อยู่บานเว็บ Ops (/exec)</label>
  <input id="apiUrl" placeholder="วางที่อยู่ที่ลงท้ายด้วย /exec">
  <label>คำสั่งที่จะใช้วัด (ต้องเป็นคำสั่งอ่านที่บทบาทของคุณมีสิทธิ์)</label>
  <select id="action">
    <option value="dashboard">dashboard — สำหรับแอดมิน</option>
    <option value="site_list">site_list — แอดมินหรือน้อง</option>
    <option value="my_score">my_score — สำหรับน้อง</option>
  </select>
  <button id="go">▶ ยิง 5 รอบ แล้ววัดเวลา</button>
  <div class="note">รอบแรกจะช้ากว่าเพื่อน เพราะสคริปต์หลังบ้านเพิ่งตื่น — ปกติ</div>
</div>

<div class="card" id="out" style="display:none">
  <table id="tbl"></table>
  <div id="log"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var จำ = function(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; localStorage.setItem(k,v); }catch(e){ return ''; } };
  $('liffId').value = จำ('zzPerfLiff');
  $('apiUrl').value = จำ('zzPerfApi');

  var เส้นเริ่ม = (window.performance && performance.timing && performance.timing.navigationStart) || Date.now();
  var ตอนนี้ = function(){ return (window.performance && performance.now) ? performance.now() : (Date.now()-เส้นเริ่ม); };
  var tSDK = null, tInit = null, tToken = null, พร้อม = false, ตั๋ว = '';

  function แถว(ชื่อ, ค่า, ใหญ่){
    return '<tr><td>'+ชื่อ+'</td><td class="ms'+(ใหญ่?' big':'')+'">'+ค่า+'</td></tr>';
  }
  function บันทึก(m){ $('log').textContent += m + '\n'; }

  // ── วัดเวลาโหลด SDK ──
  tSDK = (typeof liff === 'undefined') ? -1 : ตอนนี้();

  $('go').onclick = function(){
    var liffId = $('liffId').value.trim(), api = $('apiUrl').value.trim(), act = $('action').value;
    if(!liffId || !api){ alert('ต้องกรอกทั้งรหัส LIFF และที่อยู่บานเว็บ'); return; }
    จำ('zzPerfLiff', liffId); จำ('zzPerfApi', api);
    $('go').disabled = true; $('out').style.display='block'; $('tbl').innerHTML=''; $('log').textContent='';

    var เริ่มInit = ตอนนี้();
    var p = พร้อม ? Promise.resolve() : liff.init({ liffId: liffId });
    p.then(function(){
      if(!พร้อม){ tInit = ตอนนี้() - เริ่มInit; พร้อม = true; }
      var เริ่มToken = ตอนนี้();
      ตั๋ว = liff.getIDToken() || '';
      tToken = ตอนนี้() - เริ่มToken;
      if(!ตั๋ว) throw new Error('ไม่ได้ตั๋ว — LIFF app นี้อาจไม่ได้ติ๊ก openid');
      return ยิงหลายรอบ(api, act, 5);
    }).then(function(รอบ){
      var เวลา = รอบ.map(function(r){ return r.ms; });
      var เรียง = เวลา.slice().sort(function(a,b){ return a-b; });
      var กลาง = Math.round(เรียง[Math.floor(เรียง.length/2)]);
      var h = '';
      h += แถว('โหลดตัวช่วย LIFF', tSDK<0 ? 'โหลดไม่ได้' : Math.round(tSDK)+' ms');
      h += แถว('liff.init()', Math.round(tInit)+' ms');
      h += แถว('ขอตั๋ว getIDToken()', Math.round(tToken)+' ms');
      h += แถว('ยิงไปหลังบ้าน — รอบแรก', Math.round(เวลา[0])+' ms');
      h += แถว('ยิงไปหลังบ้าน — ค่ากลาง 4 รอบหลัง', กลาง+' ms', true);
      var s = รอบ.find(function(r){ return r.ms_ด่าน !== undefined; });
      if(s){
        h += แถว('  └ ในนั้น: ด่านตรวจ', s.ms_ด่าน+' ms');
        h += แถว('  └ ในนั้น: งานจริง', s.ms_งาน+' ms');
      }
      $('tbl').innerHTML = h;
      บันทึก('ทุกรอบ (ms): ' + เวลา.map(function(v){ return Math.round(v); }).join(' · '));
      if(!s) บันทึก('ยังไม่ได้ใส่ตัวจับเวลาฝั่งเซิร์ฟเวอร์ (ช่อง _ms) — ตัวเลขข้างบนคือเวลาไป-กลับทั้งก้อน');
      บันทึก('ผลตอบกลับรอบสุดท้าย: ' + รอบ[รอบ.length-1].สรุป);
      $('go').disabled = false;
    }).catch(function(err){
      $('tbl').innerHTML = '<tr><td colspan="2" class="err">พลาด: ' + (err && err.message ? err.message : err) + '</td></tr>';
      $('go').disabled = false;
    });
  };

  function ยิงหลายรอบ(api, act, n){
    var ผล = [];
    function รอบถัดไป(i){
      if(i >= n) return Promise.resolve(ผล);
      var t = ตอนนี้();
      return fetch(api, { method:'POST', body: JSON.stringify({ action: act, idToken: ตั๋ว }) })
        .then(function(r){ return r.text(); })
        .then(function(txt){
          var ms = ตอนนี้() - t, j = null;
          try { j = JSON.parse(txt); } catch(e) {}
          ผล.push({ ms: ms,
                    ms_ด่าน: j && j._ms ? j._ms['ด่าน'] : undefined,
                    ms_งาน:  j && j._ms ? j._ms['งาน']  : undefined,
                    สรุป: j ? (j.ok ? 'ok' : ('ok:false · ' + j.error)) : txt.slice(0,80) });
          return new Promise(function(res){ setTimeout(res, 400); }).then(function(){ return รอบถัดไป(i+1); });
        });
    }
    return รอบถัดไป(0);
  }
})();
</script>
</body>
</html>
