<script>
/* สวิตช์ปิดหน้า (S4-4) 21 ก.ย. 2026 — ปิดหน้าไหนก็ได้โดยแก้ไฟล์ flags.json ไฟล์เดียว
   หลักที่ยึด: "อ่านไม่ได้ = เปิดตามปกติ" (fail-open)
   ถ้าเน็ตช้า ไฟล์หาย หรือไฟล์เสีย ⇒ หน้าทำงานปกติ ห้ามพังเพราะตัวกันพัง
   ใส่ ?ts= กับ no-store เพื่อไม่ให้ติดแคช 10 นาทีของ GitHub Pages ⇒ ปิดแล้วเห็นผลเกือบทันที */
(function () {
  try {
    if (!window.fetch || !window.AbortController) return;          // เบราว์เซอร์เก่า = เปิดตามปกติ
    var ชื่อหน้า = (location.pathname.split('/').pop() || '').replace(/\.html$/i, '') || 'index';
    var ตัวตัด = new AbortController();
    var นาฬิกา = setTimeout(function () { ตัวตัด.abort(); }, 3000); // เกิน 3 วินาที = เลิกถาม เปิดตามปกติ
    fetch('flags.json?ts=' + Date.now(), { cache: 'no-store', signal: ตัวตัด.signal })
      .then(function (r) { clearTimeout(นาฬิกา); return r.ok ? r.json() : null; })
      .then(function (ธง) {
        if (ธง && String(ธง[ชื่อหน้า] == null ? '' : ธง[ชื่อหน้า]).trim().toLowerCase() === 'off') {
          location.replace('maintenance.html?p=' + encodeURIComponent(ชื่อหน้า));
        }
      })
      .catch(function () { clearTimeout(นาฬิกา); });                 // อ่านไม่ได้ = เปิดตามปกติ
  } catch (e) { /* อะไรก็ตามที่พังตรงนี้ ห้ามทำให้หน้าพัง */ }
})();
</script>

<script>
  /* ══════════════════════════════════════════════════════════════
     หน้าดูแลหน้างานของลูกค้า · ชุดที่ 4 ส่วนอ่าน
     รุ่น 1.3 · 10 ก.ย. 2026 — เพิ่ม "กดที่การ์ดแล้วดูรูปใหญ่" (ต่อจากรุ่น 1.2)
     รุ่น 1.1 · 9 ก.ย. 2026 — แก้ตามผลตรวจของผู้วางแผน 5 จุด
       1. รูปพังต้องไม่เปิดจอเต็มทับรายชื่อ  (ใช้ตัวยิงดิบสำหรับคำสั่ง photos)
       2. ตัวนับและหัวจอต้องตามไซต์ที่เลือกเสมอ
       3. คนที่ 201 ขึ้นไปต้องได้รูปด้วย  (แบ่งเฉพาะส่วนที่เกิน)
       4. เลิกประกอบโค้ด onerror จากชื่อคน  (วาดด้วย DOM ล้วน)
       5. ไซต์เดียว = เลือกให้เอง · หลายไซต์ = ต้องเลือกก่อน ไม่มีตัวเลือก "ทุกไซต์"

     🔴 ค่าสองตัวข้างล่างกรอกไว้แล้วจากหน้าเว็บที่ใช้งานจริง (report.html)
     ══════════════════════════════════════════════════════════════ */
  const LIFF_ID = "2010242926-nreePSO4";
  const API_URL = "https://script.google.com/macros/s/AKfycbyI8iSCTn1mYB0qS7m19DrgrG-Fh3w4j1xibRWBc7l77pLaIT9nLvFUBaQ_d8JcmifE/exec";

  /* 🔴 เก็บตัวยิงดิบไว้ "ก่อน" ตัวห่อจะเข้ามาครอบ window.fetch

     คำสั่ง photos ใช้ตัวยิงดิบ เพราะรูปพังไม่ควรลบรายชื่อที่โหลดสำเร็จแล้วทิ้งทั้งหน้า */
  window.__ยิงดิบ = window.fetch.bind(window);
</script>

<script>
/* ══ ตัวห่อคำขอ D1 รุ่น 2 (รายการขาว) — ฝังมาทั้งไฟล์ ══ */
/* ══════════════════════════════════════════════════════════════════════
   ตัวห่อคำขอ D1 — รุ่น 2 (9 ก.ย. 2026)
   วางในทุกหน้าเว็บที่ยิง API_URL  ต้องวาง "หลัง" บรรทัดที่ประกาศ API_URL และ LIFF_ID

   🔴 สิ่งที่เปลี่ยนจากรุ่น 1 มีข้อเดียว แต่เป็นข้อสำคัญ
   ─────────────────────────────────────────────────────────────────────
   รุ่น 1 ใช้ "รายการคำสั่งเขียน" (รายการดำ)
        var เขียน = !!คำสั่งเขียน_[action];
        var ลองใหม่ได้ = !เขียน;
   ⇒ คำสั่งที่ไม่มีใครขึ้นทะเบียน จะถูกตีว่าเป็น "คำสั่งอ่าน" แล้วระบบลองส่งใหม่ให้เองเงียบ ๆ
   ⇒ ลืมขึ้นทะเบียน = อันตราย

   ร่องรอยว่าเรื่องนี้เกิดจริงมาแล้ว 2 รอบ
     · ชุดที่ 2 ต้องตามมาเติม case_open, case_update เข้ารายการทีหลัง (cases.html บ.110)
     · ชุดที่ 3 เลี่ยงปัญหาด้วยการไม่ใช้ตัวห่อเลย (sick.html ยิง fetch ตรง)
       ⇒ ได้ความปลอดภัย แต่เสียจอ "เข้าใหม่" ตอนตั๋วหมดอายุ และเสียชั้นจัดการคำตอบไม่ใช่ JSON ไปด้วย

   รุ่น 2 พลิกเป็น "รายการคำสั่งอ่านที่ลองใหม่ได้" (รายการขาว)
        var ลองใหม่ได้ = !!คำสั่งอ่านที่ลองใหม่ได้_[action];
   ⇒ ลืมขึ้นทะเบียน = ไม่ลองใหม่ = ปลอดภัยโดยปริยาย
   ⇒ คำสั่งใหม่ของชุดที่ 4 ปลอดภัยตั้งแต่ยังไม่มีใครแตะรายการนี้

   ⚠️ กติกาการเติมรายการนี้: เติมได้เฉพาะคำสั่งที่ "อ่านอย่างเดียว ไม่เขียนอะไรเลย"
      ถ้าไม่แน่ใจว่าคำสั่งไหนเขียนหรือไม่ ห้ามเติม — ไม่เติมแล้วช้าลง ดีกว่าเติมแล้วส่งซ้ำ
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  var _ยิงเดิม = window.fetch;

  /* รายการขาว — คำสั่งอ่านอย่างเดียวเท่านั้น ที่อนุญาตให้ลองใหม่อัตโนมัติ 1 ครั้ง
     (ตรงกับคำสั่งอ่านใน ช่องที่รับ_ ของด่าน ณ เวอร์ชัน 24) */
  var คำสั่งอ่านที่ลองใหม่ได้_ = {
    workers:1, worker_reports:1, my_score:1, matched_list:1, matching_data:1,
    dashboard:1, announce_targets:1, site_list:1, grievance_stats:1,
    company_rules:1, case_page:1,
    /* 🆕 ชุดที่ 4 — เติมเฉพาะคำสั่งอ่าน */
    customer_home:1, photos:1, customer_request_status:1
  };

  var เตือนแล้ว_ = false;

  function หนี_(s) {
    return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c];
    });
  }

  /* จอเต็มหน้าที่ใช้ร่วมกันทุกกรณี — ทับหน้าเดิมไว้ ไม่ให้ผู้ใช้เห็นข้อความดิบ */
  function จอ_(html) {
    if (เตือนแล้ว_) return;
    เตือนแล้ว_ = true;
    var d = document.createElement('div');
    d.id = '_d1จอ';
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;' +
      'flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;' +
      'text-align:center;overflow:auto;-webkit-overflow-scrolling:touch;' +
      'font-family:-apple-system,"Segoe UI","Sarabun","Noto Sans Myanmar","Padauk",sans-serif');
    d.innerHTML = html;
    document.body.appendChild(d);

    var โหลด = document.getElementById('_d1โหลดใหม่');
    if (โหลด) โหลด.onclick = function () { location.reload(); };

    var ปิด = document.getElementById('_d1ปิด');
    if (ปิด) ปิด.onclick = function () {
      var x = document.getElementById('_d1จอ');
      if (x && x.parentNode) x.parentNode.removeChild(x);
      เตือนแล้ว_ = false;
    };

    var สลับ = document.getElementById('_d1สลับ');
    if (สลับ) สลับ.onclick = function () {
      var x = document.getElementById('_d1รายละเอียด');
      if (x) x.style.display = (x.style.display === 'none' ? 'block' : 'none');
    };
  }

  function หน้าเข้าใหม่_(ไม่มีตั๋วเลย) {
    if (ไม่มีตั๋วเลย) {
      จอ_('<div style="font-size:56px">🔧</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">ตั้งค่าแอปยังไม่ครบ</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">หน้านี้ยังขอ "ตั๋วยืนยันตัวตน" ไม่ได้<br>' +
        'App setup incomplete — please tell the admin</div>' +
        '<div style="font-size:13px;color:#888;margin-top:14px">แจ้งผู้ดูแลระบบ</div>');
    } else {
      จอ_('<div style="font-size:56px">⏱️</div>' +
        '<div style="font-size:19px;font-weight:700;margin:10px 0 4px">หมดเวลา — เข้าใหม่</div>' +
        '<div style="font-size:15px;color:#555;line-height:1.6">Session expired.<br>Please tap the button to continue.</div>' +
        '<button id="_d1โหลดใหม่" style="margin-top:22px;padding:16px 30px;border:0;border-radius:12px;' +
        'background:#06c755;color:#fff;font-size:18px;font-weight:700">🔑 เข้าใหม่ / Log in again</button>');
    }
  }

  function กล่องรายละเอียด_(รหัส, คำสั่ง, ต้นข้อความ) {
    var เวลา = '';
    try { เวลา = new Date().toLocaleString(); } catch (e) {}
    return '<div id="_d1สลับ" style="margin-top:20px;font-size:12px;color:#9a9a9a;' +
      'text-decoration:underline">รายละเอียดสำหรับผู้ดูแล / details</div>' +
      '<div id="_d1รายละเอียด" style="display:none;margin-top:10px;max-width:100%;' +
      'background:#f4f4f4;border-radius:10px;padding:10px 12px;font-size:11px;color:#444;' +
      'text-align:left;word-break:break-all;line-height:1.5;-webkit-user-select:text;user-select:text">' +
      '<b>D1-ERR</b> · not-json<br>' +
      'code: ' + หนี_(รหัส) + '<br>' +

    /* 🔴 เพดานเวลารอ (S4-5 · 21 ก.ย. 2026) — ยกมาจากหน้าน้อง 11 หน้าที่ใส่ไปแล้ว

    var เส้นตาย_ = Date.now() + เพดานรวม_;

    งาน = งาน.then(function (r) {

  }

  function การ์ด_(w) {
    var กล่อง = document.createElement('div');
    กล่อง.className = 'คน';

    var ตัวย่อ = อักษรย่อ_(w.name);
    var id = String(w.card_id || '');
    var r = สถานะ.รูป[id];

    function แทนรูป_(ข้อความชั้นเพิ่ม) {
      var d = document.createElement('div');
      d.className = 'แทนรูป' + (ข้อความชั้นเพิ่ม || '');
      d.textContent = ข้อความชั้นเพิ่ม ? '' : ตัวย่อ;
      return d;
    }

    if (r && r['สถานะ'] === 'OK' && r.url) {
      var img = document.createElement('img');
      img.className = 'รูป';
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('error', function () {
        if (img.parentNode) img.parentNode.replaceChild(แทนรูป_(''), img);
      });
      img.src = r.url;
      กล่อง.appendChild(img);

      /* 🆕 รุ่น 1.3 — มีรูปจริงเท่านั้นถึงกดได้ (คนที่รูปพังกดแล้วไม่มีอะไรให้ดู) */
      กล่อง.classList.add('กดได้');
      กล่อง.setAttribute('tabindex', '0');
      กล่อง.setAttribute('role', 'button');
      กล่อง.addEventListener('click', function () { เปิดจอรูป_(w, r.url); });
      กล่อง.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); เปิดจอรูป_(w, r.url); }
      });
    } else if (!r && !สถานะ.ขอรูปแล้ว) {
      กล่อง.appendChild(แทนรูป_(' โครง'));
    } else {
      กล่อง.appendChild(แทนรูป_(''));
    }

    var ชื่อ = document.createElement('div');
    ชื่อ.className = 'ชื่อ';
    ชื่อ.textContent = w.name || '—';
    กล่อง.appendChild(ชื่อ);

    var หมายเหตุ = (r && r['สถานะ'] && r['สถานะ'] !== 'OK') ? (ข้อความรูป_[r['สถานะ']] || r['สถานะ']) : '';
    var ไซต์ = document.createElement('div');
    ไซต์.className = 'ไซต์';
    ไซต์.textContent = (w.site || '') + (หมายเหตุ ? ' · ' + หมายเหตุ : '');
    กล่อง.appendChild(ไซต์);

    var ป้าย = document.createElement('span');
    ป้าย.className = 'ป้าย ' + (w['ผูกไลน์'] ? 'ผูก' : 'ยัง');
    ป้าย.textContent = w['ผูกไลน์'] ? 'ผูกไลน์แล้ว' : 'ยังไม่ผูกไลน์';
    กล่อง.appendChild(ป้าย);

    return กล่อง;
  }

  /* คนในไซต์ที่เลือก (ยังไม่กรองคำค้น) — ใช้เป็นฐานของทั้งตัวนับและรายการ */
  function คนในไซต์_() {
    var s = ไซต์ที่เลือก_();
    return สถานะ.คน.filter(function (w) { return String(w.site || '') === s; });
  }

  /* 🔴 ผู้ตรวจจับได้: รุ่นก่อนตั้งตัวนับครั้งเดียวตอนเปิดหน้า พอเลือกไซต์แล้วตัวเลขไม่ตาม
     รุ่นนี้ หัวจอ ตัวนับ และรายชื่อ อ้างไซต์เดียวกันเสมอ */
  function ปรับหัวและตัวนับ_() {
    var s = ไซต์ที่เลือก_();
    var ใน = คนในไซต์_();
    var ผูก = 0;
    ใน.forEach(function (w) { if (w['ผูกไลน์']) ผูก++; });
    จ('ห_ไซต์').textContent = s || 'ยังไม่ได้ผูกกับไซต์ใด';
    จ('น_ทั้งหมด').textContent = ใน.length;
    จ('น_ผูก').textContent = ผูก;
    จ('น_ยัง').textContent = ใน.length - ผูก;
  }

  function วาด_() {
    ปรับหัวและตัวนับ_();
    var คำ = จ('ค_หา').value.trim().toLowerCase();
    var แสดง = คนในไซต์_().filter(function (w) {
      return !คำ || String(w.name || '').toLowerCase().indexOf(คำ) > -1;
    });

    var ตาราง = จ('ห_ตาราง');
    ตาราง.textContent = '';
    if (!แสดง.length) {
      ว่าง_(คำ ? 'ไม่พบคนที่ค้นหา' : 'ไซต์นี้ยังไม่มีรายชื่อ',
            คำ ? 'ลองล้างคำค้น หรือเลือกไซต์อื่น' : 'ถ้าคิดว่าผิด แจ้งทีมงาน Jasmine');
      return;
    }
    จ('ห_ว่าง').hidden = true;
    var ถุง = document.createDocumentFragment();
    แสดง.forEach(function (w) { ถุง.appendChild(การ์ด_(w)); });
    ตาราง.appendChild(ถุง);
  }

  /* ── ขอรูป ──
     🔴 ผู้ตรวจจับได้: รุ่นก่อนตัดที่ 200 คนเงียบ ๆ คนที่ 201 ขึ้นไปไม่มีทางได้รูปเลย
        รุ่นนี้ขอทีเดียวถ้าไม่เกินเพดาน ถ้าเกินค่อยแบ่งเฉพาะส่วนที่เกิน ไม่ย้อนไปแบ่งกลุ่มละ 6 */
  function โหลดรูป_() {
    /* 🔴 ผู้ตรวจรอบ 11 จับได้: เดิมถ้ามีงานโหลดอยู่แล้วออกทันที
          พอสลับไซต์ระหว่างรูปยังโหลด รายชื่อเปลี่ยนเป็นไซต์ใหม่ แต่ระบบขอรูปของไซต์เก่า
          ⇒ ไซต์ใหม่เหลือแต่อักษรย่อ โดยไม่มีข้อความบอกอะไรเลย
          ใหม่: จำไว้ว่าต้องโหลดต่อ แล้วพอรอบเดิมจบค่อยเริ่มใหม่ด้วยไซต์ล่าสุด */
    if (สถานะ.กำลังโหลดรูป) { สถานะ.รอโหลดรูปใหม่ = true; return; }
    var ids = คนในไซต์_()
      .map(function (w) { return String(w.card_id || ''); })
      .filter(function (x) { return /^[0-9a-f]{24}$/i.test(x); });
    if (!ids.length) { สถานะ.ขอรูปแล้ว = true; วาด_(); return; }

    var ชุด = [];
    for (var i = 0; i < ids.length; i += ขนาดชุดขอรูป_) ชุด.push(ids.slice(i, i + ขนาดชุดขอรูป_));

    สถานะ.กำลังโหลดรูป = true;
    ตั้งปุ่มรูป_(true, 'กำลังโหลดรูป…');
    แจ้งรูป_('');

    var พัง = [], สถานะรวม = {};
    function ทีละชุด_(n) {
      if (n >= ชุด.length) return Promise.resolve();
      return ยิง_({ action: 'photos', card_ids: ชุด[n] }, true)
        .then(function (ผล) {
          if (!ผล || ผล.ok !== true) { พัง.push(แปลผิด_(ผล && ผล.error)); return; }
          (ผล.photos || []).forEach(function (p) {
            สถานะ.รูป[String(p.card_id)] = { url: p.url, 'สถานะ': p['สถานะ'] };
          });
          var ส = ผล['สถานะรูป'];
          if (ส && ส !== 'OK' && ส !== 'NO_ALLOWED') สถานะรวม[ส] = 1;
        })
        .catch(function () { พัง.push('ต่อเซิร์ฟเวอร์ไม่ได้'); })
        .then(function () { return ทีละชุด_(n + 1); });
    }

    ทีละชุด_(0).then(function () {
      สถานะ.กำลังโหลดรูป = false;
      ตั้งปุ่มรูป_(false, 'โหลดรูปใหม่');

      /* มีการสลับไซต์ระหว่างทาง (หรือสลับหลายทอด A → B → C)
         ⇒ ทิ้งผลรอบนี้ แล้วเริ่มใหม่ด้วยไซต์ที่เลือกอยู่ล่าสุด
         ทำก่อนนำผลรอบเก่ามาแสดง เพื่อไม่ให้ข้อความของไซต์เก่าค้างบนจอไซต์ใหม่
         และทำในนี้ทั้งกรณีสำเร็จและกรณีคำขอเดิมล้มเหลว เพราะโค้ดเดินมาถึงจุดนี้เสมอ */
      if (สถานะ.รอโหลดรูปใหม่) {
        สถานะ.รอโหลดรูปใหม่ = false;
        ขอรูปใหม่_();
        return;
      }

      สถานะ.ขอรูปแล้ว = true;
      var เหตุ = Object.keys(สถานะรวม).map(function (k) { return ข้อความรูป_[k] || k; });
      if (พัง.length) เหตุ.push(พัง[0]);
      /* 🔴 ข้อความรูปพังอยู่ในกรอบของตัวเอง รายชื่อยังอยู่ครบ ไม่ต้องโหลดหน้าใหม่ */
      แจ้งรูป_(เหตุ.length ? 'รูปยังแสดงไม่ได้: ' + เหตุ.join(' · ') : '');
      วาด_();
    });
  }

  function ตั้งปุ่มรูป_(ปิด, ข้อความ) {
    ['ป_รีรูป', 'ป_ลองรูปใหม่'].forEach(function (id) {
      var b = จ(id);
      b.disabled = !!ปิด;
      if (id === 'ป_รีรูป') b.textContent = ข้อความ;
    });
  }

  function ขอรูปใหม่_() {
    สถานะ.รูป = {}; สถานะ.ขอรูปแล้ว = false; วาด_(); โหลดรูป_();
  }

  function โหลดหน้าแรก_() {
    return ยิง_({ action: 'customer_home' }).then(function (ผล) {
      if (!ผล || ผล.ok !== true) {
        ว่าง_('เปิดหน้านี้ไม่ได้', แปลผิด_(ผล && ผล.error));
        return false;
      }
      สถานะ.ไซต์ = (ผล.sites || []).map(function (s) { return String(s); });
      สถานะ.คน  = ผล.workers || [];

      if (!สถานะ.ไซต์.length) {
        จ('ห_ไซต์').textContent = 'ยังไม่ได้ผูกกับไซต์ใด';
        ว่าง_('ยังไม่ได้ผูกกับไซต์ใด', ผล.note || 'แจ้งทีมงาน Jasmine');
        return false;
      }

      /* 🔴 ไซต์เดียว = เลือกให้เอง · หลายไซต์ = ต้องเลือกก่อน
            ไม่มีตัวเลือก "ทุกไซต์" เพื่อให้หัวจอ ตัวนับ รายชื่อ และกลุ่มที่จะประกาศ อ้างไซต์เดียวกันเสมอ */
      var เลือก = จ('ค_ไซต์');
      เลือก.textContent = '';
      สถานะ.ไซต์.forEach(function (s) {
        var o = document.createElement('option');
        o.value = s; o.textContent = s;
        เลือก.appendChild(o);
      });
      เลือก.value = สถานะ.ไซต์[0];
      เลือก.hidden = (สถานะ.ไซต์.length < 2);

      จ('ห_นับ').hidden = false;
      จ('ห_เครื่องมือ').hidden = false;

      if (!สถานะ.คน.length) {
        ปรับหัวและตัวนับ_();
        ว่าง_('ยังไม่มีรายชื่อในไซต์ของคุณ', ผล.note || 'ถ้าคิดว่าผิด แจ้งทีมงาน Jasmine');
        return false;
      }

      จ('ห_ท้าย').hidden = false;
      วาด_();   /* วาดชื่อก่อน รูปตามมาทีหลัง */

      var พร้อมรูป = ผล['รูป'] && ผล['รูป']['พร้อม'];
      if (พร้อมรูป === false) {
        สถานะ.ขอรูปแล้ว = true;
        แจ้งรูป_('ระบบยังไม่ได้ตั้งที่เก็บรูป จึงแสดงได้แค่ชื่อ — แจ้งทีมงาน Jasmine');
        จ('ห_ท้าย').hidden = true;
        วาด_();
        return true;
      }
      โหลดรูป_();
      return true;
    });
  }

  /* ── เริ่มทำงาน ── */
  ตั้งปุ่มรูป_(true, 'โหลดรูปใหม่');
  จ('ค_หา').addEventListener('input', วาด_);
  จ('ค_ไซต์').addEventListener('change', function () { ขอรูปใหม่_(); });
  จ('ป_รีรูป').addEventListener('click', ขอรูปใหม่_);
  จ('ป_ลองรูปใหม่').addEventListener('click', ขอรูปใหม่_);

  /* 🆕 รุ่น 1.3 — ปิดจอรูป: กดปุ่มกากบาท · แตะพื้นหลัง · ปุ่ม Esc */
  จ('ป_ปิดจอรูป').addEventListener('click', ปิดจอรูป_);
  จ('ห_จอรูป').addEventListener('click', function (e) {
    if (e.target === จ('ห_จอรูป')) ปิดจอรูป_();      /* แตะเฉพาะพื้นหลัง ไม่ใช่ตัวรูป */
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') ปิดจอรูป_();
  });

  (function เริ่ม_() {
    var ขาด = ค่าตั้งครบไหม_();
    if (ขาด) {
      ว่าง_('หน้านี้ยังตั้งค่าไม่ครบ',
            ขาด === 'LIFF_ID_NOT_SET'
              ? 'ยังไม่ได้ใส่รหัส LIFF ในไฟล์นี้ — แจ้งผู้ดูแลระบบ'
              : 'ยังไม่ได้ใส่ที่อยู่ API ในไฟล์นี้ — แจ้งผู้ดูแลระบบ');
      return;
    }
    if (typeof liff === 'undefined') {
      ว่าง_('เปิดหน้านี้ไม่ได้', 'โหลดตัว LINE ไม่สำเร็จ ลองเปิดใหม่อีกครั้ง');
      return;
    }
    liff.init({ liffId: LIFF_ID })
      .then(function () {
        if (!liff.isLoggedIn()) { liff.login(); return null; }
        ตั้งปุ่มรูป_(false, 'โหลดรูปใหม่');
        return โหลดหน้าแรก_();
      })
      .catch(function () {
        ว่าง_('เปิดหน้านี้ไม่ได้',
              'เชื่อมต่อ LINE ไม่สำเร็จ กรุณาปิดหน้านี้แล้วเปิดใหม่จากเมนู LINE');
      });
  })();
})();
</script>
</body>
</html>
