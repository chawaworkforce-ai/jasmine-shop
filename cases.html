<script>
/* สวิตช์ปิดหน้า (S4-4) 21 ก.ย. 2026 — ปิดหน้าไหนก็ได้โดยแก้ไฟล์ flags.json ไฟล์เดียว
   หลักที่ยึด: "อ่านไม่ได้ = เปิดตามปกติ" (fail-open)
   ถ้าเน็ตช้า ไฟล์หาย หรือไฟล์เสีย ⇒ หน้าทำงานปกติ ห้ามพังเพราะตัวกันพัง
   ใส่ ?ts= กับ no-store เพื่อไม่ให้ติดแคช 10 นาทีของ GitHub Pages ⇒ ปิดแล้วเห็นผลเกือบทันที */
(function () {
  try {
    if (!window.fetch || !window.AbortController) return;          // เบราว์เซอร์เก่า = เปิดตามปกติ
    var ชื่อหน้า = (location.pathname.split('/').pop() || '').replace(/\.html$/i, '') || 'index';
    var ตัวตัด = new AbortController();
    var นาฬิกา = setTimeout(function () { ตัวตัด.abort(); }, 3000); // เกิน 3 วินาที = เลิกถาม เปิดตามปกติ
    fetch('flags.json?ts=' + Date.now(), { cache: 'no-store', signal: ตัวตัด.signal })
      .then(function (r) { clearTimeout(นาฬิกา); return r.ok ? r.json() : null; })
      .then(function (ธง) {
        if (ธง && String(ธง[ชื่อหน้า] == null ? '' : ธง[ชื่อหน้า]).trim().toLowerCase() === 'off') {
          location.replace('maintenance.html?p=' + encodeURIComponent(ชื่อหน้า));
        }
      })
      .catch(function () { clearTimeout(นาฬิกา); });                 // อ่านไม่ได้ = เปิดตามปกติ
  } catch (e) { /* อะไรก็ตามที่พังตรงนี้ ห้ามทำให้หน้าพัง */ }
})();
</script>

    h += '<label>ตอบ / บันทึกความคืบหน้า (ไม่เกิน 300 ตัวอักษร)</label><textarea id="u-text" maxlength="300"></textarea><div class="cnt" id="u-cnt">0/300</div>'
       + '<div class="actions"><button class="btn" type="button" data-upd="">💬 ตอบ</button>'
       + (c.status !== 'กำลังแก้' ? '<button class="btn sec" type="button" data-upd="กำลังแก้">🔧 กำลังแก้</button>' : '')
       + '<button class="btn warn" type="button" data-upd="ปิด">✅ ปิดเคส (ต้องเขียนสรุป)</button></div></div>';
    return h;
  }

  /* ── ฟอร์มเปิดเคสใหม่ ── */
  var ฟอร์ม = { site: '', card_id: '' };
  function วาดฟอร์มใหม่_(){
    var d = ข้อมูล, h = '<button class="btn sec" type="button" data-back="1" style="margin:0 0 10px">← ยกเลิก</button>';
    /* 🔴 คำเตือนเรื่องร้องทุกข์ — ต้องอยู่เหนือกล่องเขียนทุกครั้ง (คู่มือ 3.2) */
    h += '<div class="warn-box">⚠️ ห้ามเขียนเรื่องที่น้องเล่าให้ฟังเป็นการส่วนตัว — เรื่องแบบนั้นใช้ช่องทางปรึกษาพี่มายเท่านั้น</div>';
    h += '<div class="card">';
    h += '<label>ไซต์</label><select id="n-site"><option value="">— เลือกไซต์ —</option>' + d.sites.map(function(s){ return '<option value="' + esc(s) + '"' + (s === ฟอร์ม.site ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>';
    var คน = d.workers.filter(function(w){ return ฟอร์ม.site && w.site === ฟอร์ม.site; });
    h += '<label>น้อง' + (ฟอร์ม.site ? ' (' + คน.length + ' คน)' : '') + '</label><div class="ppl" id="n-ppl">';
    if (!ฟอร์ม.site) h += '<div class="empty" style="padding:10px">เลือกไซต์ก่อน</div>';
    else if (!คน.length) h += '<div class="empty" style="padding:10px">ไซต์นี้ไม่มีน้องที่ยังทำงานอยู่</div>';
    else คน.forEach(function(w){ h += '<div class="p" role="button" data-pick="' + esc(w.card_id) + '" aria-pressed="' + (w.card_id === ฟอร์ม.card_id ? 'true' : 'false') + '"><div class="av">' + esc(ตัวย่อ_(w.name)) + '</div><div><div class="name" style="font-size:14px">' + esc(w.name) + '</div></div></div>'; });
    h += '</div>';
    h += '<label>หมวด</label><select id="n-cat"><option value="">— เลือก —</option>' + d.categories.map(function(x){ return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('') + '</select>';
    h += '<label>ที่มา</label><select id="n-src"><option value="">— เลือก —</option>' + d.sources.map(function(x){ return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('') + '</select>';
    h += '<label>เรื่อง (ไม่เกิน 300 ตัวอักษร)</label><textarea id="n-text" maxlength="300" placeholder="สั้น ๆ ว่าทีมเจออะไร เช่น ขาดงาน 3 วันไม่แจ้ง"></textarea><div class="cnt" id="n-cnt">0/300</div>';
    h += '<div class="actions"><button class="btn" type="button" id="n-submit">บันทึกเปิดเคส</button></div></div>';
    return h;
  }

  /* ── ผูกปุ่ม (เรียกหลังวาดทุกครั้ง) ── */
  function ผูกปุ่ม_(){
    var W = document.getElementById('wrap');
    var fs = document.getElementById('f-site'), fst = document.getElementById('f-status');
    if (fs) fs.onchange = function(){ ตัวกรอง.site = fs.value; โหลด_(); };
    if (fst) fst.onchange = function(){ ตัวกรอง.status = fst.value; โหลด_(); };
    Array.prototype.forEach.call(W.querySelectorAll('[data-open]'), function(el){ el.onclick = function(){ มุมมอง = { ชื่อ: 'เคส', case_id: el.getAttribute('data-open') }; วาด_(); }; });
    Array.prototype.forEach.call(W.querySelectorAll('[data-back]'), function(el){ el.onclick = function(){ มุมมอง = { ชื่อ: 'รายการ', case_id: '' }; วาด_(); }; });
    var ns = document.getElementById('n-site');
    if (ns) ns.onchange = function(){ ฟอร์ม.site = ns.value; ฟอร์ม.card_id = ''; วาด_(); };
    Array.prototype.forEach.call(W.querySelectorAll('[data-pick]'), function(el){ el.onclick = function(){ ฟอร์ม.card_id = el.getAttribute('data-pick'); Array.prototype.forEach.call(W.querySelectorAll('[data-pick]'), function(x){ x.setAttribute('aria-pressed', x === el ? 'true' : 'false'); }); }; });
    var nt = document.getElementById('n-text'), nc = document.getElementById('n-cnt');
    if (nt) nt.oninput = function(){ nc.textContent = nt.value.length + '/300'; nc.className = 'cnt' + (nt.value.length > 300 ? ' over' : ''); };
    var ut = document.getElementById('u-text'), uc = document.getElementById('u-cnt');
    if (ut) ut.oninput = function(){ uc.textContent = ut.value.length + '/300'; };
    var sb = document.getElementById('n-submit');
    if (sb) sb.onclick = ส่งเปิดเคส_;
    Array.prototype.forEach.call(W.querySelectorAll('[data-upd]'), function(el){ el.onclick = function(){ ส่งอัปเดต_(el.getAttribute('data-upd')); }; });
  }

  /* ── ส่ง case_open ── */
  function ส่งเปิดเคส_(){
    var cat = document.getElementById('n-cat').value, src = document.getElementById('n-src').value, text = document.getElementById('n-text').value.trim();
    if (!ฟอร์ม.card_id){ toast('เลือกน้องก่อน', true); return; }
    if (!cat || !src){ toast('เลือกหมวดและที่มาก่อน', true); return; }
    if (!text){ toast('เขียนเรื่องก่อน', true); return; }
    if (text.length > 300){ toast('เรื่องยาวเกิน 300 ตัวอักษร', true); return; }
    var rid = กุญแจสำหรับ_('case_open', false);
    if (!rid){ toast('เบราว์เซอร์นี้สร้างกุญแจกันซ้ำไม่ได้ (crypto.randomUUID) — เปิดใน LINE บนมือถือแทน', true); return; }
    var ปุ่ม = document.getElementById('n-submit'); ปุ่ม.disabled = true; ปุ่ม.textContent = 'กำลังบันทึก…';   /* 🔴 ปิดปุ่มทันที */
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'case_open', userId: โปรไฟล์ ? โปรไฟล์.userId : '', card_id: ฟอร์ม.card_id, category: cat, source: src, text: text, req_id: rid }) })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (!data || data.ok === false){
        var e = data && data.error;
        if (e === 'BUSY'){ toast('ระบบกำลังทำงานอื่นอยู่ กดบันทึกอีกครั้ง (กุญแจเดิม ไม่ซ้ำแน่นอน)', true); }   /* BUSY → กุญแจเดิม */
        else if (e === 'REQ_ID_REUSED'){ ล้างกุญแจ_('case_open'); toast('กุญแจกันซ้ำอันเดิมถูกใช้ไปกับเคสอื่นแล้ว — กดบันทึกอีกครั้ง', true); }   /* 🆕 1.1 */
        else { ล้างกุญแจ_('case_open'); toast('เปิดเคสไม่สำเร็จ' + (e ? ' (' + e + ')' : ''), true); }             /* FAIL → กุญแจใหม่รอบหน้า */
        ปุ่ม.disabled = false; ปุ่ม.textContent = 'บันทึกเปิดเคส'; return;
      }
      ล้างกุญแจ_('case_open');
      var msg = (data.ซ้ำ ? 'เคสนี้เปิดไปแล้ว ' : 'เปิดเคสแล้ว ') + (data.case_id || '');
      if (data.ส่งไลน์ !== 'OK') msg += ' · ⚠️ แจ้งทีมไม่สำเร็จ กรุณาบอกทีมเอง';   /* คู่มือ 3.2: เปิดสำเร็จแล้วจริง ห้ามบอกว่าไม่สำเร็จ */
      toast(msg, data.ส่งไลน์ !== 'OK');
      ฟอร์ม = { site: '', card_id: '' }; มุมมอง = { ชื่อ: 'รายการ', case_id: '' }; ตัวกรอง.status = '';
      โหลด_();
    })
    .catch(function(){ ปุ่ม.disabled = false; ปุ่ม.textContent = 'บันทึกเปิดเคส'; toast('ส่งไม่ออก — ถ้าเน็ตกลับมาให้กดใหม่ (กุญแจเดิม ไม่ซ้ำแน่นอน)', true); });   /* ยิงไม่ออกเลย → ยังไม่รู้ผล เก็บกุญแจเดิม */
  }

  /* ── ส่ง case_update ── */
  function ส่งอัปเดต_(status){
    var text = (document.getElementById('u-text') || { value: '' }).value.trim();
    if (status === 'ปิด' && !text){ toast('ปิดเคสต้องเขียนสรุปอย่างน้อย 1 บรรทัด', true); return; }
    if (!status && !text){ toast('เขียนข้อความก่อน', true); return; }
    if (text.length > 300){ toast('ยาวเกิน 300 ตัวอักษร', true); return; }
    if (เคสของกุญแจอัปเดต !== มุมมอง.case_id) { ล้างกุญแจ_('case_update'); เคสของกุญแจอัปเดต = มุมมอง.case_id; }   /* 🔴 1.1 เปลี่ยนเคส = กุญแจใหม่เสมอ */
    var rid = กุญแจสำหรับ_('case_update', false);
    if (!rid){ toast('เบราว์เซอร์นี้สร้างกุญแจกันซ้ำไม่ได้ — เปิดใน LINE บนมือถือแทน', true); return; }
    var ปุ่มทั้งหมด = document.querySelectorAll('[data-upd]'); Array.prototype.forEach.call(ปุ่มทั้งหมด, function(b){ b.disabled = true; });
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'case_update', userId: โปรไฟล์ ? โปรไฟล์.userId : '', case_id: มุมมอง.case_id, status: status, text: text, req_id: rid }) })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (!data || data.ok === false){
        var e = data && data.error;
        if (e === 'BUSY'){ toast('ระบบกำลังทำงานอื่นอยู่ กดอีกครั้ง', true); }
        /* 🆕 1.1: กุญแจถูกใช้กับงานอื่นไปแล้ว — ขอกุญแจใหม่แล้วให้กดซ้ำ (ห้ามบอกว่าบันทึกแล้ว) */
        else if (e === 'REQ_ID_REUSED'){ ล้างกุญแจ_('case_update'); toast('กุญแจกันซ้ำอันเดิมถูกใช้ไปกับงานอื่นแล้ว — กดอีกครั้งเพื่อบันทึกงานนี้', true); }
        else { ล้างกุญแจ_('case_update'); toast('บันทึกไม่สำเร็จ' + (e ? ' (' + e + ')' : ''), true); }
        Array.prototype.forEach.call(ปุ่มทั้งหมด, function(b){ b.disabled = false; }); return;
      }
      ล้างกุญแจ_('case_update');
      /* 🔴 1.2 (ทีมตรวจรอบ 2 · GPT ข้อ 3): ok:true = "รับคำขอแล้ว" ไม่ใช่ "สถานะเปลี่ยนสำเร็จ"
         และ "ไม่ทราบผล" ≠ "ไม่สำเร็จ" — ห้ามฟันธงแทนระบบ
           FAIL    = รู้แน่ว่าสถานะไม่ได้เปลี่ยน
           UNKNOWN/PENDING = ยังยืนยันไม่ได้ ต้องให้คนไปดูเอง
           บันทึกสถานะ:false = ช่องผลในแถวประวัติยังค้าง ไม่ได้แปลว่างานไม่สำเร็จ */
      var เตือนประวัติ = (data.บันทึกสถานะ === false) ? ' · ประวัติยังไม่ยืนยัน (แจ้งผู้ดูแล)' : '';
      var สำเร็จเดิม = data.ซ้ำ ? 'บันทึกไปแล้วก่อนหน้านี้' : (status === 'ปิด' ? 'ปิดเคสแล้ว' : 'บันทึกแล้ว');
      if (data.ผล === 'FAIL'){
        toast('บันทึกข้อความแล้ว แต่สถานะไม่ได้เปลี่ยน (FAIL) — ดูหน้าจอหลังโหลดใหม่' + เตือนประวัติ, true);
      } else if (data.ผล && data.ผล !== 'OK'){
        toast('บันทึกข้อความแล้ว แต่ยังยืนยันไม่ได้ว่าสถานะเปลี่ยนหรือยัง (' + data.ผล + ') — โหลดใหม่แล้วดูสถานะ' + เตือนประวัติ, true);
      } else if (เตือนประวัติ){
        toast(สำเร็จเดิม + เตือนประวัติ, true);
      } else {
        toast(สำเร็จเดิม);
      }
      if (status === 'ปิด' && (!data.ผล || data.ผล === 'OK')) มุมมอง = { ชื่อ: 'รายการ', case_id: '' };   /* ปิดสำเร็จจริงเท่านั้นถึงกลับหน้ารายการ (1.1) */
      โหลด_();   /* ตอบ/กำลังแก้ → โหลดใหม่แล้วอยู่ที่เคสเดิม เห็นไทม์ไลน์ใหม่ทันที */
    })
    .catch(function(){ Array.prototype.forEach.call(ปุ่มทั้งหมด, function(b){ b.disabled = false; }); toast('ส่งไม่ออก — กดใหม่ได้ (กุญแจเดิม)', true); });
  }

  /* ── เริ่ม ── */
  document.getElementById('btn-new').onclick = function(){ กุญแจสำหรับ_('case_open', true); ฟอร์ม = { site: ตัวกรอง.site, card_id: '' }; มุมมอง = { ชื่อ: 'ใหม่', case_id: '' }; วาด_(); };   /* สร้างกุญแจตอนเริ่มกรอก */
  (async function(){
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()){ liff.login(); return; }
      โปรไฟล์ = (โปรไฟล์เร็ว_() || await liff.getProfile());
      document.getElementById('hsub').textContent = 'ทีมหลังบ้าน · ' + (โปรไฟล์.displayName || '');
      โหลด_();
    } catch (e) {
      document.getElementById('hsub').textContent = 'เชื่อมต่อ LINE ไม่สำเร็จ';
      จอสถานะ_('เชื่อมต่อ LINE ไม่สำเร็จ<br><button type="button" onclick="location.reload()">ลองใหม่</button>');
    }
  })();
</script>
